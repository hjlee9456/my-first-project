       <p>다만 보호자에게 <b>따로 더 받은 추가 수납금</b>이 있다면 그 부분은 622목으로 반환합니다.</p>
       <p>프로그램에서 위탁 원아를 정산하면 이 안내가 자동으로 뜹니다.</p>`,
    law:"본문 8p · 부록 182p 위탁보육계약서(예시) 제5조 ⑥" },

  /* ---- 수납 ---- */
  { g:"수납", q:"피복류를 신청하지 않은 아이가 있어요.",
    k:"피복류 원복 미신청 선택 입학준비금 빈칸",
    a:`<p>그 아이 칸을 <b>0원으로 두면 됩니다.</b> 0원인 칸은 아예 기록이 만들어지지 않아 대장에도 빈칸으로 남습니다.</p>
       <p>입학준비금은 총액·세부항목·항목별 금액을 알린 뒤 <b>부모가 고른 세부 항목의 비용만</b> 받는 것이므로, <b>아이마다 금액이 다른 것이 정상</b>입니다.</p>
       <p>원복만 신청한 아이와 가방까지 신청한 아이가 섞여 있으면, 세목을 <code>입학준비금-원복</code>, <code>입학준비금-가방</code>처럼 나눠 두면 더 깔끔합니다.</p>`,
    law:"본문 94p" },

  { g:"수납", q:"3월에 1년치를 한꺼번에 받았습니다. 반기 보고서가 이상해 보여요.",
    k:"일시납 연간 한꺼번에 선납 반기 이월",
    a:`<p><b>받은 날짜 그대로</b> 적는 것이 맞습니다. 통장·수입대장과 숫자가 그대로 맞아떨어져야 하기 때문입니다.</p>
       <p>그래서 <b>상반기</b> 보고서에는 수납액 전액이, <b>하반기</b> 보고서에는 수납액 0원이 찍힙니다. 대신 하반기 보고서에는 <b>「전반기 이월」 열이 자동으로 생겨</b> 상반기에 남은 금액이 맨 앞에 표시됩니다.</p>
       <p>즉 하반기 보고서는 <b>전반기 이월 + 당반기 수납 − 실 사용 − 반환 = 남은 금액</b>으로 읽으면 됩니다.</p>` },

  { g:"수납", q:"수납액을 잘못 입력했어요.",
    k:"수정 잘못 고치기 오타 삭제",
    a:`<p><b>수납 입력</b> 화면 아래 <b>수납 내역</b>에서 그 날짜·세목 줄의 <b>「불러와 수정」</b>을 누르세요. 그때 입력한 내용이 그대로 올라옵니다. 고쳐서 다시 저장하면 덮어써집니다.</p>
       <p>그 날짜의 수납을 통째로 지우려면 같은 줄의 <b>「삭제」</b>를 누르세요.</p>` },

  { g:"수납", q:"수입결의서 한 장에 여러 세목이 섞여 있습니다.",
    k:"여러 세목 한 장 결의서 섞임 입학준비금 현장학습비 행사비 같이 한번에",
    a:`<p>실제 수입결의서는 한 장에 여러 세목이 섞여 있는 것이 보통입니다.
         관·항·목은 「수익자부담수입 / 기타필요경비 / 기타필요경비」로 하나이고,
         적요에 <b>입학준비금 · 현장학습비 · 행사비</b>가 나란히 적힙니다.</p>
       <p><b>수납 입력</b> 화면에서 <b>「+ 세목 칸 추가」</b>를 누르세요. 칸이 하나 더 생깁니다.
         칸마다 세목·대상 원아·금액·카드수수료를 따로 적으면 됩니다.
         수납일·결의서 번호·적요는 맨 위에 <b>한 번만</b> 적습니다.</p>
       <p>맨 아래 <b>이 결의서 합계</b>가 결의서의 「금 ○○원정」과 맞는지 보세요.</p>
       <p>저장하면 <b>세목마다 결의서 하나씩</b>으로 나뉘어 담깁니다.
         정산·대장이 세목별로만 뜻이 있기 때문입니다 (세목 간 상계 금지).
         목록에서는 같은 번호끼리 <b>「같은 결의서 ○개 세목」</b>으로 묶여 보이고,
         그중 아무 줄이나 <b>「수정」</b>을 누르면 <b>그 번호의 세목 칸이 전부</b> 올라옵니다.</p>
       <div class="warn"><p>결의서 번호를 비워 두면 묶을 근거가 없습니다.
         한 장으로 묶으려면 <b>번호를 꼭 적어</b> 주세요.</p></div>` },

  { g:"수납", q:"카드로 받았더니 수수료가 빠지고 입금됐습니다.",
    k:"카드 수수료 결제 차감 승인액 순액 총액 통장",
    a:`<p>수수료는 <b>지출이 아니라 수납 쪽</b> 일입니다. <b>수납 입력</b> 화면
         「3. 수납액 확인」의 <b>「카드수수료」</b> 칸에 그 결의서 전체 수수료를 적으세요.</p>
       <p>적는 방법이 어린이집마다 둘로 갈립니다. <b>기초설정 → 4. 카드수수료 처리 방식</b>에서
         우리 어린이집이 하던 쪽을 한 번만 골라 두면, 수납 입력이 그대로 따라갑니다.</p>
       <table><thead><tr><th style="width:110px">방식</th><th>50,000원 결제 · 수수료 3원이면</th></tr></thead><tbody>
         <tr><td><b>순액 방식</b></td><td>통장에 찍힌 <b>49,997원</b>을 수입결의·정산 수납액으로 잡습니다.
           수수료를 따로 지출결의하지 않습니다. 「일괄 적용」을 누르면 1인당 수납액에서 수수료 몫을 빼서 채워 줍니다.</td></tr>
         <tr><td><b>총액 방식</b></td><td>승인액 <b>50,000원</b>을 수입결의·정산 수납액으로 잡고,
           수수료 3원은 <b>운영비에서 따로 지출결의</b>로 뺍니다.</td></tr>
       </tbody></table>
       <p>어느 쪽이든 원아별 배분과 잔액은 표에 적힌 수납액으로만 계산합니다.</p>`,
    law:"2025년 어린이집 재무회계 매뉴얼 19p" },

  { g:"수납", q:"세목마다 얼마 만에 한 번 걷는지 적어 둘 수 있나요?",
    k:"수납주기 주기 매월 분기 반기 연 수시",
    a:`<p><b>기초설정 → 3. 세목 설정</b>의 <b>「수납주기」</b> 칸에서 고르세요.
         매월 · 분기별 · 반기별 · 연 1회 · 수시 중 하나입니다.</p>
       <p>금액 계산에는 쓰지 않습니다. <b>수납 입력</b> 화면 맨 위에 「무엇을 언제 걷는 돈인지」가
         함께 나와, 담당자가 바뀌어도 헷갈리지 않게 하는 용도입니다.</p>` },

  { g:"대장", q:"손으로 날인하던 「수입부 대장」처럼 날짜만 적힌 표가 필요합니다.",
    k:"수입부 대장 날인 징수실적 날짜 수납일",
    a:`<p><b>대장</b> 탭에서 구분을 <b>「기타필요경비 수입부 대장 (수납일)」</b>로 바꾸세요.</p>
       <p>월별 칸에 금액 대신 <b>수납한 날짜</b>가 들어갑니다. 한 달에 두 번 받았으면 두 날짜가 함께 나옵니다.
         맨 오른쪽은 그 세목을 <b>몇 번 받았는지</b>입니다.</p>
       <p>수납 입력에 적은 수납일이 그대로 올라오므로 따로 옮겨 적을 필요가 없습니다.</p>` },

  { g:"정산·보고", q:"이 프로그램은 어디까지 해 주나요? 실제 반환 처리도 하나요?",
    k:"어디까지 범위 반환 처리 이체 계좌 역할",
    a:`<p><b>반환할 금액을 계산해 정산서를 뽑는 데까지</b>입니다.</p>
       <ul><li>받은 돈과 쓴 돈을 원아별·세목별로 맞춰 <b>얼마를 돌려줘야 하는지</b> 계산합니다.</li>
       <li>그 결과를 <b>정산서·안내문·보고서</b>로 인쇄해 드립니다.</li></ul>
       <p>여기까지가 손이 많이 가고 틀리기 쉬운 부분이라 프로그램이 맡습니다.
         <b>실제 계좌 이체, 반납결의, 회계 전표 처리는 이 정산서를 보고 어린이집에서 진행</b>하시면 됩니다.
         프로그램은 계좌번호를 받아 두지도, 반환했다는 기록을 남기지도 않습니다.</p>` },

  { g:"수납", q:"더 받은 돈(과오납)을 돌려줘야 합니다.",
    k:"과오납 착오 더받음 반납 세입 반납결의",
    a:`<p>돌려주는 이유에 따라 <b>회계에서 처리하는 길이 다릅니다.</b> 돈이 나가는 것은 같지만 장부에 적는 자리가 다릅니다.</p>
       <table><thead><tr><th>어떤 경우</th><th>어떻게 처리하나</th></tr></thead><tbody>
         <tr><td>실수로 더 받았다 <span class="hint">(과오납)</span></td>
             <td><b>받았던 세입 계정에서 그대로 빼서</b> 돌려줍니다.<br>
                 처음부터 받지 말았어야 할 돈이라 <b>수입을 되돌리는</b> 것입니다.</td></tr>
         <tr><td>제대로 받았는데 안 쓰고 남았다<br><span class="hint">(퇴소·특별활동 미참여·연말 잔액)</span></td>
             <td><b>622목 보호자 반환금</b>으로 <b>지출 결재를 올려</b> 돌려줍니다.<br>
                 정당하게 받은 돈을 <b>지출로 내보내는</b> 것이라, 지출결의서를 쓰듯 결재를 밟습니다.
                 이 결재를 실무에서 <b>‘반납결의’</b>라고 부릅니다.</td></tr>
       </tbody></table>
       <p>이 프로그램에서는 반환할 때 <b>사유만 고르면</b> 어느 길로 가는지 함께 적어 줍니다. 외우실 필요 없습니다.</p>`,
    law:"부록 12p · 부록 62p" },

  /* ---- 지출 ---- */
  { g:"지출", q:"전세버스 2대를 한 건으로 결제했습니다. 어떻게 나눠 적나요?",
    k:"전세버스 차량 일괄 총액 나누기 배분",
    a:`<p><b>나눠 적지 마세요.</b> 지출결의서 1건을 그대로 1건으로 등록하는 것이 이 프로그램의 방식입니다.</p>
       <ol><li>총액에 결제한 전체 금액을 적습니다.</li>
       <li>대상 원아를 체크합니다.</li>
       <li>1인당 금액은 <b>프로그램이 자동으로 나눠</b> 개인별 대장까지 채웁니다.</li></ol>
       <p>예전에는 적요에 <code>차량대여2대(70/1,320,000)</code>처럼 <b>인원수만</b> 남아 누구인지 알 수 없었지만, 이제는 <b>명단이 통째로 저장</b>되어 담당자가 바뀌어도 근거가 남습니다.</p>` },

  { g:"지출", q:"지출 중 일부만 필요경비이고 나머지는 어린이집 운영비입니다.",
    k:"운영비 분리 일부 부담 어린이집",
    a:`<p><b>「필요경비 부담분」</b>에 원아들에게 나눌 금액만 적으세요.</p>
       <p><b>「운영비 부담분」은 자동으로 계산</b>됩니다 (총액 − 필요경비 부담분). 이 금액은 원아에게 배분되지 않고 어린이집 부담으로 집계됩니다.</p>
       <p>전액이 필요경비라면 <b>「전액 필요경비」</b> 버튼을 누르면 됩니다.</p>` },

  { g:"지출", q:"금액이 딱 나눠떨어지지 않습니다. (100,000원 ÷ 3명)",
    k:"나눠떨어지지 원 단수 소수점 나머지 1원",
    a:`<p>걱정하지 않으셔도 됩니다. 1인당 <b>33,333원</b>으로 하고 남는 <b>1원</b>을 <b>앞 순번 1명에게 더</b> 붙입니다. (33,334 + 33,333 + 33,333 = 100,000)</p>
       <p>이 방식이라 <b>배분 합계가 필요경비 부담분과 1원도 어긋나지 않습니다.</b> 221목↔421목 대사가 그대로 떨어집니다.</p>
       <p>만약 어긋나면 프로그램이 <b>저장 자체를 막습니다.</b></p>` },

  { g:"지출", q:"참여하는 아이가 행사마다 달라요.",
    k:"건별 매번 다름 현장학습 행사 명단",
    a:`<p><b>기초설정 → 세목</b>에서 그 세목의 <b>「대상 원아 선정」을 '건별 체크'</b>로 바꿔 두세요. 현장학습비·행사비가 여기 해당합니다.</p>
       <p>반대로 차량 이용 원아나 특별활동 과목 참여자처럼 <b>매번 같은 아이들</b>이라면 <b>'고정 명단'</b>으로 두고, 기초설정에서 명단을 만들어 두세요. 지출 등록에서 <b>「명단 불러오기」</b> 한 번이면 됩니다.</p>
       <p>불러온 뒤에도 그 건에서만 빼거나 더할 수 있습니다.</p>` },

  { g:"지출", q:"이미 등록한 지출건을 나중에 고칠 수 있나요?",
    k:"수정 변경 고치기 나중에 정정",
    a:`<p><b>언제든 몇 번이든 고칠 수 있습니다.</b></p>
       <p><b>지출 등록</b> 화면 아래 <b>지출 내역</b>에서 <b>「수정」</b>을 누르면 그 건의 금액·적요·대상 원아가 그대로 올라옵니다. 고쳐서 저장하면 <b>개인별 대장·정산서·보고서가 전부 자동으로 다시 계산</b>됩니다.</p>
       <p>이미 정산서를 뽑은 뒤라도 상관없습니다. 고친 다음 다시 뽑으면 됩니다.</p>
       <p>원아별 현황에서 금액을 누르면 그 지출건으로 바로 이동합니다.</p>` },

  { g:"지출", q:"월 단위 비용(유류비 등)인데 그 달 중간에 퇴소한 아이가 있습니다.",
    k:"유류비 월단위 퇴소 그달 일할 포함",
    a:`<p>프로그램이 <b>자동으로 판정하지 않습니다.</b> 정답이 하나로 정해져 있지 않기 때문입니다.</p>
       <p><b>정산·보고 → 중간퇴소 정산</b>으로 가면, 퇴소일이 속한 달의 지출건을 <b>하나씩 보여주며 포함할지 물어봅니다.</b> 체크하고 사유를 적으면, 그 <b>선택 결과와 사유가 정산서에 근거로 남습니다.</b></p>
       <p>지출 등록 화면에서는 퇴소 후 날짜의 아이가 계속 잠겨 있습니다. 잠금이 풀리는 건 정산 화면뿐입니다.</p>` },

  { g:"지출", q:"수납액보다 더 많이 썼습니다.",
    k:"초과 부족 모자람 마이너스 적자",
    a:`<p>원아별 현황과 검증 화면에 <b>초과 표시</b>가 뜹니다.</p>

  { g:"지출", q:"「잔액이 모자랍니다 — 운영비에서 나가야 합니다」가 떴어요.",
    k:"잔액 모자람 부족 초과 음수 마이너스 운영비 부담 12월 4분기 경고",
    a:`<p><b>막는 경고가 아닙니다. 그대로 등록하셔도 됩니다.</b>
         「이만큼은 보호자 돈이 아니라 어린이집 돈으로 나간다」고 미리 알려 드리는 것입니다.</p>

       <h4 style="margin:12px 0 4px">「대상 20명 가운데 3명」이 무슨 뜻인가</h4>
       <p>지출건 하나는 <b>여러 원아가 나눠 부담</b>합니다.
         그 원아들이 그동안 낸 돈은 저마다 다르므로,
         <b>같은 지출건이라도 어떤 아이는 잔액이 남고 어떤 아이는 모자랄 수 있습니다.</b></p>
       <p>그래서 알림은 <b>이 지출건의 대상 원아가 몇 명이고, 그중 몇 명의 잔액이 모자라는지</b>를
         함께 적습니다. 중간에 들어온 아이, 특정 세목을 신청하지 않은 아이처럼
         낸 돈이 적은 아이부터 모자라기 시작합니다.</p>

       <h4 style="margin:12px 0 4px">왜 이런 일이 생기나</h4>
       <p>보호자에게 30,000원을 받아 두고 35,000원을 썼다면 5,000원이 모자랍니다.
         모자란 5,000원을 보호자에게 더 받을 수는 없습니다.
         <b>그 몫은 어린이집 운영비에서 나가야 합니다.</b>
         그래서 보호자 정산에서는 <b>잔액이 0에서 멈추고 마이너스로 내려가지 않습니다.</b>
         (정산서에 마이너스가 섞이면 보호자도 어린이집도 읽기 어려워집니다)</p>

       <h4 style="margin:12px 0 4px">왜 12월부터만 알리나</h4>
       <p>어린이집은 <b>한 해를 통으로</b> 정산하지, 매달 세목별 잔액을 맞추지 않습니다.
         3월에 한 학기치를 걷어 두고 쓰다 보면 <b>초반 몇 달은 잔액이 마이너스인 것이 오히려 흔하고</b>,
         다음 분기 수납이 들어오면 저절로 메워집니다.
         그때마다 경고를 띄우면 헛경고만 쌓여 아무도 보지 않게 됩니다.</p>
       <p>그러나 <b>4분기(12월·1월·2월)</b>에 들어서면 더 들어올 수납이 사실상 없습니다.
         이때부터 모자라면 그 몫은 끝내 어린이집이 부담하게 됩니다.
         <b>그래서 12월 지출부터만 알립니다.</b></p>
       <table><thead><tr><th style="width:150px">지출일</th><th>잔액이 모자랄 때</th></tr></thead><tbody>
         <tr><td>3월 ~ 11월</td><td>알리지 않습니다. 다음 분기 수납으로 메워지는 것이 보통입니다.</td></tr>
         <tr><td><b>12월 ~ 익년 2월</b></td><td><b>알립니다.</b> 모자란 금액과 그 원아를 짚어 줍니다.</td></tr>
       </tbody></table>

       <h4 style="margin:12px 0 4px">알림이 떴을 때 할 수 있는 것</h4>
       <ol>
         <li><b>그대로 등록한다</b> — 가장 흔합니다. 모자란 몫을 어린이집이 부담하는 것으로 정리됩니다.</li>
         <li><b>「필요경비 부담분」을 낮춘다</b> — 모자란 만큼을 운영비 부담분으로 돌리면
           그 금액이 애초에 원아에게 배분되지 않습니다. 회계상 더 깔끔한 쪽입니다.</li>
         <li><b>지출 금액 자체를 다시 본다</b> — 잘못 적은 것은 아닌지 확인합니다.</li>
       </ol>
       <p>12월이 지나면 <b>검증</b> 탭에서도 세목별로 잔액이 모자란 원아를 한 번에 볼 수 있습니다.</p>` },

  { g:"정산·보고", q:"표 머리의 (A) (B) (C)는 무슨 뜻인가요?",

  { id:"full",  ic:"📘", tt:"상세 설명서",  ds:"처음 쓰는 분을 위한<br>차근차근 전체 설명" },

  { id:"faq",   ic:"🧭", tt:"상황별 안내",   ds:"“이럴 땐 어떻게?”<br>상황을 찾아 그대로 따라 하기" },
];

function renderManual(root){
  const v = view.manual = Object.assign({ mode: null, q: "" }, view.manual || {});

  if (!v.mode) {
    root.innerHTML = `<h2 class="no-print">사용설명서</h2>
      <p class="hint" style="text-align:center;margin-top:6px">읽고 싶은 설명서를 고르세요. 화면에서 읽거나 인쇄할 수 있습니다.</p>
      <div class="man-cards">
        ${MANUAL_MODES.map(m => `<div class="man-card" data-m="${m.id}">
          <div class="ic">${m.ic}</div><div class="tt">${esc(m.tt)}</div><div class="ds">${m.ds}</div></div>`).join("")}
      </div>`;
    for (const m of MANUAL_MODES) $(`[data-m="${m.id}"]`, root).onclick = () => { v.mode = m.id; render(); };
    return;
  }

  const cur = MANUAL_MODES.find(m => m.id === v.mode);
  const sources = `<div class="intro" style="font-size:12.5px;line-height:1.9">
    <b>이 설명서가 인용하는 근거 자료</b><br>
    설명 끝의 <b>「근거 —」</b>에 붙는 약칭은 다음을 가리킵니다.
    <table style="margin-top:8px"><thead><tr>
      <th style="width:80px">약칭</th><th>자료</th></tr></thead><tbody>
      <tr><td><b>본문</b></td><td>보건복지부 「2026년도 보육사업안내」 <b>본문</b> (쪽수는 본문 기준)</td></tr>
      <tr><td><b>부록</b></td><td>보건복지부 「2026년도 보육사업안내」 <b>부록</b> (쪽수는 부록 기준)</td></tr>
      <tr><td><b>매뉴얼</b></td><td>보건복지부 「어린이집 재무회계 매뉴얼」</td></tr>
      <tr><td><b>규칙</b></td><td>「사회복지법인 및 사회복지시설 재무·회계 규칙」</td></tr>
      <tr><td><b>법</b></td><td>「영유아보육법」 및 같은 법 시행규칙</td></tr>
    </tbody></table>
    <div style="margin-top:8px">지침·매뉴얼은 해마다 개정되므로, 실제 처리 전에는
      <b>그 해 자료의 해당 쪽을 직접 확인</b>하시기 바랍니다.</div>
  </div>`;
  root.innerHTML = `
    <div class="row no-print" style="margin-bottom:12px">
      <button class="b" id="mn_back">← 설명서 고르기</button>
      <h2 style="margin:0 8px">${cur.ic} ${esc(cur.tt)}</h2>
      <span class="grow"></span>
      <button class="b" id="mn_print">인쇄</button>
    </div>
    <div id="mn_body" class="man"></div>`;
  $("#mn_back", root).onclick = () => { v.mode = null; render(); };
  $("#mn_print", root).onclick = () => window.print();

  const body = $("#mn_body", root);
  if (v.mode === "full")  body.innerHTML = manualFull(sources);
  if (v.mode === "quick") body.innerHTML = manualQuick(sources);
  if (v.mode === "faq")   manualFaq(body, v, sources);
}

function manualFaq(body, v, sources){
  body.innerHTML = `
    <h1>상황별 안내 — “이럴 땐 어떻게?”</h1>
    ${sources}
    <div class="intro">실무에서 자주 부딪히는 상황을 모았습니다.
      아래 칸에 <b>겪고 있는 상황의 단어</b>를 넣어 보세요. (예: 퇴소, 위탁, 나눠떨어, 카드, 백업)</div>
    <div class="faq-search no-print">
      <input id="fq" placeholder="상황 검색 — 예: 중간에 그만뒀어요 / 카드 수수료 / 반이 바뀜"
        value="${esc(v.q)}" style="width:100%;padding:9px 12px;font-size:14px">
    </div>
    <div id="fqlist"></div>`;

  const listHost = $("#fqlist", body);
  const input = $("#fq", body);

  function draw(){
    const q = v.q.trim().toLowerCase();
    const hits = FAQ.filter(f => !q ||
      (f.q + " " + f.k + " " + f.g + " " + f.a).toLowerCase().includes(q));
    listHost.innerHTML = "";

    if (!hits.length) {
      listHost.innerHTML = `<div class="empty">찾는 상황이 없습니다. 다른 단어로 찾아보시거나, 전체 목록을 보려면 검색어를 지우세요.</div>`;
      return;
    }
    if (q) listHost.appendChild(el(`<p class="hint no-print">${hits.length}건을 찾았습니다.</p>`));

    const groups = [];
    for (const f of hits) {
      let g = groups.find(x => x.name === f.g);
      if (!g) groups.push(g = { name: f.g, list: [] });
      g.list.push(f);
    }
    for (const g of groups) {
      const box = el(`<div class="faq-g"><div class="gt">${esc(g.name)}</div></div>`);
      for (const f of g.list) {
        box.appendChild(el(`<details class="faq" ${q ? "open" : ""}>
          <summary>${esc(f.q)}</summary>
          <div class="ans">${f.a}${f.law ? `<div class="law">근거 — ${esc(f.law)}</div>` : ""}</div>
        </details>`));
      }
      listHost.appendChild(box);
    }
  }
  input.oninput = e => { v.q = e.target.value; draw(); };
  draw();
}

    <p><b>① 입력한 자료는 “이 컴퓨터의 이 브라우저 안에만” 저장됩니다.</b><br>
      아동 이름·계좌번호가 밖으로 나가지 않도록 인터넷 서버를 쓰지 않습니다.
      대신 다른 컴퓨터에서 열거나 브라우저 자료를 청소하면 보이지 않게 됩니다. → 그래서 ②번이 중요합니다.</p>
    <p><b>② 가끔 「자료 백업」을 꼭 하세요. (= 보험)</b><br>
      화면 맨 위 <b>「자료 백업」</b>을 누르면 그동안 입력한 자료가 파일 하나로 저장됩니다.
      이 파일만 잘 두면 컴퓨터를 바꿔도 <b>「복원」</b>으로 되살릴 수 있습니다.
      <b>일주일에 한 번, 그리고 반기 정산 뒤에는 꼭</b> 받아 두세요.</p>
    <p><b>③ 「전체 초기화」는 함부로 누르지 마세요.</b><br>
      원아·수납·지출 기록을 전부 지웁니다. 되돌릴 수 없습니다.</p>
  </div>

  <h2>3. 표 머리의 (A) (B) (C) — 계산식 읽는 법</h2>
  <p>금액이 계산되어 나오는 표는 <b>머리칸에 기호가 붙어</b> 있습니다.
    어느 칸을 더하고 빼서 그 숫자가 나왔는지 눈으로 따라갈 수 있습니다.</p>
  <table>
    <thead><tr><th>${col("수납액", "A")}</th><th>${col("전입금 충당", "B")}</th>
      <th>${col("실 사용금액", "C")}</th><th>${col("남은 금액", "D = A + B − C")}</th></tr></thead>
    <tbody><tr><td class="n">2,277,318</td><td class="n">58,000</td>
      <td class="n">2,248,400</td><td class="n">86,918</td></tr></tbody>
  </table>
  <p>위 표는 <code>2,277,318 + 58,000 − 2,248,400 = 86,918</code>이라는 뜻입니다.</p>
  <ul>
    <li>칸이 있을 때와 없을 때가 있습니다. <b>이월</b>은 3월이 아닌 달부터 정산할 때만,
      <b>전입금 충당</b>은 위탁 원아가 있을 때만 나옵니다. 그에 맞춰 기호도 밀립니다.</li>
    <li>반환 정산서처럼 세목이 가로로 늘어선 표는 세목마다 <b>① ② ③</b>이 붙고,
      합계 칸에 <b>① + ② + ③</b>이라고 적힙니다.</li>
  </ul>
  <p><b>화면과 인쇄물에 똑같이 나옵니다.</b> 운영위원회나 감사에서 「이 숫자 어떻게 나온 거냐」는
    물음에 표 하나로 답할 수 있습니다.</p>

  <h2>4. 회계연도와 반기 — 날짜 기준</h2>
  <ul>
    <li><b>회계연도</b> : 3월 1일 ~ 익년 2월 말일</li>
    <li><b>상반기</b> : 3월 ~ 8월</li>
    <li><b>하반기</b> : 9월 ~ 익년 2월</li>
  </ul>
  <p>화면 맨 위에서 회계연도를 고르면 그 아래 모든 숫자가 그 기간으로 맞춰집니다.</p>
  <p>회계연도마다 장부가 <b>따로 보관</b>됩니다. 새 회계연도를 시작해도 지난 해 자료는 그대로 남고,
    맨 위 <b>회계연도</b>를 지난 해로 바꾸면 그때 대장·정산서를 언제든 다시 뽑을 수 있습니다.</p>

  <h2>5. 맨 처음 한 번만 — 기초설정</h2>
  <p><b>기초설정</b> 탭에서 위에서부터 차례로 채우시면 됩니다.</p>

  <h3>① 어린이집 이름</h3>
  <p>어린이집 이름은 <b>맨 처음 화면</b>(프로그램을 고르는 화면)에서 정합니다.
    화면 <b>왼쪽 위 「⚙ 어린이집 이름 설정」</b>을 누르고 이름을 적은 뒤 <b>「저장」</b>.
    한 번만 적어 두면 모든 인쇄물 머리글에 자동으로 찍히고, 물품관리도 같은 이름을 씁니다.</p>

  <h3>② 반 구성</h3>
  <p>반 이름을 적고 <b>「반 추가」</b>. 순서는 화살표로 바꿉니다.</p>
  <blockquote>반은 <b>통계 단위가 아니라 원아를 빠르게 고르기 위한 도구</b>입니다.
    그래서 이 프로그램은 반별 통계를 만들지 않습니다. 모든 숫자는 원아에게 붙습니다.</blockquote>

  <h3>③ 원아 명부</h3>
  <p><b>「원아 추가」</b>를 누르고 성명·입소일을 적습니다. 퇴소일은 그만둘 때 적으면 됩니다.</p>
  <ul>
    <li><b>반 소속 이력</b> — 반이 바뀌면 <b>이동일만</b> 추가하세요. 그 전후가 자동으로 나뉩니다.</li>
    <li><b>위탁 기간</b> — 보통은 비워 두면 됩니다. 위탁보육으로 바뀔 때만 <b>시작 달</b>을 적습니다.
      위탁보육료는 그 달치를 그 달 아무 날에나 받으므로 <b>달 단위</b>로 적습니다.</li>
  </ul>

  <h3>④ 세목 설정</h3>
  <p>필요경비 8개 항목이 미리 들어 있습니다. 쓰지 않는 세목은 <b>「사용」 체크를 끄면</b> 화면에서 사라집니다.</p>
  <table>
    <thead><tr><th style="width:130px">칸</th><th>무슨 뜻인가</th></tr></thead>
    <tbody>
      <tr><td>구분</td><td>특별활동비(211목/411목)인지 기타필요경비(221목/421목)인지</td></tr>
      <tr><td>대상 원아 선정</td><td><b>고정 명단</b> = 매번 같은 아이들 / <b>건별 체크</b> = 매번 달라짐</td></tr>
      <tr><td><b>수납주기</b></td><td>얼마 만에 한 번 걷는지 — 매월 · 분기별 · 반기별 · 연 1회 · 수시.
        금액 계산에는 쓰지 않고, 수납 입력 화면에 함께 나와 담당자가 바뀌어도 헷갈리지 않게 합니다.</td></tr>
      <tr><td><b>1인당 수납액</b></td><td>보호자에게 공지한 금액. 수납 입력에서 버튼 한 번으로 불러 씁니다.</td></tr>
    </tbody>
  </table>
  <p>특별활동 과목이 여러 개면 <code>특별활동비-로봇과학</code>처럼 <b>과목마다 세목을 추가</b>해 두는 편이 정산이 깔끔합니다.</p>

  <h3>⑤ 카드수수료 처리 방식 <span class="tag">한 번만 고르면 끝</span></h3>
  <p>보호자가 카드로 결제하면 <b>수수료를 뗀 금액</b>이 통장에 들어옵니다.
    50,000원을 결제하고 수수료가 3원이면 통장에는 49,997원이 찍힙니다.
    이 3원을 어디에 적느냐가 어린이집마다 갈립니다. <b>둘 다 틀린 것이 아니므로</b> 하던 방식을 고르시면 됩니다.</p>
  <table>
    <thead><tr><th style="width:110px">방식</th><th>이렇게 적습니다</th><th class="n" style="width:130px">위 예시의 수납액</th></tr></thead>
    <tbody>
      <tr><td><b>순액 방식</b></td><td>통장에 들어온 <b>실제 입금액</b>을 수입결의와 정산 수납액으로 잡습니다.
        수수료를 따로 지출결의하지 않습니다.</td><td class="n">49,997원</td></tr>
      <tr><td><b>총액 방식</b></td><td><b>카드 승인액</b>을 수입결의와 정산 수납액으로 잡고,
        수수료는 운영비에서 <b>따로 지출결의</b>로 뺍니다.</td><td class="n">50,000원</td></tr>

  <p>고른 방식은 <b>수납 입력</b> 화면이 그대로 따릅니다. 어느 쪽이든 원아별 배분과 잔액은
    표에 적힌 수납액으로만 계산하므로 결과가 어긋나지 않습니다.</p>

  <h3>⑥ 고정 명단</h3>
  <p>차량 이용 원아, 특별활동 과목별 참여자, 원복 신청 원아처럼 <b>반복해서 쓰는 명단</b>을 만들어 두는 곳입니다.
    수납 입력·지출 등록에서 <b>「명단 불러오기」</b> 한 번이면 체크가 끝납니다.
    불러온 뒤 그 건에서만 빼거나 더할 수 있습니다.</p>

  <h2>6. 수납 입력 — 받은 돈 적기</h2>
  <p><b>수납결의서 1건을 그대로 옮겨 적는</b> 화면입니다. 한 결의서에 여러 원아가 섞여 있어도 됩니다.
    화면이 1 → 2 → 3 순서로 되어 있으니 위에서부터 채우시면 됩니다.</p>

  <h3>1. 결의서 입력</h3>
  <p>수납일 · 수입결의서 번호 · 적요를 적습니다. <b>결의서 한 장에 한 번만</b> 적으면 됩니다.</p>

  <h3>세목 칸 — 한 장에 여러 세목이 섞여 있을 때</h3>
  <p>실제 수입결의서는 한 장에 여러 세목이 섞여 있습니다. 관·항·목은
    「수익자부담수입 / 기타필요경비 / 기타필요경비」로 하나이고, 적요에
    <b>입학준비금 · 현장학습비 · 행사비</b>가 나란히 적힙니다.</p>
  <p>그래서 화면에도 <b>세목 칸</b>을 여럿 둘 수 있습니다.
    <b>「+ 세목 칸 추가」</b>를 누르면 칸이 하나 더 생깁니다. 칸마다 세목·대상 원아·금액·카드수수료를
    따로 적습니다. 맨 아래에 <b>이 결의서 합계</b>가 나오므로 결의서의 「금 ○○원정」과 맞춰 보면 됩니다.</p>
  <table>
    <thead><tr><th style="width:170px">무엇이</th><th>어떻게 되나</th></tr></thead>
    <tbody>
      <tr><td>저장</td><td><b>세목마다 결의서 하나씩</b>으로 나뉘어 담깁니다.
        정산과 대장은 세목별로만 뜻이 있기 때문입니다 (세목 간 상계 금지).
        수납일·결의서 번호·적요는 모두 같게 들어갑니다.</td></tr>
      <tr><td>목록</td><td>세목별로 나뉘어 보이되, 같은 번호끼리 <b>「같은 결의서 ○개 세목」</b> 표시가 붙습니다.</td></tr>
      <tr><td>수정</td><td>그중 <b>아무 줄이나</b> 「수정」을 누르면 <b>그 번호의 세목 칸이 전부</b> 올라옵니다.
        한 장이었던 그대로 고쳐 다시 저장하면 됩니다.</td></tr>
      <tr><td>삭제</td><td>고른 세목 하나만 지워집니다. 같은 번호에 다른 세목이 남아 있으면 지울 때 알려 줍니다.</td></tr>
    </tbody>
  </table>
  <blockquote>결의서 번호를 비워 두면 묶을 근거가 없어 그 건만 따로 다룹니다.
    한 장으로 묶으려면 <b>번호를 꼭 적어</b> 주세요.</blockquote>

  <h3>2. 수납 대상 원아</h3>
  <p>반별로 묶여 있습니다. <b>「이 반 전체」</b>로 한 번에 고르거나 <b>「명단 불러오기」</b>를 쓰세요.
    그날 재원기간 밖인 아이는 <b>회색으로 잠겨</b> 고를 수 없습니다.</p>
  <div class="warn"><p><b>위탁 기간인 원아는 넣지 마세요.</b> 그 기간은 보호자가 아니라 회사가 전입금으로 냅니다.
    넣으면 이중으로 받은 것이 되어, 돌려줄 돈이 없는데도 반환액이 생깁니다.</p></div>

  <h3>3. 수납액 확인</h3>
  <ol>
    <li><b>1인당 수납액</b>을 적고 <b>「선택한 원아에게 일괄 적용」</b>. 기초설정에 금액을 적어 두었다면
      <b>「기초설정 금액 ○○원 쓰기」</b> 버튼이 함께 나옵니다.</li>
    <li>카드로 받았다면 <b>「카드수수료」</b>에 그 결의서 전체 수수료를 적습니다.
      기초설정에서 고른 방식대로 처리됩니다.
      <ul>
        <li><b>순액 방식</b> — 「일괄 적용」을 누르면 1인당 수납액에서 <b>수수료 몫을 빼서</b> 채웁니다.
          (100,000원 · 수수료 9원 · 2명 → 49,995 / 49,996, 합계 99,991)</li>
        <li><b>총액 방식</b> — 승인액 그대로 채우고, 수수료는 <b>운영비에서 따로 지출결의</b>로 빼세요.</li>
      </ul>
      어느 쪽이든 표 아래에 <b>카드 승인액 − 수수료 = 통장 입금</b>이 적혀 맞춰 볼 수 있습니다.</li>
    <li>아이마다 다른 금액은 그 칸만 고칩니다.</li>
    <li><b>「수납결의서 등록」</b>.</li>
  </ol>
  <div class="warn"><p><b>0원인 칸은 기록이 만들어지지 않습니다.</b>
    피복류를 신청하지 않은 아이는 0원으로 두시면 됩니다. 입학준비금은 부모가 고른 세부 항목만 받으므로
    <b>아이마다 금액이 다른 것이 정상</b>입니다.</p></div>
  <p>이미 저장한 것은 아래 <b>수납결의서 내역</b>에서 <b>「수정」</b>으로 언제든 고칠 수 있습니다.
    결의서를 지우면 거기서 파생된 원아별 수납 기록도 함께 사라집니다.</p>

  <h2>7. 지출 등록 — 이 프로그램의 심장</h2>
  <p><b>대장을 채우는 곳은 여기 하나뿐입니다.</b> 지출결의서 1건을 그대로 옮겨 적으면 나머지는 전부 자동입니다.</p>
  <h3>① 금액 나누기</h3>
  <table>
    <thead><tr><th>칸</th><th>무엇을 적나</th></tr></thead>
    <tbody>
      <tr><td>지출결의서 총액</td><td>결제한 전체 금액</td></tr>
      <tr><td>필요경비 부담분</td><td>원아들에게 나눌 금액 (전액이면 「전액 필요경비」 버튼)</td></tr>
      <tr><td>운영비 부담분</td><td><b>자동 계산</b> (총액 − 필요경비 부담분)</td></tr>
    </tbody>
  </table>
  <h3>② 대상 원아 고르기</h3>
  <p>반별로 묶여 있습니다. <b>「이 반 전체」</b>로 한 번에 고르거나, 고정 명단을 불러오세요.</p>
  <p><b>그날 재원기간 밖인 아이는 회색으로 잠겨</b> 아예 고를 수 없습니다. 잘못 배분될 일이 없습니다.</p>
  <h3>③ 배분 미리보기</h3>
  <p>체크하는 즉시 <b>대상 몇 명, 1인당 얼마</b>인지 나옵니다.</p>
  <blockquote>100,000원을 3명에게 나누면 1인당 33,333원이고 남는 1원은 <b>앞 순번 1명에게 더</b> 붙습니다.
    그래서 <b>배분 합계가 필요경비 부담분과 1원도 어긋나지 않습니다.</b>
    어긋나거나 대상이 없으면 <b>저장 버튼 자체가 잠깁니다.</b></blockquote>
  <h3>④ 잔액이 모자랄 때 — 12월부터 알립니다</h3>
  <p>보호자에게 받아 둔 돈보다 더 쓰는 일은 실무에서 자주 있습니다.
    그 모자란 몫은 보호자에게 더 받을 수 없으므로 <b>어린이집 운영비에서 나가야 합니다.</b></p>
  <div class="warn"><p><b>이 알림은 등록을 막지 않습니다.</b> 그대로 등록하셔도 됩니다.
    「이만큼은 어린이집 돈으로 나간다」고 미리 알려 드리는 것뿐입니다.</p></div>
  <table>
    <thead><tr><th style="width:150px">지출일</th><th>잔액이 모자랄 때</th></tr></thead>
    <tbody>
      <tr><td>3월 ~ 11월</td><td><b>알리지 않습니다.</b> 3월에 한 학기치를 걷어 두고 쓰다 보면
        초반에 잔액이 마이너스인 것은 오히려 흔하고, 다음 분기 수납이 들어오면 저절로 메워집니다.
        그때마다 경고하면 헛경고만 쌓입니다.</td></tr>
      <tr><td><b>12월 ~ 익년 2월</b><br><span class="hint">(4분기)</span></td>
        <td><b>알립니다.</b> 이때부터는 더 들어올 수납이 사실상 없어, 모자라면 끝내 어린이집이
        부담하게 되기 때문입니다. 모자란 금액과 그 원아를 짚어 줍니다.</td></tr>
    </tbody>
  </table>
  <p>알림이 떴을 때 할 수 있는 것은 셋입니다.</p>
  <ol>
    <li><b>그대로 등록</b> — 가장 흔합니다. 모자란 몫을 어린이집이 부담하는 것으로 정리됩니다.</li>
    <li><b>「필요경비 부담분」을 낮추기</b> — 모자란 만큼을 운영비 부담분으로 돌리면
      그 금액이 애초에 원아에게 배분되지 않습니다. 회계상 더 깔끔한 쪽입니다.</li>
    <li><b>지출 금액을 다시 보기</b> — 잘못 적은 것은 아닌지 확인합니다.</li>
  </ol>
  <blockquote>보호자 서류에는 <b>마이너스가 찍히지 않습니다.</b> 남은 금액은 0에서 멈추고,
    넘긴 몫은 「어린이집 부담 ○○원」으로 따로 적힙니다.
    정산서에 마이너스가 섞이면 보호자도 어린이집도 읽기 어려워지기 때문입니다.</blockquote>

  <h3>⑤ 나중에 고치기</h3>
  <p>아래 <b>지출 내역</b>에서 <b>「수정」</b>을 누르면 그 건이 그대로 올라옵니다.
    <b>몇 번이든, 정산서를 뽑은 뒤라도</b> 고칠 수 있고, 고치면 대장·정산서·보고서가 전부 다시 계산됩니다.</p>
  <p><b>「명단」</b> 버튼을 누르면 그 건의 참여원아 명단이 나옵니다. <b>인쇄해서 지출결의서에 첨부</b>하면 배분 근거가 됩니다.</p>

  <h2>8. 원아별 현황 — 이 아이는 얼마가 남았나</h2>
  <p><b>반을 먼저 고르고 그 반의 아이를 고르면</b> 세목별로 수납·사용·남은 금액이 나옵니다.</p>
  <table>
    <thead><tr><th style="width:140px">칸</th><th>무엇인가</th></tr></thead>
    <tbody>
      <tr><td>보호자 수납</td><td>보호자가 실제로 낸 돈</td></tr>
      <tr><td><b>전입금 충당</b></td><td><b>위탁 원아에게만</b> 나옵니다. 위탁 월에 회사 전입금으로 충당된 몫.
        들어온 만큼 그대로 나간 금액이라 남은 금액에 영향을 주지 않습니다.</td></tr>
      <tr><td>사용</td><td>그 아이에게 배분된 전체 금액</td></tr>
      <tr><td>남은 금액</td><td>(보호자 수납 + 전입금 충당) − 사용</td></tr>
    </tbody>
  </table>
  <p>아래 <b>사용 건별 내역</b>에서 <b>금액을 누르면 그 지출건의 내용과 참여원아 명단이 뜹니다.</b> 이것이 역추적입니다.</p>
  <blockquote>세목 간 상계는 하지 않습니다. 현장학습비가 남았다고 행사비 부족분에 쓸 수 없습니다.
    (재무회계규칙 제15조 — 예산의 목적 외 사용 금지)</blockquote>

  <h2>9. 정산·보고 — 서류 뽑기</h2>
  <div class="intro">이 프로그램은 <b>반환할 금액을 계산해 정산서를 뽑는 데까지</b>가 역할입니다.
    실제 계좌 이체와 회계 처리는 정산서를 보고 어린이집에서 진행하시면 됩니다.</div>

  <h3>① 정산보고서 (운영위원회용) <span class="tag">탭을 열면 이 화면이 먼저 나옵니다</span></h3>
  <p><b>세목별 통계</b>입니다. 세목마다 수납 인원·지출 건수·보호자 수납액·실 사용금액·남은 금액이 나오고,
    맨 아래 <b>미집행액 합계</b>와 <b>어린이집 부담</b>까지 계산됩니다.
    「지출 내역 함께 넣기」를 켜 두면 <b>무엇에 썼는지</b> 건별 목록이 뒤에 붙습니다.</p>
  <p>위탁 원아가 있으면 <b>「전입금 충당」 열</b>이 함께 나옵니다. 위탁 원아 몫은 보호자가 아니라
    회사가 내므로, 그 금액을 수입에도 잡아 <b>수입과 지출이 맞아떨어지게</b> 했습니다.</p>
  <p>원아 한 사람씩의 내역은 여기가 아니라 <b>보호자용 개별 안내문</b>에서 뽑습니다.</p>

  <h3>② 보호자용 개별 안내문</h3>
  <div class="warn"><p><b>보호자에게 가는 서류는 숫자를 보호자 눈높이로 적습니다.</b></p>
    <ul>
      <li><b>수납액 = 보호자께서 결제하신 금액.</b> 카드 수수료를 떼기 전 금액입니다.
        떼인 수수료는 바로 옆 칸에 따로 보여 줍니다. (순액 방식일 때만)</li>
      <li><b>남은 금액은 0에서 멈춥니다.</b> 더 쓴 세목이 있으면 그 몫은 어린이집 운영비 부담이므로
        마이너스를 적지 않고, 「어린이집 부담 ○○원」과 그 설명을 함께 인쇄합니다.</li>
    </ul>
    <p>같은 규칙이 <b>중간퇴소·중간전환 정산서</b>에도 그대로 적용됩니다.
      운영위원회 보고서·대장·검증은 회계 장부이므로 통장 금액 그대로 씁니다.</p></div>
  <p>아이 한 명 것만 한 장으로 뽑습니다. 세목별 수납·사용·남은 금액과 함께,
    <b>어느 지출건이 이 아이에게 얼마로 잡혔는지</b> 날짜순 내역이 들어갑니다.</p>
  <p><b>「전체 원아 한 장씩」</b>을 체크하고 인쇄하면 아이마다 페이지가 나뉘어 한 번에 출력됩니다.</p>

  <h3>③ 반환 정산서 (전 원아)</h3>
  <p><b>보통 2월말에 한 번 뽑는 표</b>입니다. 기간을 <b>연간</b>으로 두고 뽑으면
    원아마다 세목별로 <b>수납액 − 실 사용금액 = 반환할 금액</b>이 한 장에 나옵니다.
    이 표를 보고 반환 처리를 하시면 됩니다.</p>
  <p>퇴소·위탁·초과 사용은 비고에 표시됩니다.</p>

  <h3>④ 중간퇴소·중간전환 정산</h3>
  <p>중간에 그만두거나 위탁으로 바뀐 아이만 그때그때 따로 뽑습니다.</p>
  <ol>
    <li>기초설정에서 <b>퇴소일</b>을 먼저 적습니다.</li>
    <li>아이와 사유를 고릅니다. (중간퇴소 / 중간전환)</li>
    <li><b>그달 지출건 문답</b> — 퇴소한 달의 지출을 하나씩 보여주며 포함할지 묻습니다.
      프로그램이 마음대로 판정하지 않습니다. 체크와 사유가 정산서에 근거로 남습니다.</li>
    <li>세목별로 <b>수납 − 사용 = 반환할 금액</b>이 나오고, 산식이 한 줄씩 함께 적힙니다.</li>
    <li><b>입학준비금</b>은 자동계산에서 빠집니다. 「물품을 이미 지급함」을 체크하고 <b>협의한 금액을 직접</b> 적으세요.</li>
  </ol>
  <div class="warn"><p><b>위탁 원아는 정반대입니다.</b> 남은 돈을 보호자에게 반환하지 않고
    <b>보육교사 인건비·운영비로 충당</b>합니다. 이용을 중단한 경우에도 같습니다. 프로그램이 자동으로 안내합니다.</p></div>

  <h2>10. 대장 — 기존 양식 그대로</h2>
  <p>가로줄이 아이와 계정과목, 세로줄이 3월부터 익년 2월까지 12개월입니다.
    구분 드롭다운에서 <b>세 가지</b> 중 하나를 고릅니다.</p>
  <table>
    <thead><tr><th style="width:230px">구분</th><th>칸에 무엇이 들어가나</th></tr></thead>
    <tbody>
      <tr><td>개인별 원아 <b>수입</b>대장 (금액)</td><td>그 달에 받은 <b>금액</b>.
        위탁 원아는 보호자 대신 전입금이 들어오므로 그 달 충당액이 채워집니다.</td></tr>
      <tr><td><b>기타필요경비 수입부 대장</b> (수납일)</td><td>금액 대신 <b>수납한 날짜</b>.
        손으로 날인하던 그 대장을 대신합니다. 한 달에 두 번 받았으면 두 날짜가 함께 나오고,
        맨 오른쪽에 <b>받은 횟수</b>가 적힙니다.</td></tr>
      <tr><td>개인별 원아 <b>지출</b>대장 (금액)</td><td>그 달에 배분된 <b>금액</b></td></tr>
    </tbody>
  </table>
  <p>모두 <b>수납 입력과 지출 등록에서 자동으로 채워진 것</b>입니다. 따로 옮겨 적을 필요가 없습니다.
    <b>CSV 저장</b>을 누르면 엑셀에서 열 수 있는 파일로 받습니다.</p>
  <blockquote>인쇄하면 <b>가로 용지</b>로 나갑니다. 장이 넘어가도 머리행과 <b>반·순번·아동</b>이
    새 장에 다시 찍히므로, 뒷장만 봐도 누구 것인지 알 수 있습니다.</blockquote>

  <h2>11. 검증 — 뽑기 전에 한 번 보기</h2>
  <p>서류를 내기 전에 <b>검증</b> 탭을 한 번 눌러 보세요. 대사 숫자와 어린이집 부담이 나오고,
    걸리는 것이 있으면 목록으로 알려 줍니다.</p>
  <table>
    <thead><tr><th>등급</th><th>뜻</th></tr></thead>
    <tbody>
      <tr><td><b>오류</b></td><td>반드시 고쳐야 합니다. 「이동」을 눌러 그 자리로 갑니다.</td></tr>
      <tr><td><b>주의</b></td><td>확인이 필요합니다. 사정에 따라 정상일 수도 있습니다.</td></tr>
      <tr><td><b>기록</b></td><td>정산 화면에서 사유를 달아 결정한 내용입니다. 근거로 남깁니다.</td></tr>
      <tr><td colspan="2"><b>12월이 지나면</b> 세목별로 <b>잔액이 모자란 원아</b>가 「주의」로 함께 나옵니다.
        모자란 몫은 어린이집 운영비 부담입니다.</td></tr>
    </tbody>
  </table>
  <p>대사는 이렇게 맞춰 봅니다.</p>
  <table>
    <thead><tr><th style="width:230px">줄</th><th>무엇인가</th></tr></thead>
    <tbody>
      <tr><td>보호자 수납 합계</td><td>221목·211목으로 받은 돈</td></tr>
      <tr><td>전입금 충당</td><td>위탁 원아 몫. 회사가 낸 돈</td></tr>
      <tr><td><b>수입 합계</b></td><td>위 둘을 더한 것</td></tr>
      <tr><td>원아 배분 합계</td><td>421목·411목 중 원아에게 나눈 몫</td></tr>
      <tr><td class="sum"><b>남은 금액</b></td><td><b>수입 합계 − 배분 합계 = 보호자에게 돌려줄 몫</b></td></tr>
    </tbody>
  </table>
  <blockquote>위탁 원아가 있어도 <b>수입과 지출이 맞아떨어집니다.</b>
    전입금이 수입과 지출 양쪽에 같은 금액으로 들어가 서로 상쇄되기 때문입니다.</blockquote>

  <h2>12. 새 학년도 시작 — 마감과 승계</h2>
  <p>3월이 되면 <b>기초설정 맨 아래 「새 회계연도 시작」</b>을 누르세요. 두 단계로 진행됩니다.</p>
  <ol>
    <li><b>1단계 — 반 구성.</b> 올해 반이 그대로 복사되어 있습니다. 어린이집은 해마다 반 이름과 구성이
      조금씩 바뀌므로, 먼저 <b>새 해에 쓸 반</b>을 확정합니다. 이름은 고쳐 적고, 없어지는 반은 지우고,
      새로 생기는 반은 더합니다.</li>
    <li><b>2단계 — 원아 배치.</b> 1단계에서 정한 반 중에서 원아마다 <b>올라갈 반</b>을 고릅니다.
      졸업하거나 그만둔 아이는 체크를 끕니다. 퇴소일을 적어 둔 아이는 미리 꺼져 있습니다.</li>
    <li>저장하면 새 회계연도로 넘어갑니다.</li>
  </ol>
  <table>
    <thead><tr><th>새 해로 이어지는 것</th><th>새 해에서 비어 있는 것</th></tr></thead>
    <tbody><tr>
      <td>반(1단계에서 정한 대로) · 원아 · 세목(1인당 수납액 포함) · 고정 명단 · 위탁 기간</td>
      <td>수납결의서 · 지출 · 그에 딸린 모든 금액</td>
    </tr></tbody>
  </table>
  <div class="warn"><p><b>지난 해 자료는 하나도 지워지지 않습니다.</b>
    새 회계연도는 금액만 비어 있는 새 장부로 따로 만들어지고, 지난 해 장부는 그대로 보관됩니다.</p>
    <p>작년 대장이나 정산서를 다시 뽑아야 하면 <b>화면 맨 위 「회계연도」를 지난 해로 바꾸기만</b> 하면 됩니다.
      백업 파일을 복원할 필요가 없습니다. 다 뽑았으면 올해로 되돌리세요.</p></div>
  <blockquote>회계연도 중간에 이 프로그램을 도입한다면, <b>지나간 수납결의서와 지출을 그대로 입력</b>하시면 됩니다.
    그래야 개인별 대장과 정산서가 온전히 맞습니다.</blockquote>

  <h2>13. 자주 겪는 상황</h2>
  <p>구체적인 상황별 대처는 <b>사용설명서 → 🧭 상황별 안내</b>에서 검색해 보세요.
    중간입소·중간퇴소·위탁 전환·카드수수료·수납주기·나눠떨어지지 않는 금액 등
    ${FAQ.length}가지 상황을 정리해 두었습니다.</p>
`;

function manualQuick(sources){
  return `
  <h1>빠른 시작 가이드</h1>
  ${sources}
  <div class="intro">A4 1~2장 분량입니다. 처음이라면 <b>1 → 2 → 3</b> 순서만 따라 하시면 됩니다.</div>

  <h2>딱 하나만 기억한다면</h2>
  <div class="warn"><p><b>지출결의서 1건을 등록하면서 대상 원아를 체크하는 것.</b> 이것만 하면
    개인별 대장·정산서·보고서는 전부 자동으로 나옵니다.</p></div>

  <h2>1. 처음 한 번 — 기초설정</h2>
  <ol>
    <li><b>어린이집 이름</b> — 맨 처음 화면 왼쪽 위 <b>「⚙ 어린이집 이름 설정」</b>에서 한 번만.
      (두 프로그램 인쇄물에 모두 찍힙니다)</li>
    <li><b>반</b>을 추가합니다.</li>
    <li><b>원아</b>를 추가합니다. 성명·입소일·반만 있으면 됩니다.</li>
    <li><b>세목</b> — 쓰지 않는 것은 「사용」 체크를 끄고,
      <b>수납주기</b>와 <b>1인당 수납액</b>을 적어 둡니다.</li>
    <li><b>카드수수료 처리 방식</b> — 순액/총액 중 하던 방식을 한 번만 고릅니다.</li>
  </ol>

  <h2>2. 돈을 받으면 — 수납 입력</h2>
  <ol>
    <li>수납일 · 결의서 번호 · 세목 · 적요</li>
    <li><b>대상 원아 체크</b> <span class="hint">(위탁 기간인 아이는 넣지 마세요 — 회사가 냅니다)</span></li>
    <li>1인당 수납액 적고 <b>「선택한 원아에게 일괄 적용」</b></li>
    <li>카드로 받았으면 <b>「카드수수료」</b> 적기 <span class="hint">(순액 방식이면 자동으로 빼 줍니다)</span></li>
    <li>다른 아이만 그 칸 고치고 <b>「수납결의서 등록」</b>
      <span class="hint">(안 낸 아이는 0원으로 두면 기록이 안 생깁니다)</span></li>
  </ol>

  <h2>3. 돈을 쓰면 — 지출 등록 <span style="color:var(--accent)">(가장 중요)</span></h2>
  <ol>
    <li>지출일 · 세목 · 적요</li>
    <li><b>총액</b> 적고 → 전액이 필요경비면 <b>「전액 필요경비」</b> 클릭</li>
    <li><b>대상 원아 체크</b> <span class="hint">(고정 명단이 있으면 「명단 불러오기」)</span></li>
    <li>미리보기에서 <b>1인당 금액</b> 확인 → <b>「지출 등록」</b></li>
  </ol>
  <blockquote>재원기간 밖인 아이는 <b>회색으로 잠겨</b> 고를 수 없습니다.<br>
    나눠떨어지지 않으면 <b>남는 1원을 앞 순번에 붙여</b> 합계를 정확히 맞춥니다.<br>
    등록한 건은 <b>언제든 「수정」</b>할 수 있습니다.</blockquote>
  <div class="warn"><p><b>12월부터</b> 잔액이 모자라면 알림이 뜹니다.
    <b>막는 것이 아니니 그대로 등록하셔도 됩니다.</b> 모자란 몫은 어린이집 운영비에서 나가고,
    보호자 서류에는 마이너스가 찍히지 않습니다. (3~11월에는 다음 분기 수납으로 메워지므로 알리지 않습니다)</p></div>

  <h2>서류가 필요할 때</h2>
  <table>
    <thead><tr><th>필요한 것</th><th>어디로</th></tr></thead>
    <tbody>
      <tr><td>이 아이 얼마 남았나</td><td><b>원아별 현황</b></td></tr>
      <tr><td>운영위원회 보고</td><td><b>정산·보고 → 정산보고서 (운영위원회용)</b></td></tr>
      <tr><td>보호자에게 알림</td><td><b>정산·보고 → 보호자용 개별 안내문</b></td></tr>
      <tr><td>2월말 반환 처리</td><td><b>정산·보고 → 반환 정산서 (전 원아)</b></td></tr>
      <tr><td>그만둔 아이 정산서</td><td><b>정산·보고 → 중간퇴소·중간전환 정산</b></td></tr>
      <tr><td>수입대장 · 지출대장 (금액)</td><td><b>대장</b></td></tr>
      <tr><td>수입부 대장 (수납한 날짜)</td><td><b>대장 → 구분을 「기타필요경비 수입부 대장」으로</b></td></tr>
      <tr><td>지출결의서 첨부용 명단</td><td><b>지출 등록 → 지출 내역 → 「명단」</b></td></tr>
    </tbody>
  </table>

  <h2>3월이 되면</h2>
  <p><b>기초설정 맨 아래 「새 회계연도 시작」</b> → 새 해 반 구성 확정 → 원아마다 올라갈 반 고르기 → 저장.
    반·원아·세목은 넘어가고 금액만 비어 있습니다.</p>
  <p><b>지난 해 자료는 그대로 남습니다.</b> 작년 서류가 필요하면 화면 맨 위 <b>회계연도</b>를 지난 해로 바꾸세요.</p>

  <h2>잊지 마세요</h2>
  <div class="warn">
    <p><b>① 「자료 백업」을 일주일에 한 번.</b> 자료는 이 컴퓨터에만 있습니다.
      밀리면 화면 위에 알림이 뜹니다.</p>
    <p><b>② 서류 뽑기 전에 「검증」 탭 한 번.</b></p>
    <p><b>③ 「전체 초기화」는 누르지 않기.</b></p>
  </div>

  <h2>막히면</h2>
  <p><b>사용설명서 → 🧭 상황별 안내</b>에서 겪고 있는 상황을 검색해 보세요.
    (예: <code>퇴소</code>, <code>위탁</code>, <code>카드</code>, <code>주기</code>, <code>나눠떨어</code>, <code>백업</code>)</p>`;
}

/* ==========================================================================
   13. 모달 · 내보내기
   ========================================================================== */

function openModal(title, bodyNode, onOk, extraButtons){
  const mask = el(`<div class="mask"><div class="modal">
    <header><h1>${esc(title)}</h1></header>
    <div class="body"></div>
    <div class="foot"></div>
  </div></div>`);
  $(".body", mask).appendChild(bodyNode);

  const foot = $(".foot", mask);
  for (const b of (extraButtons || [])) {
    const btn = el(`<button class="b no-print">${esc(b.label)}</button>`);
    btn.onclick = b.fn;
    foot.appendChild(btn);
  }
  const close = el(`<button class="b">${onOk ? "취소" : "닫기"}</button>`);
  close.onclick = () => mask.remove();
  foot.appendChild(close);

  if (onOk) {
    const ok = el(`<button class="b pri">저장</button>`);
    ok.onclick = () => { if (onOk() !== false) mask.remove(); };
    foot.appendChild(ok);
  }
  mask.onclick = e => { if (e.target === mask) mask.remove(); };
  document.addEventListener("keydown", function esckey(e){
    if (e.key === "Escape") { mask.remove(); document.removeEventListener("keydown", esckey); }
  });
  $("#modalHost").appendChild(mask);
  return mask;
}

/** 지금 자료를 JSON 파일로 내려받고, 마지막 백업 시각을 적어 둔다 */
function exportBackup(){
  S.lastBackupAt = new Date().toISOString();
  downloadBlob(`필요경비정산_백업_${S.fiscalYear}년도_${todayISO()}.json`,
    JSON.stringify(S, null, 2), "application/json");
  save();
  const n = $("#backupWarn");
  if (n) n.textContent = "";
}

/** 마지막 백업 이후 며칠 지났는지. 한 번도 안 했으면 null */
function daysSinceBackup(){
  if (!S.lastBackupAt) return null;
  return Math.floor((Date.now() - new Date(S.lastBackupAt).getTime()) / 86400000);
}

/** 한 줄짜리 입력을 받는다. 브라우저 기본 대화상자는 '이 페이지에는' 같은 문구가 붙어 쓰지 않는다. */
function askText(title, label, initial, onOk){
  const body = el(`<div>
    <label class="f">${esc(label)}<input id="ask_v" value="${esc(initial || "")}" style="width:100%"></label>
  </div>`);
  openModal(title, body, () => {
    const v = $("#ask_v", body).value.trim();
    if (!v) { alert(label + "을(를) 입력하세요."); return false; }
    onOk(v);
    return true;
  });
  setTimeout(() => { const i = $("#ask_v", body); if (i) { i.focus(); i.select(); } }, 50);
}

/** 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM을 붙인 CSV */
function downloadCSV(filename, rows){
  const body = rows.map(r => r.map(cell => {
    const s = String(cell ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
  downloadBlob(filename, "﻿" + body, "text/csv;charset=utf-8");
}
function downloadBlob(filename, text, mime){
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ==========================================================================
   14. 초기화
   ========================================================================== */

function initHeader(){
  /* 보관 중인 회계연도만 고를 수 있다. 새 연도는 기초설정의 「새 회계연도 시작」으로 만든다. */
  const sel = $("#fyPick");
  sel.innerHTML = listYears()
    .map(y => `<option value="${y}" ${y === S.fiscalYear ? "selected" : ""}>${y}년도</option>`).join("");
  sel.onchange = e => switchYear(parseInt(e.target.value, 10));

  $("#btnExport").onclick = () => exportBackup();
  $("#btnImport").onclick = () => $("#fileImport").click();
  $("#fileImport").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const okShape = data && (data.years || Array.isArray(data.children));
        if (!okShape) throw new Error("형식이 맞지 않습니다");
        if (!confirm("복원하면 지금 저장된 내용이 모두 덮어써집니다. 계속할까요?")) return;
        S = migrate(data);
        save(); initHeader(); render();
        alert(`복원했습니다. 회계연도 ${listYears().join(", ")}년도가 들어 있습니다.`);
      } catch (err) {
        alert("복원 실패 — " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  $("#btnReset").onclick = () => {
    if (!confirm("모든 데이터를 지웁니다. 먼저 자료 백업을 받아 두었나요?")) return;
    if (!confirm("정말 초기화할까요? 되돌릴 수 없습니다.")) return;
    S = defaultStore(); save(); initHeader(); render();
  };
}

/** 금액 입력칸을 입력하는 동안 세 자리마다 콤마로 끊어 보여준다 */
document.addEventListener("input", e => {
  if (!e.target.classList || !e.target.classList.contains("money")) return;
  const v = num(e.target.value);
  const pos = e.target.selectionStart;
  const before = e.target.value.length;
  e.target.value = v === 0 && e.target.value.trim() === "" ? "" : won(v);
  const after = e.target.value.length;
  const p = Math.max(0, pos + (after - before));
  try { e.target.setSelectionRange(p, p); } catch (_) {}
});

load();
initHeader();
render();
flagSaved("");
</script>
