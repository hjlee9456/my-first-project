<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어린이집 필요경비 원아별 정산</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --line:#dde1e7; --line2:#eef1f4;
  --ink:#1c2530; --dim:#66707d; --faint:#98a1ad;
  --accent:#2f6fd0; --accent-bg:#eaf1fc;
  --warn:#b4610a; --warn-bg:#fdf3e6;
  --bad:#c0392b; --bad-bg:#fdedeb;
  --ok:#1f7a4d; --ok-bg:#e9f6ef;
  --radius:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:16px;margin-bottom:10px}
h3{font-size:14px;color:var(--dim);margin:18px 0 8px}
a{color:var(--accent)}

/* ---------- layout ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:16px;white-space:nowrap}
header .spacer{flex:1}
#saveState{font-size:12px;color:var(--faint)}
.warnpill{font-size:12px;color:var(--warn);background:var(--warn-bg);
  padding:3px 9px;border-radius:11px;white-space:nowrap}
.warnpill:empty{display:none}
nav{background:var(--panel);border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:2px;
  position:sticky;top:51px;z-index:19;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;
  font:inherit;color:var(--dim);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:18px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1;min-width:0}
.hint{font-size:12px;color:var(--faint);line-height:1.6}
.hint b{color:var(--dim);font-weight:600}

/* ---------- controls ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);
  border-radius:4px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
input[readonly]{background:var(--line2);color:var(--dim)}
input.money{text-align:right;font-variant-numeric:tabular-nums}
button.b{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;
  border-radius:4px;cursor:pointer;color:var(--ink);white-space:nowrap}
button.b:hover{background:var(--line2)}
button.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.pri:hover{filter:brightness(1.08)}
button.b.danger{color:var(--bad);border-color:#f0c8c2}
button.b.danger:hover{background:var(--bad-bg)}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:none;padding:0;font:inherit;color:var(--accent);
  cursor:pointer;text-decoration:underline}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
th{background:var(--line2);font-weight:600;color:var(--dim);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center;white-space:nowrap}
tr.out td{color:var(--faint);background:#fbfbfc}
tr.sum td{background:var(--line2);font-weight:600}
tr.hl td{background:var(--accent-bg)}
table.ledger{font-size:12px}
table.ledger th,table.ledger td{padding:3px 5px}
.scroll{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:4px}
.scroll table{border:none}
.scroll th{position:sticky;top:0;z-index:1}
.empty{padding:24px;text-align:center;color:var(--faint);font-size:13px}

/* ---------- badges / notes ---------- */
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;
  background:var(--line2);color:var(--dim);white-space:nowrap}
.tag.consign{background:#efe7fb;color:#5b3ca8}
.tag.ev{background:#fdf3e6;color:var(--warn)}
.note{border-left:3px solid var(--accent);background:var(--accent-bg);
  padding:8px 12px;border-radius:0 4px 4px 0;font-size:12px;color:var(--dim);margin:10px 0;line-height:1.7}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg);color:#8c3226}
.note.ok{border-color:var(--ok);background:var(--ok-bg);color:#1a5c3b}

/* ---------- picker ---------- */
.picker{border:1px solid var(--line);border-radius:4px;max-height:340px;overflow:auto;padding:4px}
.pk-class{padding:6px 8px 8px}
.pk-class + .pk-class{border-top:1px solid var(--line2)}
.pk-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
  font-weight:600;margin-bottom:5px}
.pk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
.pk-item{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:3px;cursor:pointer;font-size:13px}
.pk-item:hover{background:var(--line2)}
.pk-item.dis{color:var(--faint);cursor:not-allowed}
.pk-item.dis:hover{background:none}
.pk-item input{margin:0}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,26,34,.45);display:flex;
  align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:8px;width:100%;max-width:720px;
  box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal header{position:static;border-radius:8px 8px 0 0}
.modal .body{padding:16px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- 사용설명서 ---------- */
.man-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:22px 0}
.man-card{flex:1 1 210px;max-width:260px;border:1px solid var(--line);border-radius:10px;
  padding:22px 16px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
.man-card:hover{border-color:var(--accent);background:var(--accent-bg);transform:translateY(-2px)}
.man-card .ic{font-size:38px;line-height:1}
.man-card .tt{font-size:17px;font-weight:700;margin-top:10px}
.man-card .ds{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.65}
.man{max-width:860px;margin:0 auto;line-height:1.85;font-size:14px}
.man h1{font-size:24px;margin:0 0 4px}
.man h2{font-size:19px;margin:32px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.man h3{font-size:15.5px;color:var(--ink);margin:20px 0 6px}
.man p{margin:9px 0}
.man ul,.man ol{margin:9px 0;padding-left:22px}
.man li{margin:5px 0}
.man code{background:var(--line2);padding:1px 5px;border-radius:3px;font-size:12.5px}
.man table{margin:12px 0}
.man .intro{background:var(--accent-bg);border-left:4px solid var(--accent);
  padding:12px 16px;border-radius:0 6px 6px 0;margin:14px 0}
.man .warn{background:var(--warn-bg);border-left:4px solid var(--warn);
  padding:12px 16px;border-radius:0 6px 6px 0;margin:14px 0}
.man blockquote{margin:12px 0;padding:10px 16px;background:var(--line2);
  border-left:4px solid var(--faint);border-radius:0 6px 6px 0;color:var(--dim);font-size:13px}
.man .law{font-size:12px;color:var(--faint);margin-top:3px}
.faq-search{position:sticky;top:92px;background:var(--panel);padding:10px 0;z-index:5}
.faq-g{margin-top:20px}
.faq-g > .gt{font-size:13px;font-weight:700;color:var(--accent);
  padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:6px}
.faq{border:1px solid var(--line);border-radius:6px;margin-bottom:6px;overflow:hidden}
.faq > summary{padding:9px 13px;cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;
  display:flex;gap:8px;align-items:flex-start}
.faq > summary::-webkit-details-marker{display:none}
.faq > summary::before{content:"Q";color:var(--accent);font-weight:700;flex-shrink:0}
.faq[open] > summary{background:var(--accent-bg)}
.faq .ans{padding:11px 13px 13px 30px;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.85}
.faq .ans ol,.faq .ans ul{margin:6px 0;padding-left:20px}

/* 수납 입력의 세목 칸 — 한 결의서에 여러 세목이 섞일 때 칸마다 테두리로 나눈다 */
.blk{border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--radius);padding:14px 16px;background:#fcfdfe}
.blk + .blk{margin-top:14px}

/* 표 머리의 계산 기호 */
.sym{display:block;font-weight:700;color:var(--accent);font-size:11px;
  margin-top:2px;letter-spacing:.2px;white-space:nowrap}
th .sym{opacity:.95}

/* ---------- 인쇄 ---------- */
.printhead{display:none}
.printhead h1{font-size:19px;text-align:center;margin-bottom:6px}
.printhead .sub{text-align:center;font-size:12px;color:var(--dim);margin-bottom:14px}
.sheet + .sheet{margin-top:28px}
.print-only{display:none}

@media print{
  /* 여백은 @page에 준다. body에 padding으로 주면 첫 장에만 붙고
     둘째 장부터는 표가 종이 맨 끝에서 시작한다.
     아래아한글 편집용지 「좁게」쯤 되는 폭이다. */
  @page{size:A4;margin:15mm 13mm 13mm}
  body{padding:0}
  header,nav,.no-print{display:none!important}
  /* 화면에서 일하는 데 쓰는 안내는 출력물에 넣지 않는다 */
  /* 화면에서 일하는 데 쓰는 안내는 빼지만, 표를 읽는 데 꼭 필요한 설명
     (.show-print)은 인쇄물에도 함께 나간다 — 숫자가 왜 그렇게 나왔는지
     보호자·운영위원회가 그 종이만 보고 알 수 있어야 한다. */
  .note,.law,.hint,.tag.ev{display:none!important}
  .note.show-print{display:block!important;background:#f7f9fb;border-color:#bdcbd5;
    color:#263849;font-size:11.5px;line-height:1.7;padding:7px 9px;margin:4mm 0 0}
  .note.show-print .hint{display:block!important;color:#4d6071;font-size:11px}
  body{background:#fff}
  main{padding:0;max-width:none}
  .panel{border:none;padding:0;margin:0}
  .scroll{max-height:none;overflow:visible;border:none}
  table{font-size:10.5px;width:100%}
  th,td{padding:3px 5px}
  h3{font-size:12px;margin:14px 0 5px;break-after:avoid}
  .printhead{display:block}
  .print-only{display:inline}
  /* 표는 페이지를 넘겨 이어지되 행은 쪼개지 않고, 머리행은 새 장에 다시 찍는다 */
  thead{display:table-header-group}
  tfoot{display:table-row-group}
  tr{break-inside:avoid}
  .sheet.pagebreak{break-after:page}
  table.ledger{font-size:8px}
  table.ledger th,table.ledger td{padding:2px 3px;white-space:nowrap}
}

/* 화면과 출력물 공통: 열의 의미에 맞춘 정렬 */
th,th.n,th.c{ text-align:center!important;vertical-align:middle }
td{ text-align:left;word-break:keep-all;overflow-wrap:anywhere }
td.ui-prose{text-align:justify;text-align-last:left;line-height:1.7}
td.c,td.ui-center,td.ui-center input{ text-align:center!important }
td.n,input.money{ text-align:right!important;font-variant-numeric:tabular-nums }
#classList td:nth-child(2) input{text-align:center}
tr.sum td[colspan]{text-align:center;font-weight:700}
@media screen{
th{background:#e7eff6;color:#324f69;border-bottom:2px solid #adc1d4}
tbody tr:nth-child(even):not(.sum):not(.out):not(.hl)>td:not([rowspan]){background:#f8fafc}
tbody tr:hover>td{background:#eef5fb!important}
tr.sum td{background:#e8f2ee;color:#254d42;border-top:2px solid #97b9aa}
table.ledger td[rowspan]{background:#f0f4f8}
}
@media print{
@page{size:A4 portrait;margin:15mm 13mm 13mm}
@page wide-ledger{size:A4 landscape;margin:13mm 13mm 12mm}
body:has(#lg_body table.ledger),body:has(#bk_body table.sheet),body:has(#hp_body table.sheet){page:wide-ledger}
:root{--ink:#263849;--dim:#4d6071;--line:#bdcbd5;--line2:#edf3f7;--accent:#315e7e;--faint:#596b7a}
html,body{height:auto!important;overflow:visible!important}
body{font-size:12.5px;line-height:1.6;padding:0;color:#263849;background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}
main,.panel{max-width:none;box-shadow:none}

<script>
"use strict";

/* ==========================================================================
   1. 상수 · 유틸
   ========================================================================== */

const LS_KEY = "nursery-settlement-v1";

/* 세목마다 얼마 만에 한 번 걷는지. 금액 계산에는 쓰지 않고, 수납 입력과
   보호자 안내문에서 "무엇을 언제 걷는 돈인지" 알려 주는 데 쓴다. */
const CYCLES = {
  monthly: { label: "매월",     times: 12 },
  quarter: { label: "분기별",   times: 4 },
  half:    { label: "반기별",   times: 2 },
  year:    { label: "연 1회",   times: 1 },
  adhoc:   { label: "수시 (행사가 있을 때)", times: 0 },
};
function cycleLabel(it){ return (CYCLES[it && it.cycle] || CYCLES.adhoc).label; }

const GROUPS = {
  "특별활동비":   { income: "211목 특별활동비",   expense: "411목 특별활동비" },
  "기타필요경비": { income: "221목 기타필요경비", expense: "421목 기타필요경비" },
};

function uid(p){ return (p||"id") + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }

/**
 * 표 머리에 기호를 붙인다 — 어느 칸을 어떻게 더하고 뺀 값인지 눈으로 따라가라고.
 *   col("수납액", "A")              → 수납액 (A)
 *   col("남은 금액", "D = A + B − C") → 남은 금액 (D = A + B − C)
 * 화면과 인쇄물에 똑같이 나온다.
 */
/* 세목처럼 개수가 정해지지 않은 칸에 붙이는 기호 */
const MARKS = ["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩", "⑪", "⑫"];

/**
 * 「이월 + 수납 + 전입금 − 사용 = 남은 금액」 꼴의 금액 칸에 A·B·C… 를 매긴다.
 * 이월과 전입금 칸은 있을 때도 없을 때도 있어 글자가 밀리므로 여기서 한 번에 계산한다.
 *
 *   moneyCols(true, true) → [["이월","A"],["보호자 수납액","B"],["전입금 충당","C"],
 *                            ["실 사용금액","D"],["남은 금액","E = A + B + C − D"]]
 */
/* 보호자용 서류는 「결제하신 금액 − 카드수수료 − 실 사용금액 = 남은 금액」으로 읽힌다 */
function noticeCols(hasCarry, hasTransfer, hasFee){
  const L = "ABCDEF".split("");
  const out = [];
  if (hasCarry)    out.push(["이월", L[out.length]]);
  out.push(["수납액 (결제하신 금액)", L[out.length]]);
  if (hasFee)      out.push(["카드수수료", L[out.length]]);
  if (hasTransfer) out.push(["전입금 충당", L[out.length]]);
  out.push(["실 사용금액", L[out.length]]);
  const plus = out.filter(c => c[0] !== "카드수수료" && c[0] !== "실 사용금액").map(c => c[1]).join(" + ");
  const minus = out.filter(c => c[0] === "카드수수료" || c[0] === "실 사용금액").map(c => c[1]).join(" − ");
  out.push(["남은 금액", `${L[out.length]} = ${plus} − ${minus}`]);
  return out;
}

function moneyCols(hasCarry, hasTransfer, paidLabel, usedLabel){
  const L = "ABCDE".split("");
  const out = [];
  if (hasCarry)    out.push(["이월", L[out.length]]);
  out.push([paidLabel || "수납액", L[out.length]]);
  if (hasTransfer) out.push(["전입금 충당", L[out.length]]);
  out.push([usedLabel || "실 사용금액", L[out.length]]);
  const plus  = out.slice(0, out.length - 1).map(c => c[1]).join(" + ");
  const minus = out[out.length - 1][1];
  out.push(["남은 금액", `${L[out.length]} = ${plus} − ${minus}`]);
  return out;
}

function col(label, sym){
  return esc(label) + (sym ? `<span class="sym">(${esc(sym)})</span>` : "");
}
function won(n){ return (Number(n)||0).toLocaleString("ko-KR"); }
function num(v){
  const s = String(v ?? "").replace(/[^0-9-]/g, "");
  if (s === "" || s === "-") return 0;
  return parseInt(s, 10);
}

/* 금액 칸(class="money")은 적는 동안에도 천 단위 쉼표를 붙인다.
   쉼표가 늘거나 줄어도 커서가 제자리에 있도록, 커서 앞의 숫자 개수를 세어
   다시 그 자리로 돌려놓는다. */
document.addEventListener("input", e => {
  const el = e.target;
  if (!el || el.tagName !== "INPUT" || !el.classList.contains("money")) return;
  const before = el.value;
  const digits = before.replace(/[^0-9-]/g, "");
  if (digits === "" || digits === "-") return;        // 비었거나 부호만 — 그대로 둔다
  const text = won(num(before));
  if (text === before) return;
  const caret = el.selectionStart ?? before.length;
  const seenBefore = before.slice(0, caret).replace(/[^0-9-]/g, "").length;
  el.value = text;
  let seen = 0, pos = text.length;
  for (let i = 0; i < text.length; i++) {
    if (/[0-9-]/.test(text[i])) seen++;
    if (seen === seenBefore) { pos = i + 1; break; }
  }
  if (seenBefore === 0) pos = 0;
  try { el.setSelectionRange(pos, pos); } catch (err) {}
}, true);
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/** HTML 조각을 노드로. 최상위 요소가 여럿이면 조각(fragment)으로 돌려준다. */
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.children.length > 1 ? t.content : t.content.firstElementChild;
}
function $(sel, root){ return (root || document).querySelector(sel); }
function $$(sel, root){ return Array.from((root || document).querySelectorAll(sel)); }

/* ---- 회계연도: 3월 1일 ~ 익년 2월 말일 ---- */
function defaultFiscalYear(){
  const d = new Date();
  return d.getMonth() + 1 >= 3 ? d.getFullYear() : d.getFullYear() - 1;
}
function fyStart(y){ return y + "-03-01"; }
function fyEnd(y){
  const last = new Date(y + 1, 2, 0).getDate();   // 익년 2월 말일 (윤년 반영)
  return (y + 1) + "-02-" + String(last).padStart(2, "0");
}
/** 회계연도의 12개월을 순서대로: 3~12월, 익년 1~2월 */
function fyMonths(y){
  const out = [];
  for (let m = 3; m <= 12; m++) out.push({ key: y + "-" + String(m).padStart(2,"0"), label: m + "월" });
  for (let m = 1; m <= 2; m++)  out.push({ key: (y+1) + "-" + String(m).padStart(2,"0"), label: m + "월" });
  return out;
}
function monthKey(dateStr){ return String(dateStr || "").slice(0, 7); }
function inRange(d, from, to){
  if (!d) return false;
  if (from && d < from) return false;
  if (to   && d > to)   return false;
  return true;
}

/* ==========================================================================
   2. 저장소
   ========================================================================== */

let S = null;
let saveTimer = null;

/**
 * 세목 기본값. stdAmount는 그 어린이집이 보호자에게 공지한 1인당 수납액으로,
 * 수납결의서를 적을 때 자동으로 채워 넣는 데 쓴다.
 */
/* 주기를 적어 두지 않은 예전 자료는 세목 성격으로 미루어 채운다 */
function defaultCycle(it){
  if (it.special === "prep") return "year";
  if (it.targetMode === "event") return "adhoc";
  return "monthly";
}

function defaultItems(){
  return [
    { id:"it_prep",  name:"입학준비금", group:"기타필요경비", targetMode:"fixed", enabled:true, special:"prep",
      stdAmount:0, cycle:"year",
      note:"원복·체육복·모자·가방·수첩·명찰·전자출결태그비 등. 부모가 고른 세부 항목만 수납하므로 원아마다 금액이 다른 것이 정상" },
    { id:"it_sa",    name:"특별활동비", group:"특별활동비", targetMode:"fixed", enabled:true, stdAmount:0, cycle:"monthly",
      note:"외부강사 프로그램의 교재교구 구입 및 강사 인건비. 과목이 여러 개면 과목별로 세목을 추가하세요" },
    { id:"it_field", name:"현장학습비", group:"기타필요경비", targetMode:"event", enabled:true, stdAmount:0, cycle:"adhoc",
      note:"어린이집 외부 프로그램의 입장료·시설사용료·교통비·음료비" },
    { id:"it_bus",   name:"차량운행비", group:"기타필요경비", targetMode:"fixed", enabled:true, stdAmount:0, cycle:"monthly",
      note:"학부모 요청에 의한 통학차량 이용 시로 한정" },
    { id:"it_event", name:"행사비", group:"기타필요경비", targetMode:"event", enabled:true, stdAmount:0, cycle:"adhoc",
      note:"입학·졸업·연말·생일·재롱잔치 등" },
    { id:"it_album", name:"앨범비", group:"기타필요경비", targetMode:"fixed", enabled:true, stdAmount:0, cycle:"year",
      note:"졸업생 중 신청자에 한함. 신청한 원아만 명단에 넣으세요" },
    { id:"it_meal",  name:"급식비", group:"기타필요경비", targetMode:"fixed", enabled:false, stdAmount:0, cycle:"monthly",
      note:"아침·저녁 급식비" },
    { id:"it_local", name:"기타 시·도 특성화비용", group:"기타필요경비", targetMode:"fixed", enabled:true, stdAmount:0, cycle:"monthly",
      note:"지역 특성을 반영한 특성화 보육활동의 교재교구·프로그램 운영 재료비" },
  ];
}

/**
 * 저장 구조
 *   { version, fiscalYear, years: { "2026": {...}, "2027": {...} }, lastBackupAt }
 *
 * 회계연도마다 자료를 따로 보관한다. 새 회계연도를 시작해도 지난 해 자료는
 * 그대로 남고, 화면 위 회계연도에서 언제든 오갈 수 있다.
 * 지금 보고 있는 연도의 자료는 S에 펼쳐 두어 코드가 S.children처럼 바로 쓴다.
 */
const YEAR_FIELDS = ["classes", "children", "items", "rosters", "vouchers", "receipts", "expenses"];

function emptyYear(){
  return {
    classes: [],
    children: [],
    items: defaultItems(),
    rosters: [],
    vouchers: [],   // 수납결의서 1건 = { date, voucherNo, itemId, summary, lines[] }
    receipts: [],   // 결의서에서 파생된 원아별 수납 기록
    expenses: [],
  };
}

/* 보호자가 카드로 결제하면 수수료를 뗀 금액이 통장에 들어온다.
   그 수수료를 어떻게 적느냐가 어린이집마다 갈린다.
     net   — 통장에 들어온 금액(수수료 뺀 금액)을 그대로 수입결의·정산 수납액으로
     gross — 카드 승인액을 수입결의·정산 수납액으로 잡고, 수수료는 운영비에서
             따로 지출결의로 뺀다
   어느 쪽이든 원아별 배분·잔액 계산은 lines에 적힌 금액으로만 한다. */
const CARD_FEE_MODES = {
  net:   { label: "순액 방식", short: "통장에 들어온 금액을 수납액으로",
           desc: "카드 승인액에서 수수료를 뺀 <b>실제 입금액</b>을 수입결의와 정산 수납액으로 잡습니다. 수수료를 따로 지출결의하지 않습니다." },
  gross: { label: "총액 방식", short: "카드 승인액을 수납액으로",
           desc: "<b>카드 승인액</b>을 수입결의와 정산 수납액으로 잡고, 수수료는 운영비에서 <b>따로 지출결의</b>로 뺍니다." },
};
function cardFeeMode(){ return S && S.cardFeeMode === "gross" ? "gross" : "net"; }
function isGross(){ return cardFeeMode() === "gross"; }

function defaultStore(){
  const y = defaultFiscalYear();
  const st = { version: 2, fiscalYear: y, years: {}, lastBackupAt: null, cardFeeMode: "net" };
  st.years[y] = emptyYear();
  YEAR_FIELDS.forEach(k => st[k] = st.years[y][k]);
  return st;
}

/** 지금 보고 있는 연도의 자료를 보관함에 되돌려 넣는다 */
function syncYear(){
  const d = {};
  YEAR_FIELDS.forEach(k => d[k] = S[k]);
  S.years[S.fiscalYear] = d;
}

/** 보관함에서 그 연도 자료를 꺼내 펼친다 */
function loadYear(y){
  if (!S.years[y]) S.years[y] = emptyYear();
  S.fiscalYear = +y;
  YEAR_FIELDS.forEach(k => S[k] = S.years[y][k]);
  rebuildReceipts();
}

/** 저장·백업에 쓰는 모양 — 펼쳐 둔 자료는 빼고 보관함만 담는다 */
function storeShape(){
  syncYear();
  return { version: 2, fiscalYear: S.fiscalYear, years: S.years,
           lastBackupAt: S.lastBackupAt, cardFeeMode: cardFeeMode() };
}

function listYears(){
  return Object.keys(S.years).map(Number).sort((a, b) => a - b);
}

function switchYear(y){
  syncYear();
  loadYear(y);
  Object.keys(view).forEach(k => delete view[k]);
  activeTab = "setup";
  save(); initHeader(); render();
}

function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { S = migrate(JSON.parse(raw)); return; }
  } catch (e) {
    console.error("저장 데이터를 읽지 못했습니다", e);
  }
  S = defaultStore();
}

/** 예전 판으로 입력한 자료를 지금 구조로 옮긴다 */
function migrate(raw){
  let st;
  if (raw && raw.years) {
    st = { version: 2, fiscalYear: +raw.fiscalYear, years: raw.years,
           lastBackupAt: raw.lastBackupAt || null,
           cardFeeMode: raw.cardFeeMode === "gross" ? "gross" : "net" };
  } else {
    /* 한 해분만 담던 판 — 그 해를 보관함 첫 칸에 넣는다 */
    const y = (raw && raw.fiscalYear) || defaultFiscalYear();
    st = { version: 2, fiscalYear: +y, years: {}, lastBackupAt: (raw && raw.lastBackupAt) || null,
           cardFeeMode: (raw && raw.cardFeeMode) === "gross" ? "gross" : "net" };
    const d = emptyYear();
    YEAR_FIELDS.forEach(k => { if (raw && raw[k]) d[k] = raw[k]; });
    st.years[y] = d;
  }
  Object.keys(st.years).forEach(y => fixYear(st.years[y]));
  if (!st.years[st.fiscalYear]) st.fiscalYear = +Object.keys(st.years).sort()[0];
  S = st;
  loadYear(st.fiscalYear);
  return S;
}

/** 한 해분 자료의 예전 흔적을 손질한다 */
function fixYear(d){
  YEAR_FIELDS.forEach(k => { if (!Array.isArray(d[k])) d[k] = k === "items" ? defaultItems() : []; });

  for (const c of d.children) {
    if (!c.consignPeriods) {
      c.consignPeriods = (c.enrollments || [])
        .filter(e => e.type === "consign")
        .map(e => ({ id: uid("cp"), startMonth: monthKey(e.startDate),
                     endMonth: e.endDate ? monthKey(e.endDate) : null, employer: e.employer || "" }));
    }
    delete c.enrollments;
  }
  /* 수납결의서가 없던 판의 수납 기록을 (수납일 · 세목)별로 묶어 결의서 하나로 만든다 */
  if (!d.vouchers.length && d.receipts.length) {
    const byKey = new Map();
    for (const r of d.receipts) {
      const k = r.date + "|" + r.itemId;
      if (!byKey.has(k)) byKey.set(k, { id: uid("vc"), date: r.date, voucherNo: "", itemId: r.itemId,
                                        summary: "", perAmount: 0, lines: [], total: 0 });
      const v = byKey.get(k);
      v.lines.push({ childId: r.childId, amount: r.amount, memo: r.memo || "" });
      v.total += r.amount;
    }
    d.vouchers = Array.from(byKey.values());
  }
  /* 카드수수료는 지출이 아니라 수납 쪽 일이므로 자리를 옮겼다.
     예전 지출건에 붙어 있던 수수료는 어린이집이 낸 몫이니 운영비 부담분에 합친다. */
  for (const ex of d.expenses) {
    if (ex.cardFee) ex.operAmount = (ex.operAmount || 0) + ex.cardFee;
    delete ex.cardFee;
  }
  for (const x of d.vouchers) if (typeof x.cardFee !== "number") x.cardFee = 0;
  for (const it of d.items) {
    if (!CYCLES[it.cycle]) it.cycle = defaultCycle(it);
    delete it.limit; delete it.yearLimit;
  }
  delete d.consignPays;
  delete d.refunds;
}

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 120);
}

  try {

/* ==========================================================================
   3. 조회 헬퍼
   ========================================================================== */

function itemById(id){ return S.items.find(i => i.id === id) || null; }
function itemName(id){ const i = itemById(id); return i ? i.name : "(삭제된 세목)"; }
function childById(id){ return S.children.find(c => c.id === id) || null; }
function childName(id){ const c = childById(id); return c ? c.name : "(삭제된 원아)"; }
function classById(id){ return S.classes.find(c => c.id === id) || null; }
function enabledItems(){ return S.items.filter(i => i.enabled); }

/** 재원 여부 — 입소일 이상, 퇴소일 이하 */
function isEnrolled(child, date){
  if (!child || !date) return false;
  if (child.admitDate && date < child.admitDate) return false;
  if (child.leaveDate && date > child.leaveDate) return false;
  return true;
}
/**
 * 위탁보육 기간은 월 단위로 잡는다.
 * 위탁보육료는 그 달치를 그 달 아무 날에나 받으므로, 일 단위로 따지면
 * 같은 달에 먼저 나간 지출이 보호자 부담으로 잘못 잡힌다.
 * 그래서 위탁보육료를 받기 시작한 달이면 그 달 전체를 위탁으로 본다.
 */
function consignPeriodsOf(child){
  if (child.consignPeriods) return child.consignPeriods;
  /* 옛 자료(재원 구간) 호환 */
  return (child.enrollments || []).filter(e => e.type === "consign")
    .map(e => ({ startMonth: monthKey(e.startDate), endMonth: e.endDate ? monthKey(e.endDate) : null, employer: e.employer }));
}
function isConsignMonth(child, monthOrDate){
  const m = String(monthOrDate || "").slice(0, 7);
  if (!m) return false;
  return consignPeriodsOf(child).some(cp =>
    cp.startMonth && m >= cp.startMonth && (!cp.endMonth || m <= cp.endMonth));
}
/** 지출일이 위탁 월이면 그 배분은 위탁보육료로 충당되므로 보호자 정산에서 뺀다 */
function isConsign(child, date){ return isConsignMonth(child, date); }
/** 해당 날짜의 반 — 반 소속 이력에서 시작일이 그날 이하인 마지막 항목 */
function classAt(child, date){
  const hist = (child.classHistory || []).slice().sort((a,b) => (a.startDate||"").localeCompare(b.startDate||""));
  if (!hist.length) return null;
  let found = null;
  for (const h of hist) if (!h.startDate || h.startDate <= date) found = h;
  return classById((found || hist[0]).classId);
}
function currentClass(child){ return classAt(child, todayISO()) || classAt(child, fyEnd(S.fiscalYear)); }

/** 화면·배분 순서를 고정하는 원아 정렬 — 반 순서 → 이름 */
function sortedChildren(list){
  const order = new Map(S.classes.map((c, i) => [c.id, i]));
  return (list || S.children).slice().sort((a, b) => {
    const ca = currentClass(a), cb = currentClass(b);
    const oa = ca ? order.get(ca.id) ?? 99 : 99;
    const ob = cb ? order.get(cb.id) ?? 99 : 99;
    if (oa !== ob) return oa - ob;
    return a.name.localeCompare(b.name, "ko");
  });
}

/* ==========================================================================
   4. 계산 — 배분 · 잔액
   ========================================================================== */

/**
 * 균등배분. 1인당 내림 후 나머지를 앞 순번부터 1원씩 가산해
 * 배분 합계가 필요경비 부담분과 정확히 일치하게 만든다.
 */
function allocate(amount, childIds){
  const n = childIds.length;
  if (n === 0 || amount <= 0) return childIds.map(id => ({ childId: id, amount: 0 }));
  const q = Math.floor(amount / n);
  const r = amount - q * n;
  return childIds.map((id, i) => ({ childId: id, amount: q + (i < r ? 1 : 0) }));
}

function sumReceipts(childId, itemId, from, to){
  return S.receipts.reduce((s, r) =>
    (r.childId === childId && r.itemId === itemId && inRange(r.date, from, to)) ? s + r.amount : s, 0);
}
/** 그 기간에 수납한 날짜들 — 수입부 대장의 「월별 징수실적(날인)」 칸에 쓴다 */
function receiptDates(childId, itemId, from, to){
  return S.receipts
    .filter(r => r.childId === childId && r.itemId === itemId && inRange(r.date, from, to))
    .map(r => r.date).sort()
    .map(d => +d.slice(5, 7) + "/" + +d.slice(8, 10));
}

/** 대장·통계용 총 배분액 (위탁 충당분 포함) */
function sumAlloc(childId, itemId, from, to){
  let total = 0;
  for (const ex of S.expenses) {
    if (ex.itemId !== itemId || !inRange(ex.date, from, to)) continue;
    for (const a of ex.allocations) if (a.childId === childId) total += a.amount;
  }
  return total;
}

/** 위탁보육료로 충당되는 배분액 — 보호자 정산에서 빠지는 몫 */
function sumConsignCovered(childId, itemId, from, to){
  const c = childById(childId);
  if (!c) return 0;
  let total = 0;
  for (const ex of S.expenses) {
    if (ex.itemId !== itemId || !inRange(ex.date, from, to)) continue;
    if (!isConsignMonth(c, ex.date)) continue;
    for (const a of ex.allocations) if (a.childId === childId) total += a.amount;
  }
  return total;
}
/**
 * 원아 × 세목 잔액. 세목 간 상계 없음 (재무회계규칙 제15조)
 *
 * 위탁 원아는 보호자가 아니라 회사가 낸다. 그 달 지출은 전입금으로 충당되므로
 * 같은 금액을 수입(transferIn)으로도 잡아 준다. 그래야 대장과 정산보고서에서
 * 수입과 지출이 맞아떨어지고, 위탁 원아의 수입 칸이 비어 있지 않다.
 *
 *   수입 = 보호자 수납(paid) + 전입금 충당(transferIn)
 *   지출 = 보호자 몫 사용(used) + 전입금 몫 사용(consign)
 *   남은 금액 = 수입 − 지출 = paid − used   ← 전입금은 서로 상쇄되어 영향이 없다
 */
function balance(childId, itemId, from, to){
  const paid     = sumReceipts(childId, itemId, from, to);
  const total    = sumAlloc(childId, itemId, from, to);
  const consign  = sumConsignCovered(childId, itemId, from, to);
  const used     = total - consign;
  return { paid, used, consign, transferIn: consign,
           income: paid + consign, totalUsed: total, left: paid - used };
}

/** 원아의 사용 건별 내역 (역추적용) */
function usageRows(childId, itemId, from, to){
  const c = childById(childId);
  const rows = [];
  for (const ex of S.expenses) {
    if (itemId && ex.itemId !== itemId) continue;
    if (!inRange(ex.date, from, to)) continue;
    const a = ex.allocations.find(x => x.childId === childId);
    if (!a || a.amount === 0) continue;
    rows.push({ expenseId: ex.id, date: ex.date, itemId: ex.itemId, summary: ex.summary,
                voucherNo: ex.voucherNo || "", needAmount: ex.needAmount,
                headcount: ex.allocations.length, amount: a.amount,
                consign: !!c && isConsignMonth(c, ex.date) });
  }
  return rows.sort((x, y) => x.date.localeCompare(y.date));
}

/**
 * 정산용 잔액. 기간 내 배분에 더해, 정산 화면에서 사유를 달아 포함시킨 배분은
 * 기준일을 넘겼더라도(퇴소 후 결제된 그달 유류비 등) 사용액으로 잡는다.
 * forcedTo를 넘겨 그 범위를 기준일이 속한 달까지로 묶는다.
 */
function settleAllocRows(childId, itemId, from, to, forcedTo){
  const c = childById(childId);
  const rows = [];
  for (const ex of S.expenses) {
    if (itemId && ex.itemId !== itemId) continue;
    const a = ex.allocations.find(x => x.childId === childId);
    if (!a || !a.amount) continue;
    const forced = (ex.overrides || []).some(o => o.childId === childId);
    const within = inRange(ex.date, from, to);
    if (!within && !(forced && inRange(ex.date, from, forcedTo))) continue;
    rows.push({ expenseId: ex.id, date: ex.date, itemId: ex.itemId, summary: ex.summary,
                voucherNo: ex.voucherNo || "", needAmount: ex.needAmount,
                headcount: ex.allocations.length, amount: a.amount,
                forced: forced && !within,
                consign: !!c && isConsignMonth(c, ex.date) });
  }
  return rows.sort((x, y) => x.date.localeCompare(y.date));
}
function settleBalance(childId, itemId, from, to, forcedTo){
  const paid    = sumReceipts(childId, itemId, from, to);
  const rows    = settleAllocRows(childId, itemId, from, to, forcedTo);
  const used    = rows.filter(r => !r.consign).reduce((s, r) => s + r.amount, 0);
  const consign = rows.filter(r =>  r.consign).reduce((s, r) => s + r.amount, 0);
  return { paid, used, consign, transferIn: consign,
           income: paid + consign, totalUsed: used + consign, left: paid - used };
}

/** 어린이집 이름 — 물품관리시스템과 같은 저장 키를 써서 한 번만 적으면 양쪽에 다 찍힌다 */
function centerName(){
  try { return localStorage.getItem("centerName") || ""; } catch (e) { return ""; }
}
function setCenterName(v){
  try { localStorage.setItem("centerName", v); } catch (e) {}
}

function addDays(dateStr, n){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function monthBounds(dateStr){
  const y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7);
  return { from: dateStr.slice(0, 7) + "-01",
           to: dateStr.slice(0, 7) + "-" + String(new Date(y, m, 0).getDate()).padStart(2, "0") };
}

/** 지출건의 대상 원아를 바꾸고 재배분한다. 순서는 항상 원아 정렬 순서로 고정. */
function setExpenseTargets(ex, childIds){
  const want = new Set(childIds);
  const ordered = sortedChildren().filter(c => want.has(c.id)).map(c => c.id);
  ex.allocations = allocate(ex.needAmount, ordered);
  ex.overrides = (ex.overrides || []).filter(o => want.has(o.childId));
}

/**
 * 4분기(12월·1월·2월)인가.
 *
 * 어린이집은 한 해를 통으로 정산하지 매달 세목별 잔액을 맞추지 않는다.
 * 3월에 한 학기치를 걷어 두고 쓰다 보면 초반 몇 달은 잔액이 마이너스인 것이
 * 오히려 흔하고, 다음 분기 수납이 들어오면 저절로 메워진다. 그래서 잔액이
 * 모자라다는 알림을 일찍 띄우면 헛경고만 쌓인다.
 *
 * 그러나 4분기에 들어서면 더 들어올 수납이 사실상 없다. 이때부터 잔액이
 * 모자라면 그 몫은 끝내 어린이집 운영비에서 나가야 한다. 그래서 12월부터만
 * 알린다.
 */
function isLastQuarter(dateStr){
  const m = +String(dateStr || "").slice(5, 7);
  return m === 12 || m === 1 || m === 2;
}

/**
 * 이 지출건까지 넣었을 때 잔액이 모자라는 원아를 찾는다.
 * 모자란 몫은 보호자에게 더 받을 수 없으므로 어린이집 운영비 부담이 된다.
 *
 *   editingId — 고치는 중인 지출건. 이미 저장된 그 건의 배분은 빼고 센다.
 */
function shortfallRows(itemId, alloc, date, editingId){
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const out = [];
  for (const a of alloc) {
    const c = childById(a.childId);
    if (!c) continue;
    /* 위탁 월 지출은 전입금이 같은 금액으로 들어오므로 잔액에 영향이 없다 */
    if (isConsignMonth(c, date)) continue;
    const b = balance(a.childId, itemId, from, to);
    let used = b.totalUsed;
    if (editingId) {
      const old = S.expenses.find(e => e.id === editingId);
      if (old && old.itemId === itemId) {
        const oa = (old.allocations || []).find(x => x.childId === a.childId);
        if (oa) used -= oa.amount;
      }
    }
    used += a.amount;
    const short = used - b.income;
    if (short > 0) out.push({ childId: a.childId, name: c.name, short });
  }
  return out;
}

/** 어린이집 부담 집계 — 운영비 부담분 · 카드수수료 · 배분 단수차
 *
 *  카드수수료는 수납결의서에 적힌다. 총액 방식이면 운영비에서 따로 나가므로
 *  어린이집 부담에 더하고, 순액 방식이면 이미 수납액에서 빠져 있으므로
 *  합계에 더하지 않고 참고로만 보여 준다. */
function centerBurden(from, to){
  let oper = 0, rounding = 0;
  for (const ex of S.expenses) {
    if (!inRange(ex.date, from, to)) continue;
    oper += ex.operAmount || 0;
    rounding += ex.needAmount - ex.allocations.reduce((s, a) => s + a.amount, 0);
  }
  const fee = S.vouchers.filter(x => inRange(x.date, from, to))
                        .reduce((s, x) => s + (x.cardFee || 0), 0);
  return { oper, fee, rounding, feeCounted: isGross(),
           total: oper + rounding + (isGross() ? fee : 0) };
}

/* ---- 반 ---- */
function renderClasses(root){
  root.innerHTML = `<h3>1. 반 구성</h3>

  const add = () => {
    const name = $("#newClass", root).value.trim();
    if (!name) return;
    S.classes.push({ id: uid("cl"), name });
    save(); render();
  };
  $("#addClass", root).onclick = add;
  $("#newClass", root).onkeydown = e => { if (e.key === "Enter") add(); };

  const list = $("#classList", root);
  if (!S.classes.length) { list.innerHTML = `<div class="empty">반이 없습니다. 먼저 반을 추가하세요.</div>`; return; }

  const t = el(`<table><thead><tr>
    <th style="width:60px">순서</th><th>반 이름</th><th class="c" style="width:90px">소속 원아</th>
    <th class="c" style="width:170px">관리</th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  S.classes.forEach((c, i) => {
    const count = S.children.filter(ch => (ch.classHistory || []).some(h => h.classId === c.id)).length;
    const tr = el(`<tr>
      <td class="c">${i + 1}</td>
      <td class="ui-center"><input value="${esc(c.name)}" data-k="name" style="width:100%"></td>
      <td class="c">${count}명</td>
      <td class="c">
        <button class="b" data-a="up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="b" data-a="down" ${i === S.classes.length - 1 ? "disabled" : ""}>↓</button>
        <button class="b danger" data-a="del">삭제</button>
      </td></tr>`);
    $('[data-k="name"]', tr).onchange = e => { c.name = e.target.value.trim() || c.name; save(); render(); };
    $('[data-a="up"]',   tr).onclick = () => { S.classes.splice(i-1, 0, S.classes.splice(i,1)[0]); save(); render(); };
    $('[data-a="down"]', tr).onclick = () => { S.classes.splice(i+1, 0, S.classes.splice(i,1)[0]); save(); render(); };
    $('[data-a="del"]',  tr).onclick = () => {
      if (count) { alert("소속 이력이 있는 원아가 " + count + "명 있어 삭제할 수 없습니다."); return; }
      if (!confirm(`"${c.name}"을(를) 삭제할까요?`)) return;
      S.classes.splice(i, 1); save(); render();
    };
    tb.appendChild(tr);
  });
  list.appendChild(t);
}

/* ---- 회계연도 마감과 승계 ---- */
function renderRollover(root){
  const fy = S.fiscalYear;
  const years = listYears();
  root.innerHTML = `<h3>회계연도 마감과 승계</h3>
    <div class="hint">3월 신학기가 되면 <b>새 회계연도 시작</b>을 눌러 새 해를 만드세요.
      <b>지난 해 자료는 그대로 남습니다.</b> 화면 위 <b>회계연도</b>에서 언제든 오갈 수 있습니다.<br>
      먼저 새 해의 <b>반 구성</b>을 확정하고, 그 반으로 <b>원아를 배치</b>하는 두 단계로 진행합니다.</div>
    <div class="row" style="margin-top:8px">
      <button class="b pri" id="btnRollover">새 회계연도 시작 (${fy + 1}년도)</button>
      <span class="hint" style="margin-bottom:6px">
        지금 ${fy}년도에 원아 ${S.children.length}명 · 수납결의서 ${S.vouchers.length}건 · 지출 ${S.expenses.length}건.
      </span>
    </div>
    <h3>보관 중인 회계연도</h3>
    <div id="ro_years"></div>`;

  $("#btnRollover", root).onclick = () => {
    if (!S.classes.length) { alert("먼저 반을 만드세요."); return; }
    openRolloverModal();
  };

  const t = el(`<table style="max-width:760px"><thead><tr>
    <th style="width:110px">회계연도</th><th class="c" style="width:80px">원아</th>
    <th class="c" style="width:110px">수납결의서</th><th class="c" style="width:80px">지출</th>
    <th class="c" style="width:150px"></th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  for (const y of years) {
    const d = y === fy ? { children: S.children, vouchers: S.vouchers, expenses: S.expenses } : S.years[y];
    const on = y === fy;
    const tr = el(`<tr class="${on ? "hl" : ""}">
      <td><b>${y}년도</b>${on ? ' <span class="tag">보는 중</span>' : ""}</td>
      <td class="c">${(d.children || []).length}명</td>
      <td class="c">${(d.vouchers || []).length}건</td>
      <td class="c">${(d.expenses || []).length}건</td>
      <td class="c">
        ${on ? "" : '<button class="b" data-a="go">이 연도 보기</button>'}
        ${years.length > 1 ? '<button class="b danger" data-a="del">삭제</button>' : ""}
      </td></tr>`);
    const go = $('[data-a="go"]', tr);
    if (go) go.onclick = () => switchYear(y);
    const del = $('[data-a="del"]', tr);
    if (del) del.onclick = () => {
      if (!confirm(`${y}년도 자료를 통째로 지웁니다.\n원아 ${(d.children || []).length}명 · 수납결의서 ${(d.vouchers || []).length}건 · 지출 ${(d.expenses || []).length}건.\n\n되돌릴 수 없습니다. 계속할까요?`)) return;
      if (!confirm(`정말 ${y}년도를 지울까요?`)) return;
      if (y === fy) {
        const other = years.find(x => x !== y);
        delete S.years[y];
        loadYear(other);
      } else {
        delete S.years[y];
      }
      Object.keys(view).forEach(k => delete view[k]);
      save(); initHeader(); render();
    };
    tb.appendChild(tr);
  }
  $("#ro_years", root).appendChild(t);
}

/**
 * 새 회계연도 승계 — 두 단계.
 *   1) 새 해의 반 구성을 확정한다. 어린이집은 해마다 반 이름과 수가 조금씩 바뀐다.
 *   2) 그 반으로 원아를 배치한다.
 * 지난 해 자료는 건드리지 않는다. 반·세목·고정 명단은 복사해 새 해에 넣는다.
 */
function openRolloverModal(){
  const fy = S.fiscalYear, next = fy + 1;
  const exists = !!S.years[next];
  const kids = sortedChildren();

  /* 1단계 — 올해 반을 복사해 놓고 손보게 한다. id를 유지하면 원아 배치가 그대로 따라온다. */
  let newClasses = S.classes.map(c => ({ id: c.id, name: c.name }));
  const plan = new Map(kids.map(c => [c.id, {
    keep: !c.leaveDate,
    classId: (currentClass(c) || S.classes[0] || {}).id || "",
  }]));
  let step = 1;

  const body = el(`<div>
    ${exists ? `<div class="note bad">${next}년도가 이미 있습니다. 저장하면 그 해의 반·원아·세목이 <b>이 내용으로 덮어써집니다.</b>
      (${next}년도에 이미 넣어 둔 수납결의서와 지출은 그대로 남습니다.)</div>` : ""}
    <div class="note">지난 ${fy}년도 자료는 <b>그대로 남습니다.</b>
      화면 위 회계연도에서 ${fy}년도로 돌아가면 대장도 정산서도 그때 그대로 나옵니다.</div>
    <div class="row" style="margin:10px 0 4px">
      <b id="ro_stepname"></b>
      <span class="grow"></span>
      <span class="hint" style="margin-bottom:0" id="ro_step">1 / 2 단계</span>
    </div>
    <div id="ro_s1"></div>
    <div id="ro_s2"></div>
    <div class="row" style="margin-top:12px">
      <button class="b" id="ro_prev">← 이전</button>
      <button class="b pri" id="ro_next">다음 → 원아 배치</button>
      <span class="grow"></span>
      <span class="hint" style="margin-bottom:0" id="ro_count"></span>
    </div>
  </div>`);

  /* ---------------- 1단계: 반 구성 ---------------- */
  function drawClasses(){
    const host = $("#ro_s1", body);
    host.innerHTML = `<div class="hint">올해 반이 그대로 복사되어 있습니다.
      이름을 고치거나, 반을 더하거나 뺄 수 있습니다. 여기서 정한 반으로 다음 단계에서 원아를 배치합니다.</div>
      <div id="ro_cl" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px">
        <input id="ro_newcl" placeholder="반 이름 (예: 햇살반)" style="width:220px">
        <button class="b" id="ro_addcl">반 추가</button>
      </div>`;
    const t = el(`<table style="max-width:620px"><thead><tr>
      <th class="c" style="width:60px">순서</th><th>반 이름</th>
      <th class="c" style="width:110px">${fy}년도 원아</th>
      <th class="c" style="width:80px"></th></tr></thead><tbody></tbody></table>`);
    const tb = $("tbody", t);
    newClasses.forEach((cl, i) => {
      const n = kids.filter(k => (currentClass(k) || {}).id === cl.id).length;
      const tr = el(`<tr>
        <td class="c">${i + 1}</td>
        <td class="ui-center"><input value="${esc(cl.name)}" style="width:100%"></td>
        <td class="c">${n ? n + "명" : "-"}</td>
        <td class="c"><button class="b danger">삭제</button></td></tr>`);
      $("input", tr).onchange = e => { cl.name = e.target.value.trim() || cl.name; };
      $("button", tr).onclick = () => {
        newClasses.splice(i, 1);
        plan.forEach(v => { if (v.classId === cl.id) v.classId = (newClasses[0] || {}).id || ""; });
        drawClasses();
      };
      tb.appendChild(tr);
    });
    $("#ro_cl", host).appendChild(t);
    const add = () => {
      const name = $("#ro_newcl", host).value.trim();
      if (!name) return;
      newClasses.push({ id: uid("cl"), name });
      drawClasses();
    };
    $("#ro_addcl", host).onclick = add;
    $("#ro_newcl", host).onkeydown = e => { if (e.key === "Enter") add(); };
  }

  /* ---------------- 2단계: 원아 배치 ---------------- */
  function drawKids(){
    const host = $("#ro_s2", body);
    host.innerHTML = `<div class="hint">올라갈 아이는 <b>${next}년도 반</b>을 고르고,
      졸업하거나 그만둔 아이는 체크를 끄세요. 퇴소일이 적힌 아이는 미리 꺼 두었습니다.</div>
      <div class="row" style="margin:8px 0">
        <button class="b" id="ro_all">전체 올라감</button>
        <button class="b" id="ro_none">전체 제외</button>
      </div>
      <div class="scroll" style="max-height:330px"><div id="ro_list"></div></div>`;
    $("#ro_all", host).onclick  = () => { plan.forEach(v => v.keep = true);  drawKids(); };
    $("#ro_none", host).onclick = () => { plan.forEach(v => v.keep = false); drawKids(); };

    const t = el(`<table><thead><tr>
      <th class="c" style="width:50px">순번</th><th style="width:120px">성명</th>
      <th style="width:110px">${fy}년도 반</th>
      <th class="c" style="width:80px">올라감</th><th style="width:150px">${next}년도 반</th>
    </tr></thead><tbody></tbody></table>`);
    const tb = $("tbody", t);
    kids.forEach((c, i) => {
      const st = plan.get(c.id);
      const now = currentClass(c);
      const tr = el(`<tr class="${st.keep ? "" : "out"}">
        <td class="c">${i + 1}</td>
        <td class="ui-center"><b>${esc(c.name)}</b>${c.leaveDate ? ` <span class="tag">${esc(c.leaveDate)} 퇴소</span>` : ""}</td>
        <td>${now ? esc(now.name) : "-"}</td>
        <td class="c"><input type="checkbox" ${st.keep ? "checked" : ""}></td>
        <td class="ui-center"><select ${st.keep ? "" : "disabled"} style="width:100%">
          ${newClasses.map(cl => `<option value="${cl.id}" ${cl.id === st.classId ? "selected" : ""}>${esc(cl.name)}</option>`).join("")}
        </select></td></tr>`);
      $('input[type="checkbox"]', tr).onchange = e => { st.keep = e.target.checked; drawKids(); };
      $("select", tr).onchange = e => { st.classId = e.target.value; };
      tb.appendChild(tr);
    });
    $("#ro_list", host).appendChild(t);
    updateCount();
  }

  function updateCount(){
    const n = kids.filter(c => plan.get(c.id).keep).length;
    $("#ro_count", body).textContent = step === 1
      ? `반 ${newClasses.length}개`
      : `올라감 ${n}명 · 제외 ${kids.length - n}명`;
  }

  const okBtn = () => $(".modal .foot button.pri", mask);
  function showStep(){
    $("#ro_s1", body).hidden = step !== 1;
    $("#ro_s2", body).hidden = step !== 2;
    $("#ro_step", body).textContent = step + " / 2 단계";
    $("#ro_stepname", body).textContent = step === 1
      ? `1단계 — ${next}년도 반 구성` : `2단계 — 원아 배치`;
    $("#ro_prev", body).hidden = step === 1;
    $("#ro_next", body).hidden = step === 2;
    const ok = okBtn();
    if (ok) ok.hidden = step !== 2;
    if (step === 2) drawKids();
    updateCount();
  }
  $("#ro_next", body).onclick = () => {
    if (!newClasses.length) { alert("반이 하나도 없습니다."); return; }
    plan.forEach(v => { if (!newClasses.some(c => c.id === v.classId)) v.classId = newClasses[0].id; });
    step = 2; showStep();
  };
  $("#ro_prev", body).onclick = () => { step = 1; drawClasses(); showStep(); };

  drawClasses();

  const mask = openModal(`새 회계연도 시작 — ${next}년도`, body, () => {
    const keep = kids.filter(c => plan.get(c.id).keep);
    if (!confirm(`${next}년도를 만듭니다.\n\n반 ${newClasses.length}개 · 올라가는 원아 ${keep.length}명\n\n${fy}년도 자료는 그대로 남습니다. 계속할까요?`)) return false;

    const start = fyStart(next);
    const old = S.years[next] || emptyYear();
    const alive = new Set(keep.map(c => c.id));
    const fresh = {
      classes: newClasses.map(c => ({ id: c.id, name: c.name })),
      children: keep.map(c => Object.assign(JSON.parse(JSON.stringify(c)), {
        leaveDate: "",
        classHistory: [{ classId: plan.get(c.id).classId, startDate: start }],
      })),
      items: JSON.parse(JSON.stringify(S.items)),
      rosters: JSON.parse(JSON.stringify(S.rosters))
        .map(r => Object.assign(r, { childIds: r.childIds.filter(id => alive.has(id)) })),
      /* 이미 만들어 둔 해라면 그 해에 넣은 금액 자료는 건드리지 않는다 */
      vouchers: old.vouchers || [],
      receipts: old.receipts || [],
      expenses: old.expenses || [],
    };
    syncYear();
    S.years[next] = fresh;
    loadYear(next);
    Object.keys(view).forEach(k => delete view[k]);
    activeTab = "setup";
    save(); initHeader(); render();
    alert(`${next}년도로 넘어왔습니다. 반 ${newClasses.length}개 · 원아 ${keep.length}명이 올라왔습니다.\n${fy}년도는 화면 위 회계연도에서 다시 볼 수 있습니다.`);
    return true;
  });
  showStep();
}

/* ---- 카드수수료 처리 방식 ---- */
/* 보호자가 카드로 결제하면 수수료를 뗀 금액이 통장에 들어온다. 5만원을 결제하고
   수수료가 3원이면 통장에는 49,997원이 찍힌다. 그 3원을 어디에 적느냐가
   어린이집마다 갈리는데, 어느 쪽이든 틀린 것이 아니므로 골라 쓰게 한다. */
function renderCardFee(root){
  const cur = cardFeeMode();
  root.innerHTML = `<h3>4. 카드수수료 처리 방식</h3>
    <div class="hint">보호자가 카드로 결제하면 <b>수수료를 뗀 금액</b>이 통장에 들어옵니다.
      (예: 50,000원 결제 · 수수료 3원 → 통장 49,997원)<br>
      이 수수료를 어떻게 적는지가 어린이집마다 다릅니다. <b>우리 어린이집이 하던 방식</b>을 고르세요.
      고른 방식은 <b>수납 입력</b> 화면에서 그대로 따릅니다.</div>
    <table style="max-width:820px;margin-top:8px"><thead><tr>
      <th class="c" style="width:70px">선택</th><th style="width:130px">방식</th><th>이렇게 적습니다</th>
      <th class="n" style="width:150px">위 예시의 수납액</th>
    </tr></thead><tbody>
      ${Object.keys(CARD_FEE_MODES).map(k => {
        const m = CARD_FEE_MODES[k];
        return `<tr class="${k === cur ? "hl" : ""}">
          <td class="c"><input type="radio" name="cardFeeMode" value="${k}" ${k === cur ? "checked" : ""}></td>
          <td class="ui-center"><b>${esc(m.label)}</b></td>
          <td class="ui-prose">${m.desc}</td>
          <td class="n"><b>${won(k === "gross" ? 50000 : 49997)}원</b></td></tr>`;
      }).join("")}
    </tbody></table>`;
  $$('input[name="cardFeeMode"]', root).forEach(r => {
    r.onchange = e => {
      const to = e.target.value;
      const n = countFeeVouchers();
      if (!n) { S.cardFeeMode = to; save(); render(); return; }
      /* 수납액은 「수입결의서에 적은 금액」이다. 방식을 바꾸면 그 금액의 뜻이
         달라지므로, 이미 적어 둔 결의서도 함께 환산할지 물어본다.
         환산하지 않으면 예전 결의서는 예전 방식 그대로 남는다. */
      const gross = to === "gross";
      const ok = confirm(
        `카드수수료 처리 방식을 「${CARD_FEE_MODES[to].label}」으로 바꿉니다.\n\n` +
        `카드수수료가 적힌 수납결의서가 ${won(n)}건 있습니다.\n` +
        `그 결의서의 수납액도 새 방식에 맞게 바꿀까요?\n\n` +
        (gross
          ? "  확인 — 수수료를 더해 카드 승인액으로 올립니다 (36,997 → 37,000)\n"
          : "  확인 — 수수료를 빼서 통장 입금액으로 내립니다 (37,000 → 36,997)\n") +
        "  취소 — 방식만 바꾸고 예전 결의서 금액은 그대로 둡니다\n\n" +
        "보관 중인 모든 회계연도에 함께 적용됩니다.");
      S.cardFeeMode = to;
      if (ok) {
        const done = convertCardFeeMode(to);
        alert(`수납결의서 ${won(done)}건의 금액을 「${CARD_FEE_MODES[to].label}」에 맞게 바꿨습니다.`);
      }
      save(); render();
    };
  });
}

/** 카드수수료가 적힌 수납결의서가 몇 건인가 (보관 중인 모든 연도) */
function countFeeVouchers(){
  syncYear();
  return Object.keys(S.years).reduce((n, y) =>
    n + (S.years[y].vouchers || []).filter(v => (v.cardFee || 0) > 0 && v.lines.length).length, 0);
}

/**
 * 이미 적어 둔 수납결의서의 금액을 새 방식에 맞게 옮긴다.
 *
 *   gross — 수수료를 원아별로 나눠 더한다 (통장 입금액 → 카드 승인액)
 *   net   — 수수료를 원아별로 나눠 뺀다   (카드 승인액 → 통장 입금액)
 *
 * 나누는 방법은 배분과 같다 — 몫을 고루 주고 나머지는 앞에서부터 1원씩.
 * 그래야 합계가 수수료와 1원도 어긋나지 않는다.
 */
function convertCardFeeMode(to){
  syncYear();
  const sign = to === "gross" ? 1 : -1;
  let done = 0;
  for (const y of Object.keys(S.years)) {
    for (const v of (S.years[y].vouchers || [])) {
      const fee = v.cardFee || 0;
      if (!fee || !v.lines.length) continue;
      const share = new Map(allocate(fee, v.lines.map(l => l.childId)).map(a => [a.childId, a.amount]));
      v.lines.forEach(l => l.amount += sign * (share.get(l.childId) || 0));
      v.total = v.lines.reduce((s2, l) => s2 + l.amount, 0);
      done++;
    }
  }
  loadYear(S.fiscalYear);          // 파생 수납 기록을 다시 만든다
  return done;
}

function openChildModal(childId){
  const isNew = !childId;
  const c = isNew
    ? { id: uid("ch"), name: "", admitDate: fyStart(S.fiscalYear), leaveDate: "", memo: "",
        classHistory: [], consignPeriods: [] }
    : JSON.parse(JSON.stringify(childById(childId)));

  if (!c.classHistory)    c.classHistory = [];
  if (!c.consignPeriods)  c.consignPeriods = [];

  const firstClass = (c.classHistory[0] || {}).classId || (S.classes[0] || {}).id || "";
  const body = el(`<div>
    <div class="grid2">
      <label class="f">성명<input id="m_name" value="${esc(c.name)}"></label>
      <label class="f">반<select id="m_class">
        ${S.classes.length
          ? S.classes.map(cl => `<option value="${cl.id}" ${cl.id === firstClass ? "selected" : ""}>${esc(cl.name)}</option>`).join("")
          : `<option value="">— 먼저 반을 추가하세요 —</option>`}

    </div>
    <div class="grid2" style="margin-top:10px">
      <label class="f">입소일<input type="date" id="m_admit" value="${esc(c.admitDate || "")}"></label>
      <label class="f">퇴소일 (재원 중이면 비움)<input type="date" id="m_leave" value="${esc(c.leaveDate || "")}"></label>
    </div>
    <label class="f" style="margin-top:10px">비고<input id="m_memo" value="${esc(c.memo || "")}"></label>
    ${isNew ? "" : `<div class="hint" style="margin-top:8px">반이 바뀌었다면 여기서 고치지 말고
      원아 명부의 <b>「반 이동」</b> 버튼을 쓰세요. 이동일 전후가 자동으로 나뉩니다.
      여기서 반을 바꾸면 <b>처음부터 그 반이었던 것으로</b> 기록됩니다.</div>`}

    <h3>위탁보육 기간</h3>
    <div class="hint">보호자가 취직해 위탁보육료(전입금)를 받게 되면 그 <b>시작 월</b>을 적으세요.
      위탁보육료를 받는 달의 기타필요경비 지출은 <b>위탁보육료로 충당</b>되므로 보호자 정산에서 빠집니다.
      해당 없으면 비워 두시면 됩니다.</div>
    <div id="m_consign" style="margin-top:6px"></div>
    <button class="b" id="m_addConsign" style="margin-top:6px">위탁 기간 추가</button>
  </div>`);

  function drawConsign(){
    const host = $("#m_consign", body);
    host.innerHTML = "";
    if (!c.consignPeriods.length) {
      host.innerHTML = `<div class="hint">위탁보육 기간이 없습니다. 이 원아는 전 기간 <b>일반 재원</b>입니다.</div>`;
      return;
    }
    const t = el(`<table><thead><tr><th style="width:150px">시작 월</th>
      <th style="width:150px">종료 월 (계속이면 비움)</th><th>위탁 사업장</th>
      <th class="c" style="width:70px"></th></tr></thead><tbody></tbody></table>`);
    const tb = $("tbody", t);
    c.consignPeriods.forEach((cp, i) => {
      const tr = el(`<tr>
        <td><input type="month" data-k="s" value="${esc(cp.startMonth || "")}" style="width:100%"></td>
        <td><input type="month" data-k="e" value="${esc(cp.endMonth || "")}" style="width:100%"></td>
        <td><input data-k="emp" value="${esc(cp.employer || "")}" placeholder="예: ○○병원" style="width:100%"></td>
        <td class="c"><button class="b danger">삭제</button></td></tr>`);
      $('[data-k="s"]', tr).onchange   = e => { cp.startMonth = e.target.value; };
      $('[data-k="e"]', tr).onchange   = e => { cp.endMonth = e.target.value || null; };
      $('[data-k="emp"]', tr).onchange = e => { cp.employer = e.target.value; };
      $("button", tr).onclick          = () => { c.consignPeriods.splice(i, 1); drawConsign(); };
      tb.appendChild(tr);
    });
    host.appendChild(t);
  }

  drawConsign();
  $("#m_addConsign", body).onclick = () => {
    c.consignPeriods.push({ id: uid("cp"),
      startMonth: monthKey($("#m_admit", body).value || fyStart(S.fiscalYear)),
      endMonth: null, employer: "" });
    drawConsign();
  };

  openModal(isNew ? "원아 추가" : "원아 편집", body, () => {
    const name = $("#m_name", body).value.trim();
    if (!name) { alert("성명을 입력하세요."); return false; }
    c.name = name;
    c.admitDate = $("#m_admit", body).value;
    c.leaveDate = $("#m_leave", body).value || "";
    c.memo = $("#m_memo", body).value;
    if (c.leaveDate && c.admitDate && c.leaveDate < c.admitDate) { alert("퇴소일이 입소일보다 빠릅니다."); return false; }

    /* 반은 첫 이력으로만 다룬다. 이후 이동은 명부의 「반 이동」 버튼이 처리한다. */
    const clsId = $("#m_class", body).value;
    if (clsId) {
      if (!c.classHistory.length) c.classHistory = [{ classId: clsId, startDate: c.admitDate }];
      else {
        c.classHistory.sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
        c.classHistory[0] = { classId: clsId, startDate: c.admitDate };
      }
    }
    c.consignPeriods = c.consignPeriods.filter(cp => cp.startMonth);

    if (isNew) S.children.push(c);
    else S.children = S.children.map(x => x.id === c.id ? c : x);
    save(); render();
    return true;
  });
}

/** 반 이동 — 1년에 몇 번 없는 작업이라 이동일과 옮길 반만 묻는다 */
function openMoveClassModal(childId){
  const c = childById(childId);
  if (!c) return;
  if (!S.classes.length) { alert("먼저 기초설정에서 반을 추가하세요."); return; }
  const now = classAt(c, todayISO()) || currentClass(c);

  const body = el(`<div>
    <div class="hint">이동일만 적으면 그 전후가 자동으로 나뉩니다. 이동일 <b>이전</b> 기록은 옛 반으로 그대로 남습니다.</div>
    <div class="grid2" style="margin-top:10px">
      <label class="f">옮길 반<select id="mv_class">
        ${S.classes.map(cl => `<option value="${cl.id}">${esc(cl.name)}</option>`).join("")}
      </select></label>
      <label class="f">이동일<input type="date" id="mv_date" value="${esc(todayISO())}"></label>
    </div>
    <div class="note" style="margin-top:12px">${esc(c.name)} — 현재 반 <b>${now ? esc(now.name) : "미지정"}</b></div>
    <h3>지금까지의 반 이력</h3>
    <div id="mv_hist"></div>
  </div>`);

  function drawHist(){
    const host = $("#mv_hist", body);
    const hist = (c.classHistory || []).slice().sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
    if (!hist.length) { host.innerHTML = `<div class="hint">이력이 없습니다.</div>`; return; }
    const t = el(`<table><thead><tr><th style="width:180px">반</th><th style="width:150px">시작일</th>
      <th class="c" style="width:70px"></th></tr></thead><tbody></tbody></table>`);
    const tb = $("tbody", t);
    hist.forEach((h, i) => {
      const tr = el(`<tr><td>${esc((classById(h.classId) || {}).name || "-")}</td>
        <td>${esc(h.startDate || "-")}</td>
        <td class="c">${i === 0 ? '<span class="hint">최초</span>' : '<button class="b danger">취소</button>'}</td></tr>`);
      const btn = $("button", tr);
      if (btn) btn.onclick = () => {
        c.classHistory = c.classHistory.filter(x => x !== h);
        save(); drawHist();
      };
      tb.appendChild(tr);
    });
    host.innerHTML = "";
    host.appendChild(t);
  }
  drawHist();

  openModal("반 이동 — " + c.name, body, () => {
    const classId = $("#mv_class", body).value;
    const date = $("#mv_date", body).value;
    if (!date) { alert("이동일을 입력하세요."); return false; }
    if (c.admitDate && date < c.admitDate) { alert("이동일이 입소일보다 빠릅니다."); return false; }
    if (!c.classHistory) c.classHistory = [];
    c.classHistory = c.classHistory.filter(h => h.startDate !== date);
    c.classHistory.push({ classId, startDate: date });
    c.classHistory.sort((a, b) => (a.startDate || "").localeCompare(b.startDate || ""));
    save(); render();
    return true;
  });
}
