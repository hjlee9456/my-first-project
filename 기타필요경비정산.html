function renderExpense(root){
  const items = enabledItems();
  if (!items.length) { root.innerHTML = `<div class="empty">사용 중인 세목이 없습니다.</div>`; return; }
  if (!S.children.length) { root.innerHTML = `<div class="empty">원아가 없습니다. 기초설정에서 원아를 등록하세요.</div>`; return; }

  const editing = view.expenseEditId ? S.expenses.find(e => e.id === view.expenseEditId) : null;
  const f = view.expenseForm = editing
    ? { date: editing.date, voucherNo: editing.voucherNo || "", itemId: editing.itemId, summary: editing.summary, total: editing.total,
        needAmount: editing.needAmount, memo: editing.memo || "",
        targets: new Set(editing.allocations.map(a => a.childId)),
        overrides: (editing.overrides || []).map(o => Object.assign({}, o)) }
    : Object.assign({ date: todayISO(), voucherNo: "", itemId: items[0].id, summary: "", total: 0, needAmount: 0,
                      memo: "", targets: new Set(), overrides: [] },
                    view.expenseForm && view.expenseForm.keep ? view.expenseForm : {});
  if (!(f.targets instanceof Set)) f.targets = new Set(f.targets || []);
  if (!Array.isArray(f.overrides)) f.overrides = [];
  if (!items.some(i => i.id === f.itemId)) f.itemId = items[0].id;
  delete f.keep;

  root.innerHTML = `
    <h2>지출 등록 ${editing ? '<span class="tag ev">수정 중</span>' : ""}</h2>
    <div class="hint">결의서와 부담 금액을 입력하고 대상 원아를 선택하세요. 배분 결과를 확인한 뒤 등록합니다.</div>

    <h3>1. 결의서 입력</h3>
    <div class="row" style="margin:12px 0">
      <label class="f">지출일<input type="date" id="e_date" value="${esc(f.date)}"></label>
      <label class="f">지출결의서 번호<input id="e_no" value="${esc(f.voucherNo || "")}" placeholder="예: 32" style="width:120px"></label>
      <label class="f">세목<select id="e_item" style="width:190px">
        ${items.map(i => `<option value="${i.id}" ${i.id === f.itemId ? "selected" : ""}>${esc(i.name)}</option>`).join("")}
      </select></label>
      <label class="f grow">적요<input id="e_summary" value="${esc(f.summary)}" placeholder="예: 곰돌이 상하세트 구입"></label>
    </div>
    <div class="row">
      <label class="f">지출결의서 총액 (A)<input class="money" id="e_total" value="${won(f.total)}" style="width:130px"></label>
      <label class="f">필요경비 부담분 (B)<input class="money" id="e_need" value="${won(f.needAmount)}" style="width:130px"></label>
      <button class="b" id="e_allNeed" style="margin-bottom:1px">전액 필요경비</button>
      <label class="f">운영비 부담분 (C = A − B)<input class="money" id="e_oper" readonly style="width:150px"></label>
      <label class="f grow">비고<input id="e_memo" value="${esc(f.memo || "")}"></label>
    </div>
    <div id="e_split"></div>

    <h3>2. 지출 대상 원아</h3>
    <div class="row" style="margin-bottom:6px">
      <select id="e_roster" style="width:250px"></select>
      <button class="b" id="e_loadRoster">명단 불러오기</button>
      <label class="f" style="flex-direction:row;align-items:center;gap:5px;font-size:12.5px;color:var(--dim)">
        <input type="checkbox" id="e_rosterAdd"> 선택한 원아에 추가
      </label>
      <span class="grow"></span>
      <button class="b" id="e_saveRoster">선택 원아를 명단으로 저장</button>
    </div>
    <div id="e_pick"></div>
    <h3>3. 배분 금액 확인</h3>
    <div id="e_preview" style="margin-top:12px"></div>

    <div class="row" style="margin-top:12px">
      <button class="b pri" id="e_save">${editing ? "수정 저장" : "지출 등록"}</button>
      ${editing ? '<button class="b" id="e_cancel">수정 취소</button>' : ""}
      <span class="grow"></span>
      <span class="hint" id="e_guard"></span>
    </div>

    <h3>지출 내역</h3>
    <div id="e_list"></div>`;

  const gEl = {
    date: $("#e_date", root), item: $("#e_item", root), summary: $("#e_summary", root),
    total: $("#e_total", root), need: $("#e_need", root),
    oper: $("#e_oper", root), memo: $("#e_memo", root),
  };

  gEl.date.onchange = e => { f.date = e.target.value; f.keep = true; render(); };
  gEl.item.onchange = e => { f.itemId = e.target.value; f.keep = true; render(); };
  $("#e_no", root).oninput = e => { f.voucherNo = e.target.value; };
  gEl.summary.oninput = e => { f.summary = e.target.value; };
  gEl.memo.oninput = e => { f.memo = e.target.value; };
  gEl.total.onchange = e => { f.total = num(e.target.value); e.target.value = won(f.total); syncSplit(); };
  gEl.need.onchange  = e => { f.needAmount = num(e.target.value); e.target.value = won(f.needAmount); syncSplit(); };
  $("#e_allNeed", root).onclick = () => {
    f.needAmount = Math.max(0, f.total);
    gEl.need.value = won(f.needAmount); syncSplit();
  };

  const it = itemById(f.itemId);
  const splitHost = $("#e_split", root);
  function operAmount(){ return f.total - f.needAmount; }
  function syncSplit(){
    const oper = operAmount();
    gEl.oper.value = won(oper);
    const msgs = [];
    if (it && it.note) msgs.push(`<div class="note">${esc(it.name)} — ${esc(it.note)}</div>`);
    if (oper < 0) {
      msgs.push(`<div class="note bad">필요경비 부담분이 지출결의서 총액을 넘습니다. 금액을 확인하세요.</div>`);
    }
    splitHost.innerHTML = msgs.join("");
    drawPreview();
  }

  /* 배분 미리보기 */
  function targetIds(){ return sortedChildren().filter(c => f.targets.has(c.id)).map(c => c.id); }
  function drawPreview(){
    const prev = $("#e_preview", root);
    const guard = $("#e_guard", root);
    const btn = $("#e_save", root);
    const ids = targetIds();
    const n = ids.length;
    const A = f.needAmount;

    if (n === 0) {
      prev.innerHTML = `<div class="note warn">대상 원아를 지정해야 저장할 수 있습니다.</div>`;
      guard.textContent = "대상 원아를 선택해야 등록할 수 있습니다.";
      btn.disabled = true; return;
    }
    if (operAmount() < 0) {
      prev.innerHTML = `<div class="note bad">금액 구성이 맞지 않아 저장할 수 없습니다.</div>`;
      guard.textContent = "저장 차단 — 금액 구성 오류";
      btn.disabled = true; return;
    }

    const alloc = allocate(A, ids);
    const sum = alloc.reduce((s, a) => s + a.amount, 0);
    const q = Math.floor(A / n), r = A - q * n;
    const ovr = new Set(f.overrides.map(o => o.childId));
    const outside = ids.filter(id => !isEnrolled(childById(id), f.date) && !ovr.has(id));
    const kept = ids.filter(id => ovr.has(id));

    prev.innerHTML = `
      <div class="note ${sum === A ? "ok" : "bad"}">
        대상 <b>${n}명</b> · 1인당 <b>${won(r > 0 ? q + 1 : q)}원</b>${r > 0 ? ` (뒤 ${n - r}명은 ${won(q)}원)` : ""}
        · 배분 합계 <b>${won(sum)}원</b> ${sum === A ? "= 필요경비 부담분 ✓" : "≠ 필요경비 부담분 ✗"}
      </div>
      ${outside.length ? `<div class="note bad">재원기간 밖 원아가 ${outside.length}명 포함되어 있습니다: ${outside.map(id => esc(childName(id))).join(", ")}</div>` : ""}
      ${kept.length ? `<div class="note warn">정산 화면에서 사유를 달아 포함한 재원기간 밖 원아 ${kept.length}명: ${
        kept.map(id => esc(childName(id)) + " — " + esc((f.overrides.find(o => o.childId === id) || {}).reason || "사유 없음")).join(" / ")}</div>` : ""}
      ${shortfallNote()}
      <div class="hint">적요에 남는 형태 — <b>${esc(f.summary || "(적요)")} (${n}명 × ${won(r > 0 ? q + 1 : q)})</b></div>`;

    const bad = sum !== A || outside.length > 0;
    guard.textContent = bad ? "저장 차단 — 위 경고를 해소하세요" : "";
    btn.disabled = bad;

    /* 4분기(12월~2월)에 잔액이 모자라면 알린다. 막지는 않는다 —
       모자란 만큼 운영비에서 부담하면 되는 정상적인 처리다. */
    function shortfallNote(){
      if (!isLastQuarter(f.date)) return "";
      const rows = shortfallRows(f.itemId, alloc, f.date, editing ? editing.id : null);
      if (!rows.length) return "";
      const tot = rows.reduce((s2, x) => s2 + x.short, 0);
      const list = rows.sort((x, y) => y.short - x.short)
        .map(x => `${esc(x.name)} ${won(x.short)}원`).join(" · ");
      /* 한 지출건을 여러 원아가 나눠 부담하므로, 대상 인원을 분모로 함께 적어야
         「몇 명 중 몇 명」인지 헷갈리지 않는다. */
      const all = rows.length === n;
      return `<div class="note warn">
        <b>잔액이 모자랍니다 — 모자란 ${won(tot)}원은 어린이집 운영비에서 나가야 합니다.</b><br>
        이 지출건까지 넣으면 ${all
          ? `대상 원아 <b>${won(n)}명 전원</b>의`
          : `대상 원아 <b>${won(n)}명</b> 가운데 <b>${won(rows.length)}명</b>의`}
        <b>${esc(itemName(f.itemId))}</b> 잔액이 모자라게 됩니다.
        한 지출건을 여러 원아가 나눠 부담하는데, 그동안 낸 돈이 저마다 달라
        <b>적게 낸 아이부터 모자라기 시작합니다.</b><br>
        보호자에게 더 받을 수는 없으므로 모자란 몫은 <b>어린이집 운영비에서 나가야 합니다.</b>
        보호자 정산에서는 <b>잔액 0에서 멈추고 마이너스로 내려가지 않습니다.</b><br>
        <span class="hint">모자란 원아 — ${list}</span><br>
        <span class="hint">그대로 등록해도 됩니다. 금액을 줄이거나 「필요경비 부담분」을 낮추고
        그만큼을 운영비 부담분으로 돌리면 이 알림이 사라집니다.
        12월(4분기)부터만 알리는 이유는, 그 전에는 다음 분기 수납으로 메워지는 것이 보통이기 때문입니다.</span>
      </div>`;
    }
  }

  /* 고정 명단 — 세목으로 거르지 않고 전부 보여 주되 어느 세목 것인지 함께 적는다 */
  const rosterSel = $("#e_roster", root);
  rosterSel.innerHTML = S.rosters.length
    ? S.rosters.map(r => `<option value="${r.id}">${esc(r.name)} (${r.childIds.length}명${r.itemId ? " · " + esc(itemName(r.itemId)) : ""})</option>`).join("")
    : `<option value="">— 저장된 명단 없음 —</option>`;

  const picker = buildPicker($("#e_pick", root), {
    selected: f.targets, date: f.date,
    unlock: new Set(f.overrides.map(o => o.childId)),
    onChange: () => drawPreview(),
  });

  $("#e_loadRoster", root).onclick = () => {
    const r = S.rosters.find(x => x.id === rosterSel.value);
    if (!r) { alert("불러올 명단이 없습니다. 기초설정에서 고정 명단을 먼저 만드세요."); return; }
    if (!$("#e_rosterAdd", root).checked) f.targets.clear();
    let skipped = 0;
    r.childIds.forEach(id => {
      const c = childById(id);
      if (c && isEnrolled(c, f.date)) f.targets.add(id); else skipped++;
    });
    picker.redraw();
    if (skipped) alert(`${skipped}명은 ${f.date} 기준 재원기간 밖이라 빼고 불러왔습니다.`);
  };
  $("#e_saveRoster", root).onclick = () => {
    if (!f.targets.size) { alert("선택된 원아가 없습니다."); return; }
    askText("고정 명단으로 저장", "명단 이름", itemName(f.itemId) + " 참여 원아", name => {
      S.rosters.push({ id: uid("rs"), name, itemId: f.itemId,
                       childIds: sortedChildren().filter(c => f.targets.has(c.id)).map(c => c.id) });
      f.keep = true; save(); render();
    });
  };

  syncSplit();

  $("#e_save", root).onclick = () => {
    const ids = targetIds();
    if (!ids.length) { alert("대상 원아를 지정하세요."); return; }
    if (!f.date) { alert("지출일을 입력하세요."); return; }
    const alloc = allocate(f.needAmount, ids);
    const sum = alloc.reduce((s, a) => s + a.amount, 0);
    if (sum !== f.needAmount) { alert("배분 합계가 필요경비 부담분과 일치하지 않아 저장할 수 없습니다."); return; }

    const idSet = new Set(ids);
    const rec = {
      id: editing ? editing.id : uid("ex"),
      date: f.date, voucherNo: (f.voucherNo || "").trim(), itemId: f.itemId, summary: f.summary.trim(),
      total: f.total, needAmount: f.needAmount,
      operAmount: operAmount(), memo: f.memo || "", allocations: alloc,
      overrides: f.overrides.filter(o => idSet.has(o.childId)),
    };
    if (editing) S.expenses = S.expenses.map(e => e.id === rec.id ? rec : e);
    else S.expenses.push(rec);

    view.expenseEditId = null;
    view.expenseForm = null;
    highlightExpenseId = rec.id;
    save(); render();
  };
  if (editing) $("#e_cancel", root).onclick = () => { view.expenseEditId = null; view.expenseForm = null; render(); };

  renderExpenseList($("#e_list", root));
}

function renderExpenseList(host){
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  /* 세목별로 묶고, 그 안에서 최근 것부터 */
  const rows = groupByItem(S.expenses.filter(e => inRange(e.date, from, to)));
  if (!rows.length) { host.innerHTML = `<div class="empty">이 회계연도의 지출 기록이 없습니다.</div>`; return; }

  const t = el(`<table><thead><tr>
    <th class="c" style="width:95px">지출일</th><th class="c" style="width:65px">번호</th>
    <th>적요</th>
    <th class="n" style="width:105px">총액</th><th class="n" style="width:105px">필요경비</th>
    <th class="n" style="width:95px">운영비</th><th class="c" style="width:60px">인원</th>
    <th class="n" style="width:95px">1인당</th><th class="c" style="width:170px"></th>
  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  let tTotal = 0, tNeed = 0, tOper = 0;
  let headItem = null, gT = 0, gN = 0, gO = 0, gCnt = 0;
  const closeGroup = () => {
    if (!headItem) return;
    tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c">${esc(itemName(headItem))} 소계 (${won(gCnt)}건)</td>
      <td class="n">${won(gT)}</td><td class="n">${won(gN)}</td><td class="n">${won(gO)}</td>
      <td colspan="3"></td></tr>`));
    gT = 0; gN = 0; gO = 0; gCnt = 0;
  };

  for (const ex of rows) {
    if (ex.itemId !== headItem) { closeGroup(); headItem = ex.itemId;
      tb.appendChild(el(`<tr class="sum"><td colspan="9"><b>${esc(itemName(ex.itemId))}</b>
        <span class="tag">${esc((GROUPS[(itemById(ex.itemId) || {}).group] || {}).expense || "")}</span></td></tr>`)); }
    tTotal += ex.total; tNeed += ex.needAmount; tOper += ex.operAmount || 0;
    gT += ex.total; gN += ex.needAmount; gO += ex.operAmount || 0; gCnt++;
    const n = ex.allocations.length;
    const q = n ? Math.floor(ex.needAmount / n) : 0;
    const r = n ? ex.needAmount - q * n : 0;
    const tr = el(`<tr class="${ex.id === highlightExpenseId ? "hl" : ""}">
      <td class="ui-center c">${esc(ex.date)}</td>
      <td class="ui-center c">${esc(ex.voucherNo || "-")}</td>
      <td class="ui-prose">${esc(ex.summary || "-")}</td>
      <td class="n">${won(ex.total)}</td>
      <td class="n">${won(ex.needAmount)}</td>
      <td class="n">${won(ex.operAmount || 0)}</td>
      <td class="c">${won(n)}명</td>
      <td class="n">${won(r > 0 ? q + 1 : q)}</td>
      <td class="c">
        <button class="b" data-a="who">명단</button>
        <button class="b" data-a="edit">수정</button>
        <button class="b danger" data-a="del">삭제</button>
      </td></tr>`);
    $('[data-a="who"]',  tr).onclick = () => openTargetListModal(ex.id);
    $('[data-a="edit"]', tr).onclick = () => { view.expenseEditId = ex.id; view.expenseForm = null; render(); window.scrollTo(0, 0); };
    $('[data-a="del"]',  tr).onclick = () => {
      if (!confirm(`${ex.date} ${itemName(ex.itemId)} "${ex.summary}" 지출건을 삭제할까요?\n배분된 개인별 사용액도 함께 사라집니다.`)) return;
      S.expenses = S.expenses.filter(x => x.id !== ex.id); save(); render();
    };
    tb.appendChild(tr);
  }
  closeGroup();
  tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c"><b>회계연도 합계</b></td>
    <td class="n"><b>${won(tTotal)}</b></td><td class="n"><b>${won(tNeed)}</b></td><td class="n"><b>${won(tOper)}</b></td>
    <td colspan="3"></td></tr>`));
  host.innerHTML = "";
  host.appendChild(t);
  highlightExpenseId = null;
}

/* ---- 지출건별 참여원아 명단 (지출결의서 첨부용) ---- */
function openTargetListModal(expenseId, focusChildId){
  const ex = S.expenses.find(e => e.id === expenseId);
  if (!ex) return;
  const n = ex.allocations.length;
  const rows = ex.allocations.map((a, i) => {
    const c = childById(a.childId);
    const cls = c ? classAt(c, ex.date) : null;
    const on = a.childId === focusChildId;
    return `<tr ${on ? 'class="hl"' : ""}><td class="c">${i + 1}</td>
      <td class="ui-center">${on ? "<b>" : ""}${esc(childName(a.childId))}${on ? "</b>" : ""}</td>
      <td class="ui-center">${cls ? esc(cls.name) : "-"}</td><td class="n">${won(a.amount)}</td></tr>`;
  }).join("");
  const q = n ? Math.floor(ex.needAmount / n) : 0;
  const r = n ? ex.needAmount - q * n : 0;
  const body = el(`<div>
    <div class="hint no-print">이 표를 인쇄해 지출결의서에 첨부하면 배분 근거가 됩니다.</div>
    <table style="margin-top:10px">
      <tr><th style="width:120px">지출일</th><td class="ui-center">${esc(ex.date)}</td>
          <th style="width:120px">지출결의서 번호</th><td class="ui-center">${esc(ex.voucherNo || "-")}</td></tr>
      <tr><th>세목</th><td>${esc(itemName(ex.itemId))}</td>
          <th>대상 인원</th><td>${n}명</td></tr>
      <tr><th>적요</th><td colspan="3" class="ui-prose">${esc(ex.summary || "-")}</td></tr>
      <tr><th>${col("지출결의서 총액", "A")}</th><td class="n">${won(ex.total)}원</td>
          <th>${col("필요경비 부담분", "B")}</th><td class="n">${won(ex.needAmount)}원</td></tr>
      <tr><th>${col("운영비 부담분", "C = A − B")}</th><td class="n">${won(ex.operAmount || 0)}원</td>
          <th>1인당 배분</th><td class="n">${won(r > 0 ? q + 1 : q)}원${r > 0 ? ` (뒤 ${won(n - r)}명은 ${won(q)}원)` : ""}</td></tr>
      ${ex.memo ? `<tr><th>비고</th><td colspan="3" class="ui-prose">${esc(ex.memo)}</td></tr>` : ""}
    </table>
    <table style="margin-top:12px"><thead><tr>
      <th class="c" style="width:60px">순번</th><th>성명</th><th style="width:120px">반</th>
      <th class="n" style="width:120px">귀속액</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="sum"><td colspan="3" class="c">합계</td>
        <td class="n">${won(ex.allocations.reduce((s, a) => s + a.amount, 0))}</td></tr></tfoot>
    </table>
  </div>`);
  openModal("지출건 내용 · 참여원아 명단", body, null, [
    { label: "이 지출건 수정", fn: () => {
        $$(".mask").forEach(m => m.remove());
        view.expenseEditId = ex.id; view.expenseForm = null; goTab("expense"); window.scrollTo(0, 0); } },
    { label: "인쇄", fn: () => window.print() },
    { label: "CSV 저장", fn: () => downloadCSV(
        `참여원아명단_${ex.date}_${itemName(ex.itemId)}.csv`,
        [["순번", "성명", "반", "귀속액"]].concat(ex.allocations.map((a, i) => {
          const c = childById(a.childId);
          return [i + 1, childName(a.childId), (c && classAt(c, ex.date) || {}).name || "", a.amount];
        }))) },
  ]);
}

/* ==========================================================================
   11. 원아별 현황
   ========================================================================== */

function renderChild(root){
  if (!S.children.length) { root.innerHTML = `<div class="empty">원아가 없습니다.</div>`; return; }
  const v = view.child = Object.assign({ classId: "", childId: null }, view.child || {});
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);

  root.innerHTML = `
    <h2>원아별 현황</h2>
    <div class="row" style="margin:10px 0">
      <span id="c_sel" style="display:flex;gap:10px;align-items:flex-end"></span>
      <span class="grow"></span>
      <button class="b no-print" id="c_csv">CSV 저장</button>
      <button class="b no-print" id="c_print">인쇄</button>
    </div>
    <div id="c_info"></div>
    <div id="c_sum"></div>
    <h3>사용 건별 내역</h3>
    <div class="hint no-print">금액을 누르면 그 지출건의 내용과 참여원아 명단이 뜹니다.</div>
    <div id="c_use"></div>`;

  $("#c_print", root).onclick = () => window.print();
  const pick = childSelect($("#c_sel", root), v, {
    classKey: "classId", childKey: "childId",
    classId: "c_class", childId: "c_pick", width: 190,
    suffix: k => k.leaveDate ? " (퇴소)" : "",
  });
  const c = pick.child;
  if (!c) { $("#c_info", root).innerHTML = `<div class="empty">이 반에 원아가 없습니다.</div>`; return; }
  const cps = consignPeriodsOf(c);
  $("#c_info", root).innerHTML = `
    <table style="max-width:760px"><tbody>
      <tr><th style="width:110px">성명</th><td class="ui-center">${esc(c.name)}</td>
          <th style="width:110px">반</th><td>${(currentClass(c) || {}).name || "-"}</td></tr>
      <tr><th>입소일</th><td class="ui-center">${esc(c.admitDate || "-")}</td>
          <th>퇴소일</th><td class="ui-center">${esc(c.leaveDate || "재원 중")}</td></tr>
      <tr><th>위탁보육</th><td colspan="3">${cps.length
        ? cps.map(cp => `<span class="tag consign">위탁</span> ${esc(cp.startMonth || "")} ~ ${esc(cp.endMonth || "계속")}${cp.employer ? " · " + esc(cp.employer) : ""}`).join("<br>")
        : '<span class="tag">일반</span> 전 기간 일반 재원'}</td></tr>
    </tbody></table>`;

  /* 세목별 요약 */
  const items = S.items.filter(i => i.enabled
    || S.receipts.some(r => r.childId === c.id && r.itemId === i.id)
    || S.expenses.some(e => e.itemId === i.id && e.allocations.some(a => a.childId === c.id)));

  const hasConsign = cps.length > 0;
  const t = el(`<table style="margin-top:12px"><thead><tr>
    <th style="width:180px">세목</th><th style="width:180px">구분</th>
    <th class="n" style="width:120px">${col("보호자 수납", "A")}</th>
    ${hasConsign ? `<th class="n" style="width:120px">${col("전입금 충당", "B")}</th>` : ""}
    <th class="n" style="width:120px">${col("사용", hasConsign ? "C" : "B")}</th>
    <th class="n" style="width:150px">${col("남은 금액", hasConsign ? "D = A + B − C" : "C = A − B")}</th>
  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const csv = [["세목", "구분", "보호자 수납"]
    .concat(hasConsign ? ["전입금 충당"] : [], ["사용", "남은 금액"])];
  let tp = 0, tu = 0, tc = 0;

  for (const it of items) {
    const b = balance(c.id, it.id, from, to);
    if (!b.paid && !b.used && !b.consign) continue;
    tp += b.paid; tu += b.totalUsed; tc += b.transferIn;
    const over = b.used > b.paid;
    const g = GROUPS[it.group] || {};
    tb.appendChild(el(`<tr>
      <td>${esc(it.name)}</td>
      <td><span class="tag">${g.income || esc(it.group)}</span></td>
      <td class="n">${won(b.paid)}</td>
      ${hasConsign ? `<td class="n" style="color:#5b3ca8">${b.transferIn ? won(b.transferIn) : ""}</td>` : ""}
      <td class="n">${won(b.totalUsed)}</td>
      <td class="n" style="${over ? "color:var(--bad);font-weight:600" : ""}">${won(b.left)}${over ? " ⚠" : ""}</td>
    </tr>`));
    csv.push([it.name, it.group, b.paid].concat(hasConsign ? [b.transferIn] : [], [b.totalUsed, b.left]));
  }
  if (tb.children.length === 0) {
    $("#c_sum", root).innerHTML = `<div class="empty">이 원아의 수납·사용 기록이 없습니다.</div>`;
  } else {
    tb.appendChild(el(`<tr class="sum"><td colspan="2" class="c">합계</td>
      <td class="n">${won(tp)}</td>
      ${hasConsign ? `<td class="n">${won(tc)}</td>` : ""}
      <td class="n">${won(tu)}</td>
      <td class="n">${won(tp + tc - tu)}</td></tr>`));
    csv.push(["합계", ""].concat([tp], hasConsign ? [tc] : [], [tu, tp + tc - tu]));
    $("#c_sum", root).appendChild(t);
    if (hasConsign) $("#c_sum", root).appendChild(el(
      `<div class="note">위탁보육료를 받는 달의 비용은 <b>보호자가 아니라 전입금으로 충당</b>됩니다.
       그래서 그 달 지출액과 같은 금액을 <b>「전입금 충당」에 수입으로도</b> 잡았습니다 — 들어온 만큼 나간 것이므로
       남은 금액에는 영향을 주지 않습니다. 위탁보육료는 그 달치를 그 달 아무 날에나 받으므로 <b>달 단위로</b> 판단합니다.</div>`));
    const anyOver = items.some(it => { const b = balance(c.id, it.id, from, to); return b.used > b.paid; });
    if (anyOver) $("#c_sum", root).appendChild(el(
      `<div class="note warn">수납액을 넘겨 사용한 세목이 있습니다. 초과분은 어린이집 운영비로 처리하고, 원아 잔액은 0에서 멈춥니다.</div>`));
  }
  $("#c_csv", root).onclick = () => downloadCSV(`원아별현황_${c.name}_${fy}.csv`, csv);

  /* 사용 건별 내역 — 세목별로 묶고, 그 안에서는 이른 날짜부터 (돈이 빠져나간 차례) */
  const useHost = $("#c_use", root);
  const order = new Map(S.items.map((it, i) => [it.id, i]));
  const rows = usageRows(c.id, null, from, to).sort((a, b) =>
    (order.has(a.itemId) ? order.get(a.itemId) : 999) - (order.has(b.itemId) ? order.get(b.itemId) : 999)
    || a.date.localeCompare(b.date)
    || (a.voucherNo || "").localeCompare(b.voucherNo || ""));
  if (!rows.length) { useHost.innerHTML = `<div class="empty">사용 내역이 없습니다.</div>`; return; }

  const ut = el(`<table><thead><tr>
    <th class="c" style="width:95px">지출일</th><th class="c" style="width:70px">결의서</th>
    <th>적요</th>
    <th class="n" style="width:105px">필요경비 부담분</th><th class="c" style="width:60px">인원</th>
    <th class="n" style="width:110px">원아 귀속액</th></tr></thead><tbody></tbody></table>`);
  const utb = $("tbody", ut);
  let headItem = null, gSum = 0, gCnt = 0;
  const closeUse = () => {
    if (!headItem) return;
    utb.appendChild(el(`<tr class="sum"><td colspan="5" class="c">${esc(itemName(headItem))} 소계 (${won(gCnt)}건)</td>
      <td class="n">${won(gSum)}</td></tr>`));
    gSum = 0; gCnt = 0;
  };
  for (const r of rows) {
    if (r.itemId !== headItem) { closeUse(); headItem = r.itemId;
      utb.appendChild(el(`<tr class="sum"><td colspan="6"><b>${esc(itemName(r.itemId))}</b></td></tr>`)); }
    gSum += r.amount; gCnt++;
    const tr2 = el(`<tr>
      <td class="c">${esc(r.date)}</td><td class="c">${esc(r.voucherNo || "-")}</td>
      <td class="ui-prose">${esc(r.summary || "-")}${r.consign ? ' <span class="tag consign">전입금 충당</span>' : ""}</td>
      <td class="n">${won(r.needAmount)}</td><td class="c">${won(r.headcount)}명</td>
      <td class="n"><button class="link">${won(r.amount)}</button></td></tr>`);
    $("button", tr2).onclick = () => openTargetListModal(r.expenseId, c.id);
    utb.appendChild(tr2);
  }
  closeUse();
  const ownSum = rows.filter(r => !r.consign).reduce((s, r) => s + r.amount, 0);
  const cvSum  = rows.filter(r =>  r.consign).reduce((s, r) => s + r.amount, 0);
  utb.appendChild(el(`<tr class="sum"><td colspan="5" class="c"><b>보호자 부담 사용 합계</b></td>
    <td class="n"><b>${won(ownSum)}</b></td></tr>`));
  if (cvSum) utb.appendChild(el(`<tr class="sum"><td colspan="5" class="c">전입금 충당</td>
    <td class="n" style="color:#5b3ca8">${won(cvSum)}</td></tr>`));
  useHost.appendChild(ut);
}

/* ==========================================================================
   11-2. 정산·보고
   ========================================================================== */

const SETTLE_MODES = [
  { id:"half",   label:"정산보고서 (운영위원회용)" },
  { id:"notice", label:"보호자용 개별 안내문" },
  { id:"back",   label:"반환 정산서 (전 원아)" },
  { id:"exit",   label:"중간퇴소·중간전환 정산" },
];

/** 정산 기간 — 시작월과 마지막월을 직접 고른다 */
function periodOf(v){
  const fy = S.fiscalYear;
  const months = fyMonths(fy);
  const lo = v.fromMonth || months[0].key;
  const hi = v.toMonth   || months[months.length - 1].key;
  const y0 = +lo.slice(0, 4), y1 = +hi.slice(0, 4);
  const label = `${+lo.slice(5)}월 ~ ${y1 > y0 ? "익년 " : ""}${+hi.slice(5)}월`;
  return { from: monthRange(lo).from, to: monthRange(hi).to, fromM: lo, toM: hi, label,
           /* 회계연도 첫 달부터가 아니면 그 앞 기간을 '이월'로 따로 보여 준다 */
           carry: lo > months[0].key };
}

function monthPicker(id, value, months){
  return `<select id="${id}" style="width:110px">
    ${months.map(m => `<option value="${m.key}" ${m.key === value ? "selected" : ""}>${esc(m.label)}</option>`).join("")}
  </select>`;
}

/** 자주 쓰는 기간 버튼. 지금 고른 기간과 맞는 버튼만 눌린 것으로 보인다. */
function periodButtons(spec, months){
  const on = (a, b) => spec.fromM === months[a].key && spec.toM === months[b].key ? "pri" : "";
  return `<div class="f" style="gap:4px">
    <span style="font-size:12px;color:var(--dim)">자주 쓰는 기간</span>
    <span style="display:flex;gap:4px">
      <button class="b ${on(0, 5)}"  data-p="H1" style="padding:5px 9px">상반기</button>
      <button class="b ${on(6, 11)}" data-p="H2" style="padding:5px 9px">하반기</button>
      <button class="b ${on(0, 11)}" data-p="Y"  style="padding:5px 9px">연간</button>
    </span></div>`;
}
/** 시작월·마지막월이 뒤집히지 않게, 방금 고른 쪽을 그대로 두고 상대 쪽을 끌어당긴다 */
function setPeriod(v, which, val){
  if (which === "from") { v.fromMonth = val; if (!v.toMonth || v.toMonth < val) v.toMonth = val; }
  else                  { v.toMonth = val;   if (!v.fromMonth || v.fromMonth > val) v.fromMonth = val; }
  render();
}

function wirePeriodButtons(host, v, months){
  $('[data-p="H1"]', host).onclick = () => { v.fromMonth = months[0].key;  v.toMonth = months[5].key;  render(); };
  $('[data-p="H2"]', host).onclick = () => { v.fromMonth = months[6].key;  v.toMonth = months[11].key; render(); };
  $('[data-p="Y"]',  host).onclick = () => { v.fromMonth = months[0].key;  v.toMonth = months[11].key; render(); };
}

/**
 * 반 → 원아 2단 선택. 원아가 많아지면 한 줄짜리 목록에서 이름을 찾기 어려우므로
 * 반으로 먼저 좁힌다. state의 { classId, childId }를 고쳐 쓰고 고른 원아를 돌려준다.
 */
function childSelect(host, store, opts){
  opts = opts || {};
  const ck = opts.classKey, kk = opts.childKey;   /* 화면 상태에 그대로 적어 두는 자리 */
  const asOf = opts.asOf || todayISO();
  const all = sortedChildren().filter(opts.filter || (() => true));
  const pool = all.filter(c => {
    if (!store[ck]) return true;
    const cl = classAt(c, asOf) || currentClass(c);
    return cl && cl.id === store[ck];
  });
  if (!pool.some(c => c.id === store[kk])) store[kk] = pool.length ? pool[0].id : null;

  host.innerHTML = `
    <label class="f">반<select id="${opts.classId}" style="width:120px">
      <option value="">전체</option>
      ${S.classes.map(cl => `<option value="${cl.id}" ${cl.id === store[ck] ? "selected" : ""}>${esc(cl.name)}</option>`).join("")}
    </select></label>
    <label class="f">원아<select id="${opts.childId}" style="width:${opts.width || 170}px">
      ${pool.length
        ? pool.map(c => `<option value="${c.id}" ${c.id === store[kk] ? "selected" : ""}>${esc(c.name)}${opts.suffix ? opts.suffix(c) : ""}</option>`).join("")
        : `<option value="">— 이 반에 원아가 없습니다 —</option>`}
    </select></label>`;
  $("#" + opts.classId, host).onchange = e => { store[ck] = e.target.value; store[kk] = null; render(); };
  $("#" + opts.childId, host).onchange = e => { store[kk] = e.target.value; (opts.onPick || render)(); };
  return { pool, child: childById(store[kk]) };
}

function printHead(title, sub){
  const name = centerName();
  return `<div class="printhead">
    <h1>${esc(title)}</h1>
    <div class="sub">${name ? esc(name) + " · " : ""}${esc(sub)}</div>
  </div>`;
}

function renderSettle(root){
  if (!S.children.length) { root.innerHTML = `<div class="empty">원아가 없습니다. 기초설정에서 원아를 등록하세요.</div>`; return; }
  const v = view.settle = Object.assign({ mode: "half" }, view.settle || {});

  root.innerHTML = `
    <h2 class="no-print">정산·보고</h2>
    <div class="row no-print" style="margin:10px 0">
      ${SETTLE_MODES.map(m => `<button class="b ${m.id === v.mode ? "pri" : ""}" data-m="${m.id}">${esc(m.label)}</button>`).join("")}
    </div>
    <div id="st_body"></div>`;

  for (const m of SETTLE_MODES) {
    $(`[data-m="${m.id}"]`, root).onclick = () => { v.mode = m.id; render(); };
  }
  const host = $("#st_body", root);
  if (v.mode === "exit")   settleExit(host);
  if (v.mode === "half")   settleHalf(host);
  if (v.mode === "notice") settleNotice(host);
  if (v.mode === "back")   settleBack(host);
}

/* ---------------- 반환 정산서 — 2월말에 전 원아를 한 번에 ---------------- */

function settleBack(host){
  const v = view.settle;
  const fy = S.fiscalYear;
  const months = fyMonths(fy);
  const spec = periodOf(v);

  host.innerHTML = `
    <div class="row no-print" style="margin-bottom:10px">
      <label class="f">정산 기간
        <span style="display:flex;align-items:center;gap:6px">
          ${monthPicker("bk_from", spec.fromM, months)} ~ ${monthPicker("bk_to", spec.toM, months)}
        </span></label>
      ${periodButtons(spec, months)}
      <label class="f" style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="bk_zero" ${v.bkZero ? "checked" : ""}> 반환할 금액이 없는 원아도 표시
      </label>
      <span class="grow"></span>
      <button class="b" id="bk_print">인쇄</button>
      <button class="b" id="bk_csv">CSV 저장</button>
    </div>
    <div class="hint no-print">보통 <b>2월말에 한 번</b> 뽑아 반환 처리하는 표입니다.
      세목별로 <b>수납액 − 실 사용금액 = 반환할 금액</b>을 원아마다 계산합니다.
      실제 반환·계좌 처리는 이 표를 보고 어린이집에서 진행하시면 됩니다.<br>
      3월이 아닌 달부터 뽑으면 <b>이월</b> 열이 붙습니다. 이월은 <b>세목마다 따로</b> 계산해
      그 세목 칸에 이미 더해 두었으므로, 반환 합계에 또 더하지 않습니다 (참고용 열입니다).</div>
    <div id="bk_body"></div>`;

  $("#bk_from", host).onchange = e => setPeriod(v, "from", e.target.value);
  $("#bk_to", host).onchange   = e => setPeriod(v, "to", e.target.value);
  $("#bk_zero", host).onchange = e => { v.bkZero = e.target.checked; render(); };
  wirePeriodButtons(host, v, months);
  $("#bk_print", host).onclick = () => window.print();

  const body = $("#bk_body", host);
  /* 3월부터가 아니면 그 앞 기간의 잔액을 이월로 끌어온다.
     세목끼리 섞지 않으므로 이월도 세목별로 따로 계산해 그 세목 칸에 넣는다. */
  const carryFrom = fyStart(fy), carryTo = addDays(spec.from, -1);
  const carryOf = (childId, itemId) =>
    spec.carry ? balance(childId, itemId, carryFrom, carryTo).left : 0;

  const items = S.items.filter(it =>
    S.children.some(c => { const b = balance(c.id, it.id, spec.from, spec.to);
                           return b.paid || b.used || carryOf(c.id, it.id); }));

  body.innerHTML = printHead("필요경비 반환 정산서",
    `${fy}년도 ${spec.label} · ${spec.from} ~ ${spec.to}`);

  if (!items.length) { body.appendChild(el(`<div class="empty">이 기간의 기록이 없습니다.</div>`)); return; }

  const rows = sortedChildren().map(c => {
    const cells = items.map(it => {
      const b = balance(c.id, it.id, spec.from, spec.to);
      const carry = carryOf(c.id, it.id);
      const net = carry + b.left;
      return { it, b, carry, back: Math.max(0, net), over: Math.max(0, -net) };
    });
    return { c, cells,
             carry: cells.reduce((s, x) => s + x.carry, 0),
             back: cells.reduce((s, x) => s + x.back, 0),
             over: cells.reduce((s, x) => s + x.over, 0),
             any:  cells.some(x => x.b.paid || x.b.used || x.carry) };
  }).filter(r => r.any && (v.bkZero || r.back > 0));

  if (!rows.length) { body.appendChild(el(`<div class="empty">반환할 금액이 있는 원아가 없습니다.</div>`)); return; }

  const t = el(`<table class="sheet"><thead><tr>
    <th class="c" style="width:42px">순번</th><th style="width:100px">성명</th><th style="width:88px">반</th>
    <th class="c" style="width:56px">재원</th>
    ${spec.carry ? `<th class="n" style="width:105px">${col("이월", "참고")}</th>` : ""}
    ${items.map((it, i) => `<th class="n" style="width:110px">${col(it.name, MARKS[i] || String(i + 1))}</th>`).join("")}
    <th class="n" style="width:130px">${col("반환 합계",
      items.map((it, i) => MARKS[i] || String(i + 1)).join(" + "))}</th><th style="width:110px">비고</th>
  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const csv = [["순번", "성명", "반", "재원"]
    .concat(spec.carry ? ["이월"] : [], items.map(i => i.name), ["반환 합계", "비고"])];
  const colTot = items.map(() => 0);
  let grand = 0, carryTot = 0;

  rows.forEach((r, i) => {
    const cls = classAt(r.c, spec.to) || currentClass(r.c);
    const cons = isConsignMonth(r.c, spec.toM);
    r.cells.forEach((x, j) => colTot[j] += x.back);
    grand += r.back; carryTot += r.carry;
    const note = [];
    if (r.c.leaveDate && inRange(r.c.leaveDate, spec.from, spec.to)) note.push(r.c.leaveDate.slice(5).replace("-", ".") + " 퇴소");
    if (cons) note.push("위탁");
    if (r.over) note.push(`초과 ${won(r.over)}원`);
    tb.appendChild(el(`<tr>
      <td class="c">${i + 1}</td><td class="ui-center">${esc(r.c.name)}</td><td class="ui-center">${cls ? esc(cls.name) : "-"}</td>
      <td class="c">${cons ? '<span class="tag consign">위탁</span>' : '<span class="tag">일반</span>'}</td>
      ${spec.carry ? `<td class="n" style="color:var(--dim)">${r.carry ? won(r.carry) : ""}</td>` : ""}
      ${r.cells.map(x => `<td class="n">${x.back ? won(x.back) : ""}</td>`).join("")}
      <td class="n"><b>${won(r.back)}</b></td>
      <td style="font-size:11px;color:var(--warn)">${esc(note.join(" / "))}</td></tr>`));
    csv.push([i + 1, r.c.name, cls ? cls.name : "", cons ? "위탁" : "일반"]
      .concat(spec.carry ? [r.carry] : [], r.cells.map(x => x.back), [r.back, note.join(" / ")]));
  });
  tb.appendChild(el(`<tr class="sum"><td colspan="4" class="c">합계 (${won(rows.length)}명)</td>
    ${spec.carry ? `<td class="n">${won(carryTot)}</td>` : ""}
    ${colTot.map(x => `<td class="n">${won(x)}</td>`).join("")}
    <td class="n">${won(grand)}</td><td></td></tr>`));
  csv.push(["합계", "", "", ""].concat(spec.carry ? [carryTot] : [], colTot, [grand, ""]));

  const wrap = el(`<div class="scroll" style="max-height:none"></div>`);
  wrap.appendChild(t);
  body.appendChild(wrap);

  const anyConsign = rows.some(r => isConsignMonth(r.c, spec.toM));
  if (anyConsign) body.appendChild(el(`<div class="note warn">
    <b>위탁 원아는 처리가 다릅니다.</b> 위탁보육에 따른 잔액은 보호자에게 반환하지 않고
    보육교사 인건비 및 운영비로 충당합니다. 위 표의 금액은 <b>보호자가 직접 낸 몫</b>만 계산한 것이니,
    위탁 원아 줄은 어린이집에서 따로 판단하세요.
    <div class="law" style="margin-top:4px">근거 — 본문 8p · 부록 182p 위탁보육계약서(예시) 제5조 ⑥</div></div>`));

  const anyOver = rows.some(r => r.over);
  if (anyOver) body.appendChild(el(`<div class="note">수납액을 넘겨 쓴 세목은
    반환할 금액을 0으로 두고 비고에 초과액만 적었습니다. 초과분은 어린이집 운영비로 처리합니다.</div>`));

  $("#bk_csv", host).onclick = () => downloadCSV(`반환정산서_${fy}_${spec.fromM}_${spec.toM}.csv`, csv);
}

/* ---------------- 중간퇴소 · 중간전환 정산 ---------------- */

function settleExit(host){
  const v = view.settle;
  if (!v.exitInit) {
    const leaving = sortedChildren().find(k => k.leaveDate);
    v.exitClassId = "";
    if (leaving) { v.exitChildId = leaving.id; v.asOf = leaving.leaveDate; }
    v.reason = v.reason || "중간퇴소";
    v.exitInit = true;
  }
  if (!v.asOf) v.asOf = todayISO();


  const fy = S.fiscalYear;
  const from = fyStart(fy);
  /* 중간전환은 전환일 전날까지의 보호자 수납분을 정산한다 */
  const to = v.reason === "중간전환" ? addDays(v.asOf, -1) : v.asOf;

  host.innerHTML = `
    <div class="row no-print" style="margin-bottom:10px">
      <span id="st_sel" style="display:flex;gap:10px;align-items:flex-end"></span>
      <label class="f">사유<select id="st_reason" style="width:140px">
        <option value="중간퇴소" ${v.reason === "중간퇴소" ? "selected" : ""}>중간퇴소</option>
        <option value="중간전환" ${v.reason === "중간전환" ? "selected" : ""}>중간전환(위탁 전환)</option>
      </select></label>
      <label class="f">${v.reason === "중간전환" ? "전환일" : "퇴소일"}<input type="date" id="st_asof" value="${esc(v.asOf)}"></label>
      <span class="grow"></span>
      <button class="b" id="st_print">인쇄</button>
      <button class="b" id="st_csv">CSV 저장</button>
    </div>
    <div class="hint no-print">정산 기간은 <b>${esc(from)} ~ ${esc(to)}</b>입니다.
      ${v.reason === "중간전환" ? "전환일 전날까지의 보호자 수납분만 정산하고, 전환일부터는 전입금으로 충당합니다(본문 8p)." : ""}</div>
    <div id="st_month" class="no-print"></div>
    <div id="st_sheet"></div>`;

  const pick = childSelect($("#st_sel", host), v, {
    classKey: "exitClassId", childKey: "exitChildId",
    classId: "st_class", childId: "st_child", width: 180,
    suffix: k => k.leaveDate ? " · 퇴소 " + k.leaveDate : "",
    onPick: () => { const k = childById(v.exitChildId); if (k && k.leaveDate) v.asOf = k.leaveDate; render(); },
  });
  $("#st_reason", host).onchange = e => { v.reason = e.target.value; render(); };
  $("#st_asof", host).onchange   = e => { v.asOf = e.target.value; render(); };
  $("#st_print", host).onclick   = () => window.print();

  const c = pick.child;
  if (!c) { $("#st_sheet", host).innerHTML = `<div class="empty">이 반에 원아가 없습니다.</div>`; return; }
  const consign = isConsign(c, v.asOf);

  /* 기준일이 속한 달까지는, 사유를 달아 포함시킨 지출건도 사용액으로 잡는다 */
  const forcedTo = monthBounds(v.asOf).to;

  drawMonthQuestions($("#st_month", host), c, v.asOf);
  drawExitSheet($("#st_sheet", host), c, from, to, forcedTo, consign);

  $("#st_csv", host).onclick = () => {
    const rows = [["세목", "수납", "사용", "반환할 금액"]];
    for (const it of S.items) {
      const b = settleBalance(c.id, it.id, from, to, forcedTo);
      if (!b.paid && !b.used) continue;
      rows.push([it.name, b.paid, b.used, Math.max(0, b.left)]);
    }
    downloadCSV(`${v.reason}정산서_${c.name}_${v.asOf}.csv`, rows);
  };
}

/** 기준일이 속한 달의 지출건을 하나씩 보여주고 포함 여부를 묻는다 (자동 판정하지 않음) */
function drawMonthQuestions(host, child, asOf){
  const mb = monthBounds(asOf);
  const rows = S.expenses.filter(e => inRange(e.date, mb.from, mb.to)).sort((a, b) => a.date.localeCompare(b.date));
  if (!rows.length) { host.innerHTML = ""; return; }

  host.innerHTML = `<h3>${asOf.slice(0, 7)} 지출건 — 이 원아에게 포함할까요?</h3>
    <div class="hint">월 단위로 나가는 유류비·특별활동비 업체 지급 등은 자동으로 판정하지 않습니다.
      포함 여부를 직접 고르면 그 결과와 사유가 정산서에 근거로 남습니다.</div>
    <div id="mq"></div>`;

  const t = el(`<table style="margin-top:8px"><thead><tr>
    <th class="c" style="width:100px">지출일</th><th style="width:140px">세목</th><th>적요</th>
    <th class="n" style="width:110px">필요경비</th><th class="c" style="width:70px">현재</th>
    <th class="n" style="width:100px">1인당</th><th class="c" style="width:80px">포함</th>
    <th style="width:180px">사유</th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);

  for (const ex of rows) {
    const included = ex.allocations.some(a => a.childId === child.id);
    const n = ex.allocations.length + (included ? 0 : 1);
    const per = n ? Math.floor(ex.needAmount / n) : 0;
    const ovr = (ex.overrides || []).find(o => o.childId === child.id);
    const afterExit = ex.date > asOf;

    const tr = el(`<tr>
      <td class="ui-center c">${esc(ex.date)}${afterExit ? ' <span class="tag ev">기준일 이후</span>' : ""}</td>
      <td>${esc(itemName(ex.itemId))}</td>
      <td class="ui-prose">${esc(ex.summary || "-")}</td>
      <td class="n">${won(ex.needAmount)}</td>
      <td class="c">${ex.allocations.length}명</td>
      <td class="n">${won(per)}</td>
      <td class="c"><input type="checkbox" ${included ? "checked" : ""}></td>
      <td><input value="${esc(ovr ? ovr.reason : "")}" placeholder="${afterExit ? "포함 사유" : "—"}" style="width:100%"></td>
    </tr>`);

    const cb = $('input[type="checkbox"]', tr);
    const reasonEl = $('td:last-child input', tr);

    cb.onchange = () => {
      const ids = ex.allocations.map(a => a.childId);
      if (cb.checked) {
        if (!ids.includes(child.id)) ids.push(child.id);
      } else {
        const i = ids.indexOf(child.id);
        if (i >= 0) ids.splice(i, 1);
      }
      setExpenseTargets(ex, ids);
      /* 재원기간 밖인데 포함시켰다면 사유를 근거로 남긴다 */
      ex.overrides = (ex.overrides || []).filter(o => o.childId !== child.id);
      if (cb.checked && !isEnrolled(child, ex.date)) {
        ex.overrides.push({ childId: child.id, reason: reasonEl.value.trim() || "중간정산 시 포함 결정" });
      }
      save(); render();
    };
    reasonEl.onchange = () => {
      const o = (ex.overrides || []).find(x => x.childId === child.id);
      if (o) { o.reason = reasonEl.value.trim(); save(); }
    };
    tb.appendChild(tr);
  }
  $("#mq", host).appendChild(t);
}

function drawExitSheet(host, c, from, to, forcedTo, consign){
  const v = view.settle;
  const rows = [];
  for (const it of S.items) {
    const b = settleBalance(c.id, it.id, from, to, forcedTo);
    if (!b.paid && !b.used && !b.consign) continue;
    rows.push({ it, b, pc: parentCharge(c.id, it.id, from, to),
                usage: settleAllocRows(c.id, it.id, from, to, forcedTo) });
  }

  host.innerHTML = printHead(v.reason + " 정산서", `${c.name} · 정산기간 ${from} ~ ${to}`) +
    `<div class="sheet">
      <table style="max-width:820px"><tbody>
        <tr><th style="width:110px">성명</th><td class="ui-center">${esc(c.name)}</td>
            <th style="width:110px">반</th><td class="ui-center">${(classAt(c, to) || currentClass(c) || {}).name || "-"}</td></tr>
        <tr><th>입소일</th><td class="ui-center">${esc(c.admitDate || "-")}</td>
            <th>${v.reason === "중간전환" ? "전환일" : "퇴소일"}</th><td class="ui-center">${esc(v.asOf)}</td></tr>
      </tbody></table>
      <div id="ex_body"></div>
    </div>`;

  const body = $("#ex_body", host);
  if (!rows.length) { body.innerHTML = `<div class="empty">정산할 수납·사용 기록이 없습니다.</div>`; return; }

  const anyConsign = rows.some(r => r.b.consign);
  const anyFee = rows.some(r => r.pc.fee > 0);
  let tPaid = 0, tUsed = 0, tCons = 0, tBack = 0, tFee = 0, tOver = 0;
  const overList = [];          /* 어느 세목에서 얼마를 어린이집이 부담했나 */

  /* ── 정산 내역 ── 받은 돈, 쓴 돈, 돌려줄 돈. 보호자가 가장 먼저 봐야 할 표 */
  const t = el(`<h3>정산 내역</h3>
    <table><thead><tr>
      <th style="width:190px">세목</th>
      ${noticeCols(false, anyConsign, anyFee).map((c2, i, arr) =>
        `<th class="n" style="width:${i === arr.length - 1 ? 160 : 125}px">${col(
          i === arr.length - 1 ? "반환할 금액" : c2[0], c2[1])}</th>`).join("")}
    </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);

  for (const r of rows) {
    const prep = r.it.special === "prep";
    const auto = Math.max(0, r.b.left);
    tPaid += r.b.paid; tUsed += r.b.totalUsed; tCons += r.b.transferIn; tFee += r.pc.fee;
    const over2 = Math.max(0, -r.b.left);
    if (over2) overList.push({ name: r.it.name, over: over2 });
    tOver += over2;

    const tr = el(`<tr>
      <td>${esc(r.it.name)}</td>
      <td class="n">${won(r.pc.charged)}</td>
      ${anyFee ? `<td class="n" style="color:var(--dim)">${r.pc.fee ? won(r.pc.fee) : ""}</td>` : ""}
      ${anyConsign ? `<td class="n">${r.b.transferIn ? won(r.b.transferIn) : ""}</td>` : ""}
      <td class="n">${won(r.b.totalUsed)}</td>
      <td class="n" data-r="back"></td>
    </tr>`);

    const backCell = $('[data-r="back"]', tr);
    if (prep) {
      /* 입학준비금은 물품 지급 여부·상태를 종합 고려해 보호자와 협의한다 (본문 97p) */
      const key = "prep_" + c.id;
      const st = v[key] = Object.assign({ given: false, amount: auto }, v[key] || {});
      backCell.innerHTML = `<input class="money no-print" style="width:110px" value="${won(st.amount)}">`
        + `<span class="print-only">${won(st.amount)}</span>`;
      $("input", backCell).onchange = e => { st.amount = num(e.target.value); e.target.value = won(st.amount); render(); };
      tBack += st.amount;
    } else {
      backCell.textContent = won(auto);
      tBack += auto;
    }
    tb.appendChild(tr);
  }

  tb.appendChild(el(`<tr class="sum">
    <td class="c">합계</td><td class="n">${won(tPaid + tFee)}</td>
    ${anyFee ? `<td class="n">${won(tFee)}</td>` : ""}
    ${anyConsign ? `<td class="n">${won(tCons)}</td>` : ""}
    <td class="n">${won(tUsed)}</td>
    <td class="n">${won(tBack)}</td></tr>`));
  body.appendChild(t);
  if (anyFee) body.appendChild(el(`<div class="note show-print">카드로 내신 금액은 <b>수수료를 떼고</b>
    어린이집 통장에 들어옵니다. 위 표는 <b>보호자께서 결제하신 금액</b>을 적고,
    떼인 수수료를 따로 보여 드립니다.</div>`));
  if (tOver) body.appendChild(el(`<div class="note show-print"><b>받은 돈보다 더 쓴 세목이 있습니다 —
    어린이집 운영비에서 ${won(tOver)}원을 부담했습니다.</b><br>
    <span class="hint">${overList.map(r => esc(r.name) + " " + won(r.over) + "원").join(" · ")}</span><br>
    위 세목은 보호자께서 내신 금액보다 실제로 쓴 금액이 많습니다.
    모자란 몫은 <b>어린이집 운영비에서 부담</b>했으므로 보호자께 더 청구하지 않으며,
    그 세목의 반환할 금액은 <b>0</b>으로 적습니다.
    그래서 표의 「반환할 금액」이 「수납액 − 실 사용금액」과 맞지 않아 보일 수 있습니다.</div>`));
  if (anyConsign) body.appendChild(el(`<div class="note show-print">위탁보육료를 받는 달의 비용은
    <b>전입금으로 충당</b>되므로 같은 금액을 수입으로도 잡았습니다. 들어온 만큼 나간 것이라
    반환할 금액에는 영향이 없습니다.</div>`));

  /* 입학준비금 입력 도움말 — 화면에서만 */
  const prepRow = rows.find(r => r.it.special === "prep");
  if (prepRow) {
    const key = "prep_" + c.id;
    const st = v[key];
    const help = el(`<div class="note no-print">
      <b>${esc(prepRow.it.name)}</b>은 자동으로 계산하지 않습니다.
      물품을 이미 지급했는지와 그 상태를 함께 고려해 <b>보호자와 협의한 금액</b>을 위 칸에 직접 적으세요.
      입학 전에 취소했다면 전액 반환입니다.
      <label style="display:block;margin-top:6px"><input type="checkbox" ${st.given ? "checked" : ""}> 물품을 이미 지급함</label>
      <div class="law">근거 — 본문 97p</div></div>`);
    $("input", help).onchange = e => { st.given = e.target.checked; save(); };
    body.appendChild(help);
  }

  /* ── 산출 근거 ── 어느 지출건에서 얼마가 나왔는지 */
  const detail = rows.filter(r => r.usage.length);
  if (detail.length) {
    const t2 = el(`<h3>산출 근거 — 지출 내역</h3>
      <table><thead><tr>
        <th style="width:150px">세목</th><th class="c" style="width:100px">지출일</th>
        <th>지출 내용</th><th class="n" style="width:120px">지출건 금액</th>
        <th class="c" style="width:60px">인원</th><th class="n" style="width:120px">원아 부담</th>
      </tr></thead><tbody></tbody></table>`);
    const tb2 = $("tbody", t2);
    for (const r of detail) {
      r.usage.forEach((u, i) => {
        tb2.appendChild(el(`<tr>
          ${i === 0 ? `<td rowspan="${r.usage.length + 1}" style="vertical-align:middle">${esc(r.it.name)}</td>` : ""}
          <td class="c">${esc(u.date)}</td>
          <td class="ui-prose">${esc(u.summary || "-")}${u.consign ? " (위탁보육료 충당)" : ""}</td>
          <td class="n">${won(u.needAmount)}</td>
          <td class="c">${u.headcount}명</td>
          <td class="n">${won(u.amount)}</td></tr>`));
      });
      tb2.appendChild(el(`<tr class="sum"><td colspan="4" class="c">${esc(r.it.name)} 사용 합계</td>
        <td class="n">${won(r.usage.reduce((s, u) => s + u.amount, 0))}</td></tr>`));
    }
    body.appendChild(t2);
  }

  if (consign) {
    body.appendChild(el(`<div class="note warn no-print">
      <b>위탁 원아입니다.</b> 위탁보육에 따른 잔액은 보호자에게 반환하지 않고
      보육교사 인건비 및 운영비로 충당합니다(전출금 충당은 금지). 이용을 중단한 경우에도 같습니다.
      위 표의 금액은 보호자가 직접 낸 몫만 계산한 것이니 어린이집에서 따로 판단하세요.
      <div class="law">근거 — 본문 8p · 부록 182p 위탁보육계약서(예시) 제5조 ⑥</div></div>`));
  }
}

/* ---------------- 정산보고서 (운영위원회용) — 세목별 통계 ---------------- */

/** 한 세목의 기간 통계 */
function itemStats(it, spec, carryFrom, carryTo){
  let carry = 0, paid = 0, used = 0, consign = 0, payers = 0;
  for (const c of S.children) {
    const b = balance(c.id, it.id, spec.from, spec.to);
    const cy = spec.carry ? balance(c.id, it.id, carryFrom, carryTo).left : 0;
    paid += b.paid; used += b.used; consign += b.consign; carry += cy;
    if (b.paid) payers++;
  }
  const exps = S.expenses.filter(e => e.itemId === it.id && inRange(e.date, spec.from, spec.to));
  return { carry, paid, used, consign, payers, left: carry + paid - used,
           count: exps.length,
           oper: exps.reduce((s, e) => s + (e.operAmount || 0), 0),
           fee:  S.vouchers.filter(x => x.itemId === it.id && inRange(x.date, spec.from, spec.to))
                        .reduce((s, x) => s + (x.cardFee || 0), 0) };
}

function settleHalf(host){
  const v = view.settle;
  const fy = S.fiscalYear;
  const months = fyMonths(fy);
  const spec = periodOf(v);

  host.innerHTML = `
    <div class="row no-print" style="margin-bottom:10px">
      <label class="f">정산 기간
        <span style="display:flex;align-items:center;gap:6px">
          ${monthPicker("hp_from", spec.fromM, months)} ~ ${monthPicker("hp_to", spec.toM, months)}
        </span></label>
      ${periodButtons(spec, months)}
      <label class="f" style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="hp_detail" ${v.hpDetail !== false ? "checked" : ""}> 지출 내역 함께 넣기
      </label>
      <span class="grow"></span>
      <button class="b" id="hp_print">인쇄</button>
      <button class="b" id="hp_csv">CSV 저장</button>
    </div>
    <div class="hint no-print">운영위원회 보고용입니다. <b>세목별 통계</b>로 나옵니다.
      원아 한 사람씩의 내역은 <b>보호자용 개별 안내문</b>에서 뽑으세요.</div>
    <div id="hp_body"></div>`;

  $("#hp_from", host).onchange   = e => setPeriod(v, "from", e.target.value);
  $("#hp_to", host).onchange     = e => setPeriod(v, "to", e.target.value);
  $("#hp_detail", host).onchange = e => { v.hpDetail = e.target.checked; render(); };
  wirePeriodButtons(host, v, months);
  $("#hp_print", host).onclick = () => window.print();

  const body = $("#hp_body", host);
  const carryFrom = fyStart(fy), carryTo = addDays(spec.from, -1);
  const stats = S.items.map(it => ({ it, s: itemStats(it, spec, carryFrom, carryTo) }))
                       .filter(x => x.s.paid || x.s.used || x.s.consign || x.s.carry);

  const enrolled = S.children.filter(c => isEnrolled(c, spec.to)).length;
  body.innerHTML = printHead("필요경비 정산보고서",
    `${fy}년도 ${spec.label} · ${spec.from} ~ ${spec.to} · 재원 ${enrolled}명`);

  if (!stats.length) { body.appendChild(el(`<div class="empty">이 기간의 기록이 없습니다.</div>`)); return; }

  const anyConsign = stats.some(x => x.s.consign);
  const cols = []
    /* 어느 칸을 더하고 빼서 「남은 금액」이 나오는지 기호로 적어 둔다 */
    .concat(moneyCols(spec.carry, anyConsign, "보호자 수납액"));

  const t = el(`<table class="sheet"><thead><tr>
    <th style="width:170px">세목</th><th style="width:170px">계정과목</th>
    <th class="c" style="width:70px">수납 인원</th><th class="c" style="width:70px">지출 건수</th>
    ${cols.map(c2 => `<th class="n" style="width:130px">${col(c2[0], c2[1])}</th>`).join("")}
  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const csv = [["세목", "계정과목", "수납 인원", "지출 건수"].concat(cols.map(c2 => c2[0]))];
  const tot = { carry: 0, paid: 0, used: 0, consign: 0, left: 0, count: 0 };

  for (const x of stats) {
    const s = x.s;
    ["carry", "paid", "used", "consign", "left", "count"].forEach(k => tot[k] += s[k]);
    const g = GROUPS[x.it.group] || {};
    const cells = []
      .concat(spec.carry ? [s.carry] : [])
      .concat([s.paid])
      .concat(anyConsign ? [s.consign] : [])
      .concat([s.used + s.consign, s.left]);
    tb.appendChild(el(`<tr>
      <td>${esc(x.it.name)}</td><td><span class="tag">${esc(g.income || x.it.group)}</span></td>
      <td class="c">${won(s.payers)}명</td><td class="c">${won(s.count)}건</td>
      ${cells.map((n, j) => `<td class="n" ${j === cells.length - 1 && n < 0 ? 'style="color:var(--bad)"' : ""}>${won(n)}</td>`).join("")}
    </tr>`));
    csv.push([x.it.name, g.income || x.it.group, s.payers, s.count].concat(cells));
  }
  const sumCells = []
    .concat(spec.carry ? [tot.carry] : [])
    .concat([tot.paid])
    .concat(anyConsign ? [tot.consign] : [])
    .concat([tot.used + tot.consign, tot.left]);
  tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c">합계</td>
    <td class="c">${won(tot.count)}건</td>
    ${sumCells.map(n => `<td class="n">${won(n)}</td>`).join("")}</tr>`));
  csv.push(["합계", "", "", tot.count].concat(sumCells));
  body.appendChild(t);

  body.appendChild(el(`<table class="sheet" style="max-width:460px;margin-top:10px"><tbody>
    <tr class="sum"><th style="width:240px">미집행액 합계 (보호자에게 남은 금액)</th>
      <td class="n">${won(tot.left)}원</td></tr>
  </tbody></table>`));

  if (anyConsign) body.appendChild(el(`<div class="note">위탁 원아의 비용은 보호자가 아니라
    <b>전입금으로 충당</b>됩니다. 그 달 지출액과 같은 금액을 <b>「전입금 충당」에 수입으로도</b> 잡아
    수입과 지출이 맞아떨어지게 했습니다. 위탁보육료는 그 달치를 그 달 아무 날에나 받으므로
    <b>달 단위로</b> 판단합니다.</div>`));

  const burden = centerBurden(spec.from, spec.to);
  if (burden.total) {
    body.appendChild(el(`<h3>어린이집 부담</h3>
      <table class="sheet" style="max-width:520px"><tbody>
        <tr><th style="width:300px">${col("운영비 부담분", "A")}</th><td class="n">${won(burden.oper)}원</td></tr>
        ${burden.fee ? `<tr><th>${col("카드수수료" + (burden.feeCounted ? "" : " (수납액에서 이미 뺀 몫)"),
          burden.feeCounted ? "B" : "참고")}</th>
          <td class="n">${won(burden.fee)}원</td></tr>` : ""}
        <tr class="sum"><th>${col("합계", burden.fee && burden.feeCounted ? "A + B" : "")}</th>
          <td class="n">${won(burden.total)}원</td></tr>
      </tbody></table>`));
  }

  /* 지출 내역 — 운영위원회가 "무엇에 썼나"를 보는 자리.
     세목별로 먼저 묶고, 그 안에서 날짜순으로 적는다. 세목마다 소계를 달아
     위 통계표의 「실 사용금액」과 바로 맞춰 볼 수 있게 한다. */
  if (v.hpDetail !== false) {
    const exps = S.expenses.filter(e => inRange(e.date, spec.from, spec.to));
    if (exps.length) {
      const t2 = el(`<table class="sheet" style="margin-top:8px"><thead><tr>
        <th class="c" style="width:95px">지출일</th><th class="c" style="width:60px">결의서</th>
        <th>적요</th>
        <th class="n" style="width:95px">총액</th>
        <th class="n" style="width:95px">필요경비</th>
        <th class="n" style="width:85px">운영비</th>
        <th class="c" style="width:50px">인원</th><th class="n" style="width:85px">1인당</th>
      </tr></thead><tbody></tbody></table>`);
      const tb2 = $("tbody", t2);
      let sT = 0, sN = 0, sO = 0;

      /* 기초설정의 세목 순서를 그대로 따른다 */
      for (const it of S.items) {
        const group = exps.filter(e => e.itemId === it.id)
                          .sort((a, b) => (a.date + (a.voucherNo || "")).localeCompare(b.date + (b.voucherNo || "")));
        if (!group.length) continue;
        let gT = 0, gN = 0, gO = 0;
        tb2.appendChild(el(`<tr class="sum"><td colspan="8"><b>${esc(it.name)}</b>
          <span class="tag">${esc((GROUPS[it.group] || {}).expense || it.group)}</span></td></tr>`));
        for (const ex of group) {
          gT += ex.total; gN += ex.needAmount; gO += ex.operAmount || 0;
          const n = ex.allocations.length;
          const q = n ? Math.floor(ex.needAmount / n) : 0;
          const r = n ? ex.needAmount - q * n : 0;
          tb2.appendChild(el(`<tr>
            <td class="ui-center c">${esc(ex.date)}</td><td class="ui-center c">${esc(ex.voucherNo || "-")}</td>
            <td class="ui-prose">${esc(ex.summary || "-")}</td>
            <td class="n">${won(ex.total)}</td><td class="n">${won(ex.needAmount)}</td>
            <td class="n">${won(ex.operAmount || 0)}</td>
            <td class="c">${won(n)}명</td><td class="n">${won(r > 0 ? q + 1 : q)}</td></tr>`));
        }
        tb2.appendChild(el(`<tr class="sum"><td colspan="3" class="c">${esc(it.name)} 소계 (${won(group.length)}건)</td>
          <td class="n">${won(gT)}</td><td class="n">${won(gN)}</td><td class="n">${won(gO)}</td>
          <td colspan="2"></td></tr>`));
        sT += gT; sN += gN; sO += gO;
      }
      tb2.appendChild(el(`<tr class="sum"><td colspan="3" class="c"><b>합계 (${won(exps.length)}건)</b></td>
        <td class="n"><b>${won(sT)}</b></td><td class="n"><b>${won(sN)}</b></td><td class="n"><b>${won(sO)}</b></td>
        <td colspan="2"></td></tr>`));
      body.appendChild(el(`<h3>지출 내역 <span class="hint">— 세목별로 묶고 그 안에서 날짜순</span></h3>`));
      body.appendChild(t2);
    }
  }

  $("#hp_csv", host).onclick = () => downloadCSV(`정산보고서_${fy}_${spec.fromM}_${spec.toM}.csv`, csv);
}

  });

  $("#nt_all", host).onchange    = e => { v.noticeAll = e.target.checked; render(); };

function noticeSheet(c, spec, fy, withDetail){
  const carryFrom = fyStart(fy), carryTo = addDays(spec.from, -1);
  const rows = [];
  let carryT = 0, paidT = 0, usedT = 0, consignT = 0, leftClamped = 0, overT = 0, feeT = 0;
  const overRows = [];          /* 어느 세목에서 얼마를 어린이집이 부담했나 */
  for (const it of S.items) {
    const b = balance(c.id, it.id, spec.from, spec.to);
    const carry = spec.carry ? balance(c.id, it.id, carryFrom, carryTo).left : 0;
    if (!b.paid && !b.used && !b.consign && !carry) continue;
    const pc = parentCharge(c.id, it.id, spec.from, spec.to);
    rows.push({ it, b, carry, pc });
    leftClamped += Math.max(0, carry + b.paid - b.used);
    const over1 = Math.max(0, -(carry + b.paid - b.used));
    if (over1) overRows.push({ name: it.name, over: over1 });
    overT += over1;
    carryT += carry; paidT += b.paid; usedT += b.used; consignT += b.consign; feeT += pc.fee;
  }
  if (!rows.length) return null;

  const anyConsign = consignT > 0;
  const anyFee = feeT > 0;          /* 순액 방식에서 카드로 받은 것이 있을 때만 */
  const node = el(`<div class="sheet" style="margin-top:18px"></div>`);

  /* 세목별 지출건 내역 — 어느 지출이 이 아이에게 얼마로 잡혔는지 날짜순으로 */
  let detail = "";
  if (withDetail) {
    const blocks = rows.map(r => {
      const use = usageRows(c.id, r.it.id, spec.from, spec.to);
      if (!use.length) return "";
      const sub = use.filter(u => !u.consign).reduce((s, u) => s + u.amount, 0);
      const cv  = use.filter(u =>  u.consign).reduce((s, u) => s + u.amount, 0);
      return `<tr class="sum"><td colspan="5">${esc(r.it.name)}</td></tr>` +
        use.map(u => `<tr>
          <td class="c">${esc(u.date)}</td>
          <td class="ui-prose">${esc(u.summary || "-")}${u.consign ? " (전입금 충당)" : ""}</td>
          <td class="n">${won(u.needAmount)}</td>
          <td class="c">${won(u.headcount)}명</td>
          <td class="n">${won(u.amount)}</td></tr>`).join("") +
        `<tr class="sum"><td colspan="4" class="c">${esc(r.it.name)} 보호자 부담 합계</td>
             <td class="n">${won(sub)}</td></tr>` +
        (cv ? `<tr class="sum"><td colspan="4" class="c">${esc(r.it.name)} 전입금 충당</td>
                   <td class="n">${won(cv)}</td></tr>` : "");
    }).join("");
    if (blocks) detail = `
      <h3 style="margin-top:16px">산출 근거 — 지출 내역</h3>
      <table style="margin-top:6px"><thead><tr>
        <th class="c" style="width:100px">지출일</th>
        <th>지출 내용</th><th class="n" style="width:115px">지출건 금액</th>
        <th class="c" style="width:60px">인원</th><th class="n" style="width:115px">${esc(c.name)} 부담</th>
      </tr></thead><tbody>${blocks}</tbody></table>`;
  }

  node.innerHTML = printHead("필요경비 정산 안내문", `${fy}년도 ${spec.label} · ${spec.from} ~ ${spec.to}`) + `
    <div class="hint no-print" style="margin-bottom:6px">— 보호자용 개별 안내문 (${esc(c.name)}) —</div>
    <table style="max-width:820px"><tbody>
      <tr><th style="width:110px">원아 성명</th><td class="ui-center">${esc(c.name)}</td>
          <th style="width:110px">반</th><td class="ui-center">${(classAt(c, spec.to) || currentClass(c) || {}).name || "-"}</td></tr>
    </tbody></table>
    <table style="margin-top:10px"><thead><tr>
      <th style="width:170px">세목</th>
      ${noticeCols(spec.carry, anyConsign, anyFee).map((c2, i, arr) =>
        `<th class="n" style="width:${i === arr.length - 1 ? 145 : 108}px">${col(c2[0], c2[1])}</th>`).join("")}
    </tr></thead><tbody>
      ${rows.map(r => {
        /* 쓴 돈이 받은 돈을 넘겨도 보호자에게 더 받지 않는다. 잔액은 0에서 멈추고
           넘긴 몫은 어린이집 운영비 부담이므로, 보호자 서류에 마이너스를 적지 않는다. */
        const raw  = r.carry + r.b.paid - r.b.used;
        const left = Math.max(0, raw);
        const over = Math.max(0, -raw);
        return `<tr><td>${esc(r.it.name)}</td>
          ${spec.carry ? `<td class="n">${won(r.carry)}</td>` : ""}
          <td class="n">${won(r.pc.charged)}</td>
          ${anyFee ? `<td class="n" style="color:var(--dim)">${r.pc.fee ? won(r.pc.fee) : ""}</td>` : ""}
          ${anyConsign ? `<td class="n" style="color:#5b3ca8">${r.b.consign ? won(r.b.consign) : ""}</td>` : ""}
          <td class="n">${won(r.b.used + r.b.consign)}</td>
          <td class="n">${won(left)}${over ? `<span class="hint" style="display:block">어린이집 부담 ${won(over)}원</span>` : ""}</td></tr>`;
      }).join("")}
      <tr class="sum"><td class="c">합계</td>
        ${spec.carry ? `<td class="n">${won(carryT)}</td>` : ""}
        <td class="n">${won(paidT + feeT)}</td>
        ${anyFee ? `<td class="n">${won(feeT)}</td>` : ""}
        ${anyConsign ? `<td class="n">${won(consignT)}</td>` : ""}
        <td class="n">${won(usedT + consignT)}</td>
        <td class="n">${won(leftClamped)}</td></tr>
    </tbody></table>
    ${anyFee ? `<div class="note show-print">카드로 내신 금액은 <b>수수료를 떼고</b> 어린이집 통장에 들어옵니다.
      그래서 <b>결제하신 금액</b>과 실제로 필요경비에 쓸 수 있었던 금액이 수수료만큼 다릅니다.
      위 표는 <b>보호자께서 결제하신 금액</b>을 적고, 떼인 수수료를 따로 보여 드립니다.</div>` : ""}
    ${overT ? `<div class="note show-print"><b>받은 돈보다 더 쓴 세목이 있습니다 —
      어린이집 운영비에서 ${won(overT)}원을 부담했습니다.</b><br>
      <span class="hint">${overRows.map(r => esc(r.name) + " " + won(r.over) + "원").join(" · ")}</span><br>
      위 세목은 보호자께서 내신 금액보다 실제로 쓴 금액이 많습니다.
      모자란 몫은 <b>어린이집 운영비에서 부담</b>했으므로 보호자께 더 청구하지 않으며,
      그 세목의 남은 금액은 <b>0</b>으로 적습니다.
      그래서 표의 「남은 금액」이 「수납액 − 실 사용금액」과 맞지 않아 보일 수 있습니다.</div>` : ""}
    ${anyConsign ? `<div class="note show-print">위탁보육료를 받는 달의 비용은 보호자가 아니라 <b>회사 전입금으로 충당</b>되어, 같은 금액이 수입과 사용에 함께 잡힙니다. 보호자가 내실 몫에는 영향이 없습니다.</div>` : ""}
    ${detail}`;
  return node;
}

function monthRange(key){
  return { from: key + "-01",
           to: key + "-" + String(new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate()).padStart(2, "0") };
}

/** 대장 비고 — 퇴소·입소를 실제 서식처럼 한 칸에 적는다 */
function ledgerNote(c, items, from, to){
  const parts = [];
  /* 회계연도 첫 달에 들어온 원아는 당연하므로 적지 않는다. 중간입소만 표시. */
  if (c.admitDate && monthKey(c.admitDate) > monthKey(from)) parts.push(c.admitDate.slice(5).replace("-", ".") + " 입소");
  if (c.leaveDate && inRange(c.leaveDate, from, to)) parts.push(c.leaveDate.slice(5).replace("-", ".") + " 퇴소");
  for (const cp of consignPeriodsOf(c)) {
    if (cp.startMonth) parts.push(cp.startMonth.slice(5) + "월부터 위탁");
  }
  return parts.join(" / ");
}

function renderLedger(root){
  if (!S.children.length) { root.innerHTML = `<div class="empty">원아가 없습니다.</div>`; return; }
  const v = view.ledger = Object.assign({ kind: "receipt", itemId: "" }, view.ledger || {});
  const fy = S.fiscalYear;
  const months = fyMonths(fy);
  const from = fyStart(fy), to = fyEnd(fy);

  root.innerHTML = `
    <h2 class="no-print">개인별 대장</h2>
    <div class="row no-print" style="margin:10px 0">
      <label class="f">구분<select id="lg_kind" style="width:180px">
        <option value="receipt" ${v.kind === "receipt" ? "selected" : ""}>개인별 원아 수입대장 (금액)</option>
        <option value="date"    ${v.kind === "date"    ? "selected" : ""}>기타필요경비 수입부 대장 (수납일)</option>
        <option value="expense" ${v.kind === "expense" ? "selected" : ""}>개인별 원아 지출대장 (금액)</option>
      </select></label>
      <label class="f">계정과목<select id="lg_item" style="width:220px">
        <option value="">전체 (한 장에 모두)</option>
        ${S.items.map(i => `<option value="${i.id}" ${i.id === v.itemId ? "selected" : ""}>${esc(i.name)}</option>`).join("")}
      </select></label>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="lg_blank" ${v.showBlank ? "checked" : ""}> 기록 없는 계정과목도 표시
      </label>
      <span class="grow"></span>
      <button class="b" id="lg_print">인쇄</button>
      <button class="b" id="lg_csv">CSV 저장</button>
    </div>
    <div class="hint no-print">${
      v.kind === "receipt" ? "수납결의서에 적은 금액이 수납일이 속한 달에 들어갑니다. <b>위탁 원아</b>는 보호자 대신 전입금이 들어오므로, 그 달 충당액이 수입으로 채워집니다."
    : v.kind === "date"    ? "금액 대신 <b>수납한 날짜</b>가 그 달 칸에 들어갑니다. 손으로 날인하던 수입부 대장을 대신합니다. 한 달에 두 번 받았으면 두 날짜가 함께 나옵니다."
    :                        "지출 등록에서 배분된 결과가 그대로 채워집니다. 따로 옮겨 적을 필요가 없습니다."}
      &nbsp;·&nbsp; 인쇄할 때는 <b>용지 방향을 가로</b>로 두세요.</div>
    <div id="lg_body"></div>`;

  $("#lg_kind", root).onchange  = e => { v.kind = e.target.value; render(); };
  $("#lg_item", root).onchange  = e => { v.itemId = e.target.value; render(); };
  $("#lg_blank", root).onchange = e => { v.showBlank = e.target.checked; render(); };
  $("#lg_print", root).onclick  = () => window.print();

  const title = v.kind === "receipt" ? "개인별 원아 수입대장"
              : v.kind === "date"    ? "기타필요경비 수입부 대장"
              :                        "개인별 원아 지출대장";
  const isDate = v.kind === "date";
  const body = $("#lg_body", root);
  body.innerHTML = printHead(title,
    `${fy}년 3월 ~ ${fy + 1}년 2월${v.itemId ? " · " + itemName(v.itemId) : ""}`);

  /* 수입부 대장은 금액 대신 수납한 날짜를 적는다 */
  const cellOf = (c, it, m) => {
    const r = monthRange(m.key);
    if (isDate)                return receiptDates(c.id, it.id, r.from, r.to);
    /* 위탁 원아는 보호자 대신 전입금이 들어오므로, 그 달 충당액을 수입으로 잡는다 */
    return v.kind === "receipt"
      ? sumReceipts(c.id, it.id, r.from, r.to) + sumConsignCovered(c.id, it.id, r.from, r.to)
      : sumAlloc(c.id, it.id, r.from, r.to);
  };
  const filled = x => isDate ? x.length > 0 : x !== 0;
  const cellText = x => isDate ? x.join(" ") : (x ? won(x) : "");

  const hasAny = it => S.children.some(c => months.some(m => filled(cellOf(c, it, m))));
  const items = v.itemId
    ? S.items.filter(i => i.id === v.itemId)
    : S.items.filter(i => v.showBlank ? i.enabled || hasAny(i) : hasAny(i));
  if (!items.length) {
    body.appendChild(el(`<div class="empty">이 회계연도의 기록이 없습니다.</div>`));
    return;
  }

  /* 기록이 있는 원아만, 반별로 묶어서 */
  const kids = sortedChildren()
    .map(c => {
      const rows = items.map(it => ({ it, cells: months.map(m => cellOf(c, it, m)) }))
                        .map(r => Object.assign(r, { sum: isDate
                          ? r.cells.reduce((s, x) => s + x.length, 0)          // 받은 횟수
                          : r.cells.reduce((s, x) => s + x, 0) }));
      return { c, rows, any: rows.some(r => r.cells.some(filled)) };
    })
    .filter(k => k.any);

  if (!kids.length) { body.appendChild(el(`<div class="empty">이 회계연도의 기록이 없습니다.</div>`)); return; }

  const t = el(`<table class="sheet ledger"><thead><tr>
    <th style="width:62px">반</th><th class="c" style="width:34px">순번</th><th style="width:66px">아동</th>
    <th style="width:96px">계정과목</th>
    ${months.map(m => `<th class="${isDate ? "c" : "n"}" style="width:54px">${m.label}</th>`).join("")}
    <th class="n" style="width:74px">${isDate ? "받은 횟수" : "합계"}</th><th style="width:92px">비고</th>
  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);

  const csv = [["반", "순번", "아동", "계정과목"]
    .concat(months.map(m => m.label), [isDate ? "받은 횟수" : "합계", "비고"])];
  const colSum = months.map(() => 0);
  let grand = 0, seq = 0;

  /* 합치는 칸(반·순번·아동)은 원아 한 명 단위까지만 묶는다.
     반 전체를 하나로 묶으면 그 반이 통째로 다음 장으로 밀려 앞 장이 비고,
     넘어간 장에는 반 이름이 남지 않는다. 원아 단위로 끊으면 장이 갈릴 때마다
     반 이름이 다시 찍힌다. */
  for (const k of kids) {
    seq++;
    const clsName = (currentClass(k.c) || {}).name || "반 미지정";
    const note = ledgerNote(k.c, items, from, to);
    k.rows.forEach((r, ri) => {
      r.cells.forEach((x, i) => colSum[i] += isDate ? x.length : x);
      grand += r.sum;
      const rowNote = ri === 0 ? note : "";
      const tr = el(`<tr>
        ${ri === 0 ? `<td rowspan="${k.rows.length}" style="vertical-align:middle" class="ui-center">${esc(clsName)}</td>
                      <td class="c" rowspan="${k.rows.length}" style="vertical-align:middle">${seq}</td>
                      <td rowspan="${k.rows.length}" style="vertical-align:middle" class="ui-center"><b>${esc(k.c.name)}</b></td>` : ""}
        <td>${esc(r.it.name)}</td>
        ${r.cells.map(x => `<td class="${isDate ? "c" : "n"}" ${!isDate && x < 0 ? 'style="color:var(--bad)"' : ""}>${esc(cellText(x))}</td>`).join("")}
        <td class="n">${r.sum ? `<b>${isDate ? won(r.sum) + "회" : won(r.sum)}</b>` : ""}</td>
        ${ri === 0 ? `<td rowspan="${k.rows.length}" style="vertical-align:middle;font-size:11px;color:var(--warn)" class="ui-prose">${esc(rowNote)}</td>` : ""}
      </tr>`);
      tb.appendChild(tr);
      csv.push([clsName, seq, k.c.name, r.it.name]
        .concat(r.cells.map(x => isDate ? x.join(" ") : x), [r.sum, rowNote]));

  tb.appendChild(el(`<tr class="sum"><td colspan="4" class="c">${isDate ? "받은 횟수" : "합계"}</td>
    ${colSum.map(x => `<td class="${isDate ? "c" : "n"}">${x ? won(x) + (isDate ? "회" : "") : ""}</td>`).join("")}
    <td class="n">${won(grand)}${isDate ? "회" : ""}</td><td></td></tr>`));

  const wrap = el(`<div class="scroll" style="max-height:none"></div>`);

}

   ========================================================================== */

function runChecks(){
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const out = [];
  const add = (level, title, detail, jump) => out.push({ level, title, detail, jump });

  for (const ex of S.expenses) {
    const label = `${ex.date} ${itemName(ex.itemId)} "${ex.summary || "-"}"`;

    if (!ex.allocations.length) {
      add("bad", "대상 원아가 지정되지 않은 지출건", label, () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    const sum = ex.allocations.reduce((s, a) => s + a.amount, 0);
    if (sum !== ex.needAmount) {
      add("bad", "배분 합계가 필요경비 부담분과 다름",
        `${label} — 배분 ${won(sum)}원 vs 필요경비 ${won(ex.needAmount)}원`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    const ovr = new Set((ex.overrides || []).map(o => o.childId));
    const outside = ex.allocations.filter(a => {
      const c = childById(a.childId);
      return c && !isEnrolled(c, ex.date) && !ovr.has(a.childId);
    });
    if (outside.length) {
      add("bad", "재원기간 밖 원아가 배분에 포함됨",
        `${label} — ${outside.map(a => childName(a.childId)).join(", ")}`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    for (const o of (ex.overrides || [])) {
      if (!ex.allocations.some(a => a.childId === o.childId)) continue;
      add("info", "정산 화면에서 사유를 달아 포함한 원아",
        `${label} — ${childName(o.childId)}: ${o.reason || "사유 없음"}`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    if (!inRange(ex.date, from, to)) {
      add("warn", "회계연도 범위 밖 지출건", label, null);
    }
    if ((ex.operAmount || 0) < 0) {
      add("bad", "금액 구성 오류", `${label} — 운영비 부담분이 음수입니다`, () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
  }

  for (const x of S.vouchers) {
    const label = `${x.date} ${itemName(x.itemId)}${x.voucherNo ? " " + x.voucherNo + "번" : ""}`;
    if (!inRange(x.date, from, to)) add("warn", "회계연도 범위 밖 수납결의서", label, null);
    if (!x.voucherNo) add("warn", "수납결의서 번호가 비어 있음",
      `${label} — 총계정원장과 맞춰 보려면 번호를 적어 두세요`,
      () => { view.receiptEditId = x.id; view.receiptForm = null; goTab("receipt"); });
    const sum = x.lines.reduce((s, l) => s + l.amount, 0);
    if (sum !== x.total) add("bad", "수납결의서 합계가 원아별 금액과 다름",
      `${label} — 합계 ${won(x.total)}원 vs 원아별 ${won(sum)}원`,
      () => { view.receiptEditId = x.id; view.receiptForm = null; goTab("receipt"); });
    const outside = x.lines.filter(l => { const c = childById(l.childId); return c && !isEnrolled(c, x.date); });
    if (outside.length) add("warn", "재원기간 밖 원아가 수납결의서에 포함됨",
      `${label} — ${outside.map(l => childName(l.childId)).join(", ")}`,
      () => { view.receiptEditId = x.id; view.receiptForm = null; goTab("receipt"); });
  }

  /* 세목별 배분 초과 · 미집행 */
  for (const it of S.items) {
    const paidAny = S.receipts.some(r => r.itemId === it.id && inRange(r.date, from, to));
    const spentAny = S.expenses.some(e => e.itemId === it.id && inRange(e.date, from, to));
    if (paidAny && !spentAny) {
      add("warn", `수납만 있고 지출이 없음 — ${it.name}`, "미집행 상태입니다. 집행하거나 정산해 돌려줘야 합니다.", null);
  }

  /* 4분기에 들어섰다면 잔액이 모자라는 원아를 짚어 준다.
     그 전에는 다음 분기 수납으로 메워지는 것이 보통이라 알리지 않는다. */
  if (todayISO() >= fy + "-12-01") {
    for (const it of S.items) {
      const short = [];
      for (const c of S.children) {
        const b = balance(c.id, it.id, from, to);
        if (b.left < 0) short.push({ name: c.name, amount: -b.left });
      }
      if (!short.length) continue;
      const tot = short.reduce((s2, x) => s2 + x.amount, 0);
      add("warn", `잔액이 모자란 원아 — ${it.name}`,
        `${short.length}명 · 모자란 금액 ${won(tot)}원. 보호자에게 더 받을 수 없으므로 ` +
        `어린이집 운영비에서 부담한 것으로 봅니다. 보호자 정산에서는 잔액 0에서 멈춥니다. — ` +
        short.sort((x, y) => y.amount - x.amount).map(x => `${x.name} ${won(x.amount)}원`).join(", "),
        null);
    }
    }
  }

  return out;
}

function renderCheck(root){
  const issues = runChecks();
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const cb = centerBurden(from, to);

  const paidTotal = S.receipts.filter(r => inRange(r.date, from, to)).reduce((s, r) => s + r.amount, 0);
  const usedTotal = S.expenses.filter(e => inRange(e.date, from, to))

  /* 위탁 원아 몫은 보호자가 아니라 전입금으로 들어온다 */
  const transferTotal = S.children.reduce((s, c) =>

  root.innerHTML = `

    <table style="max-width:620px"><tbody>
      <tr><th style="width:330px">${col("보호자 수납 합계 (221목·211목)", "A")}</th><td class="n">${won(paidTotal)}원</td></tr>

      <tr class="sum"><th>${col("남은 금액 (보호자에게 돌려줄 몫)",
        transferTotal ? "E = C − D" : "C = A − B")}</th><td class="n">${won(paidTotal + transferTotal - usedTotal)}원</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:6px">위탁 원아는 보호자 대신 <b>전입금</b>이 들어오므로, 그 달 지출액과 같은 금액을 수입으로 잡습니다. 그래서 <b>수입 합계와 배분 합계의 차이가 곧 보호자에게 돌려줄 몫</b>이 됩니다.</div>

    <h3>어린이집 부담</h3>
    <table style="max-width:620px"><tbody>
      <tr><th style="width:330px">${col("운영비 부담분", "A")}</th><td class="n">${won(cb.oper)}원</td></tr>
      <tr><th>${col(`카드수수료 (${CARD_FEE_MODES[cardFeeMode()].label}${cb.feeCounted ? "" : " — 수납액에서 이미 뺀 몫"})`,
        cb.feeCounted ? "B" : "참고")}</th>
          <td class="n">${won(cb.fee)}원</td></tr>
      <tr><th>${col("배분 단수차", cb.feeCounted ? "C" : "B")}</th><td class="n">${won(cb.rounding)}원</td></tr>
      <tr class="sum"><th>${col("합계", cb.feeCounted ? "D = A + B + C" : "C = A + B")}</th><td class="n">${won(cb.total)}원</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:6px">${cb.feeCounted
      ? "총액 방식이므로 카드수수료는 운영비에서 따로 나간 몫으로 합계에 넣었습니다."
      : "순액 방식이므로 카드수수료는 수납액에서 이미 빠져 있어 합계에 넣지 않았습니다."}</div>

    <h3>점검 결과</h3>
    <div id="chk"></div>`;

  const host = $("#chk", root);
  if (!issues.length) { host.innerHTML = `<div class="note ok">걸린 항목이 없습니다.</div>`; return; }

  const bad = issues.filter(i => i.level === "bad").length;
  host.appendChild(el(`<div class="note ${bad ? "bad" : "warn"}">
    ${bad ? `저장 차단 대상 ${bad}건을 포함해 ` : ""}${issues.length}건이 걸렸습니다.</div>`));

  const t = el(`<table><thead><tr><th class="c" style="width:70px">등급</th>
    <th style="width:300px">항목</th><th>내용</th><th class="c" style="width:90px"></th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const LEVEL = {
    bad:  { label: "오류", css: "background:var(--bad-bg);color:var(--bad)" },
    warn: { label: "주의", css: "background:var(--warn-bg);color:var(--warn)" },
    info: { label: "기록", css: "background:var(--accent-bg);color:var(--accent)" },
  };
  for (const i of issues) {
    const lv = LEVEL[i.level] || LEVEL.warn;
    const tr = el(`<tr>
      <td class="c"><span class="tag" style="${lv.css}">${lv.label}</span></td>
      <td>${esc(i.title)}</td><td>${esc(i.detail)}</td>
      <td class="c">${i.jump ? '<button class="b">이동</button>' : ""}</td></tr>`);
    if (i.jump) $("button", tr).onclick = i.jump;
    tb.appendChild(tr);
  }
  host.appendChild(t);
}
