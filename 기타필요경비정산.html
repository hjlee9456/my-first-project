      </select></label>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)">
        <input type="checkbox" id="lg_blank" ${v.showBlank ? "checked" : ""}> 기록 없는 계정과목도 표시
      </label>
      <span class="grow"></span>
      <button class="b" id="lg_print">인쇄</button>
      <button class="b" id="lg_csv">CSV 저장</button>
    </div>
    <div class="hint no-print">${v.kind === "receipt"
      ? "수입대장의 반환액은 그 달에 <b>음수로</b> 표시되어 합계에서 빠집니다."
      : "지출 등록에서 배분된 결과가 그대로 채워집니다. 따로 옮겨 적을 필요가 없습니다."}</div>
    <div id="lg_body"></div>`;

  $("#lg_kind", root).onchange  = e => { v.kind = e.target.value; render(); };
  $("#lg_item", root).onchange  = e => { v.itemId = e.target.value; render(); };
  $("#lg_blank", root).onchange = e => { v.showBlank = e.target.checked; render(); };
  $("#lg_print", root).onclick  = () => window.print();

  const title = v.kind === "receipt" ? "개인별 원아 수입대장" : "개인별 원아 지출대장";
  const body = $("#lg_body", root);
  body.innerHTML = printHead(title,
    `${fy}년 3월 ~ ${fy + 1}년 2월${v.itemId ? " · " + itemName(v.itemId) : ""}`);

  const cellOf = (c, it, m) => {
    const r = monthRange(m.key);
    return v.kind === "receipt"
      ? sumReceipts(c.id, it.id, r.from, r.to) - sumRefunds(c.id, it.id, r.from, r.to)
      : sumAlloc(c.id, it.id, r.from, r.to);
  };

  const hasAny = it => S.children.some(c => months.some(m => cellOf(c, it, m) !== 0));
  const items = v.itemId
    ? S.items.filter(i => i.id === v.itemId)
    : S.items.filter(i => v.showBlank ? i.enabled || hasAny(i) : hasAny(i));
  if (!items.length) {
    body.appendChild(el(`<div class="empty">이 회계연도의 기록이 없습니다.</div>`));
    return;
  }

  /* 기록이 있는 원아만, 반별로 묶어서 */
  const kids = sortedChildren()
    .map(c => {
      const rows = items.map(it => ({ it, cells: months.map(m => cellOf(c, it, m)) }))
                        .map(r => Object.assign(r, { sum: r.cells.reduce((s, x) => s + x, 0) }));
      return { c, rows, any: rows.some(r => r.cells.some(x => x !== 0)) };
    })
    .filter(k => k.any);

  if (!kids.length) { body.appendChild(el(`<div class="empty">이 회계연도의 기록이 없습니다.</div>`)); return; }

  const t = el(`<table class="sheet ledger"><thead><tr>

  </tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);

  const csv = [["반", "순번", "아동", "계정과목"].concat(months.map(m => m.label), ["합계", "비고"])];
  const colSum = months.map(() => 0);
  let grand = 0, seq = 0;

  /* 같은 반이 이어지면 반 칸을 하나로 합친다 (실제 서식과 같은 모양) */
  const classRuns = [];
  for (const k of kids) {
    const nm = (currentClass(k.c) || {}).name || "반 미지정";
    const last = classRuns[classRuns.length - 1];
    if (last && last.name === nm) last.kids.push(k);
    else classRuns.push({ name: nm, kids: [k] });
  }

  for (const run of classRuns) {
    let classCellDone = false;
    const classRowCount = run.kids.reduce((s, k) => s + k.rows.length, 0);

    for (const k of run.kids) {
      seq++;
      const note = ledgerNote(k.c, items, from, to);
      k.rows.forEach((r, ri) => {
        r.cells.forEach((x, i) => colSum[i] += x);
        grand += r.sum;
        const rowNote = ri === 0 ? note : "";
        const tr = el(`<tr>
          ${!classCellDone ? `<td rowspan="${classRowCount}" style="vertical-align:middle;text-align:center">${esc(run.name)}</td>` : ""}
          ${ri === 0 ? `<td class="c" rowspan="${k.rows.length}" style="vertical-align:middle">${seq}</td>
                        <td rowspan="${k.rows.length}" style="vertical-align:middle"><b>${esc(k.c.name)}</b></td>` : ""}
          <td>${esc(r.it.name)}</td>
          ${r.cells.map(x => `<td class="n" ${x < 0 ? 'style="color:var(--bad)"' : ""}>${x ? won(x) : ""}</td>`).join("")}
          <td class="n">${r.sum ? `<b>${won(r.sum)}</b>` : ""}</td>
          ${ri === 0 ? `<td rowspan="${k.rows.length}" style="vertical-align:middle;font-size:11px;color:var(--warn)">${esc(rowNote)}</td>` : ""}
        </tr>`);
        classCellDone = true;
        tb.appendChild(tr);
        csv.push([run.name, seq, k.c.name, r.it.name].concat(r.cells, [r.sum, rowNote]));
      });
    }
  }

  tb.appendChild(el(`<tr class="sum"><td colspan="4" class="c">합계</td>
    ${colSum.map(x => `<td class="n">${x ? won(x) : ""}</td>`).join("")}
    <td class="n">${won(grand)}</td><td></td></tr>`));
  csv.push(["합계", "", "", ""].concat(colSum, [grand, ""]));

  const wrap = el(`<div class="scroll" style="max-height:none"></div>`);
  wrap.appendChild(t);
  body.appendChild(wrap);
  $("#lg_csv", root).onclick = () => downloadCSV(
    `${title}_${v.itemId ? itemName(v.itemId) + "_" : ""}${fy}.csv`, csv);
}

   12. 검증

function runChecks(){
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const out = [];
  const add = (level, title, detail, jump) => out.push({ level, title, detail, jump });

  for (const ex of S.expenses) {
    const label = `${ex.date} ${itemName(ex.itemId)} "${ex.summary || "-"}"`;

    if (!ex.allocations.length) {
      add("bad", "대상 원아가 지정되지 않은 지출건", label, () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    const sum = ex.allocations.reduce((s, a) => s + a.amount, 0);
    if (sum !== ex.needAmount) {
      add("bad", "배분 합계가 필요경비 부담분과 다름",
        `${label} — 배분 ${won(sum)}원 vs 필요경비 ${won(ex.needAmount)}원`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    const ovr = new Set((ex.overrides || []).map(o => o.childId));
    const outside = ex.allocations.filter(a => {
      const c = childById(a.childId);
      return c && !isEnrolled(c, ex.date) && !ovr.has(a.childId);
    });
    if (outside.length) {
      add("bad", "재원기간 밖 원아가 배분에 포함됨",
        `${label} — ${outside.map(a => childName(a.childId)).join(", ")}`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    for (const o of (ex.overrides || [])) {
      if (!ex.allocations.some(a => a.childId === o.childId)) continue;
      add("info", "정산 화면에서 사유를 달아 포함한 원아",
        `${label} — ${childName(o.childId)}: ${o.reason || "사유 없음"}`,
        () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
    if (!inRange(ex.date, from, to)) {
      add("warn", "회계연도 범위 밖 지출건", label, null);
    }
    if ((ex.operAmount || 0) < 0) {
      add("bad", "금액 구성 오류", `${label} — 운영비 부담분이 음수입니다`, () => { view.expenseEditId = ex.id; goTab("expense"); });
    }
  }

  for (const r of S.receipts) {
    if (!inRange(r.date, from, to)) add("warn", "회계연도 범위 밖 수납", `${r.date} ${childName(r.childId)} ${itemName(r.itemId)} ${won(r.amount)}원`, null);
    const c = childById(r.childId);
    if (c && !isEnrolled(c, r.date)) {
      add("warn", "재원기간 밖 수납", `${r.date} ${c.name} ${itemName(r.itemId)} — 입소 ${c.admitDate || "-"} / 퇴소 ${c.leaveDate || "-"}`, null);
    }
  }

  /* 세목별 배분 초과 · 미집행 */
  for (const it of S.items) {
    const overs = [];
    for (const c of S.children) {
      const b = balance(c.id, it.id, from, to);
      if (b.used > b.paid && b.used > 0) overs.push(`${c.name} (수납 ${won(b.paid)} / 사용 ${won(b.used)})`);
    }
    if (overs.length) {
      add("warn", `수납액을 넘긴 사용 — ${it.name}`,
        `${overs.length}명: ${overs.slice(0, 6).join(", ")}${overs.length > 6 ? " 외" : ""} — 초과분은 어린이집 운영비 처리`, null);
    }
    const paidAny = S.receipts.some(r => r.itemId === it.id && inRange(r.date, from, to));
    const spentAny = S.expenses.some(e => e.itemId === it.id && inRange(e.date, from, to));
    if (paidAny && !spentAny) {
      add("warn", `수납만 있고 지출이 없음 — ${it.name}`, "미집행 상태입니다. 집행하거나 정산·반환 처리가 필요합니다.", null);
    }
    if (it.yearLimit) {
      const n = S.expenses.filter(e => e.itemId === it.id && inRange(e.date, from, to)).length;
      if (n > it.yearLimit) {
        add("bad", `${it.name} 연 ${it.yearLimit}회 초과`, `이 회계연도에 ${n}건이 등록되었습니다.`, null);
      }
    }
  }

  return out;
}

function renderCheck(root){
  const issues = runChecks();
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const cb = centerBurden(from, to);

  const paidTotal = S.receipts.filter(r => inRange(r.date, from, to)).reduce((s, r) => s + r.amount, 0);
  const usedTotal = S.expenses.filter(e => inRange(e.date, from, to))
    .reduce((s, e) => s + e.allocations.reduce((x, a) => x + a.amount, 0), 0);
  const refundTotal = S.refunds.filter(r => inRange(r.date, from, to)).reduce((s, r) => s + r.amount, 0);

  root.innerHTML = `
    <h2>검증</h2>
    <h3>대사</h3>
    <table style="max-width:620px"><tbody>
      <tr><th style="width:260px">수납 합계 (221목·211목)</th><td class="n">${won(paidTotal)}원</td></tr>
      <tr><th>원아 배분 합계 (421목·411목 중 필요경비 부담분)</th><td class="n">${won(usedTotal)}원</td></tr>
      <tr><th>반환 합계 (622목 등)</th><td class="n">${won(refundTotal)}원</td></tr>
      <tr class="sum"><th>남은 금액</th><td class="n">${won(paidTotal - usedTotal - refundTotal)}원</td></tr>
    </tbody></table>
    <div class="hint" style="margin-top:6px">위탁 원아가 있으면 <b>221목 수납 합계 ≠ 421목 지출 합계</b>가 정상입니다(전입금 충당분 때문). 위탁 화면은 3단계에서 붙습니다.</div>

    <h3>어린이집 부담</h3>
    <table style="max-width:620px"><tbody>
      <tr><th style="width:260px">운영비 부담분</th><td class="n">${won(cb.oper)}원</td></tr>
      <tr><th>카드수수료 (매뉴얼 19p)</th><td class="n">${won(cb.fee)}원</td></tr>
      <tr><th>배분 단수차</th><td class="n">${won(cb.rounding)}원</td></tr>
      <tr class="sum"><th>합계</th><td class="n">${won(cb.total)}원</td></tr>
    </tbody></table>

    <h3>점검 결과</h3>
    <div id="chk"></div>`;

  const host = $("#chk", root);
  if (!issues.length) { host.innerHTML = `<div class="note ok">걸린 항목이 없습니다.</div>`; return; }

  const bad = issues.filter(i => i.level === "bad").length;
  host.appendChild(el(`<div class="note ${bad ? "bad" : "warn"}">
    ${bad ? `저장 차단 대상 ${bad}건을 포함해 ` : ""}${issues.length}건이 걸렸습니다.</div>`));

  const t = el(`<table><thead><tr><th class="c" style="width:70px">등급</th>
    <th style="width:300px">항목</th><th>내용</th><th class="c" style="width:90px"></th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const LEVEL = {
    bad:  { label: "오류", css: "background:var(--bad-bg);color:var(--bad)" },
    warn: { label: "주의", css: "background:var(--warn-bg);color:var(--warn)" },
    info: { label: "기록", css: "background:var(--accent-bg);color:var(--accent)" },
  };
  for (const i of issues) {
    const lv = LEVEL[i.level] || LEVEL.warn;
    const tr = el(`<tr>
      <td class="c"><span class="tag" style="${lv.css}">${lv.label}</span></td>
      <td>${esc(i.title)}</td><td>${esc(i.detail)}</td>
      <td class="c">${i.jump ? '<button class="b">이동</button>' : ""}</td></tr>`);
    if (i.jump) $("button", tr).onclick = i.jump;
    tb.appendChild(tr);
  }
  host.appendChild(t);
}

  { g:"수납", q:"더 받은 돈(과오납)을 돌려줘야 합니다.",
    k:"과오납 착오 더받음 반납 세입",
    a:`<p>과오납 반환은 <b>622목이 아니라 세입 계정으로 직접 반납</b>합니다. 특별활동 미참여에 따른 반환은 <b>반납결의</b>로 처리합니다.</p>
       <p>둘은 회계 경로가 다르므로 반환 사유를 정확히 골라야 합니다. (반환 관리 화면은 4단계에서 붙습니다)</p>`,
    law:"부록 12p · 부록 62p" },

  /* ---- 지출 ---- */
  { g:"지출", q:"전세버스 2대를 한 건으로 결제했습니다. 어떻게 나눠 적나요?",
    k:"전세버스 차량 일괄 총액 나누기 배분",
    a:`<p><b>나눠 적지 마세요.</b> 지출결의서 1건을 그대로 1건으로 등록하는 것이 이 프로그램의 방식입니다.</p>
       <ol><li>총액에 결제한 전체 금액을 적습니다.</li>
       <li>대상 원아를 체크합니다.</li>
       <li>1인당 금액은 <b>프로그램이 자동으로 나눠</b> 개인별 대장까지 채웁니다.</li></ol>
       <p>예전에는 적요에 <code>차량대여2대(70/1,320,000)</code>처럼 <b>인원수만</b> 남아 누구인지 알 수 없었지만, 이제는 <b>명단이 통째로 저장</b>되어 담당자가 바뀌어도 근거가 남습니다.</p>` },

  { g:"지출", q:"지출 중 일부만 필요경비이고 나머지는 어린이집 운영비입니다.",
    k:"운영비 분리 일부 부담 어린이집",
    a:`<p><b>「필요경비 부담분」</b>에 원아들에게 나눌 금액만 적으세요.</p>
       <p><b>「운영비 부담분」은 자동으로 계산</b>됩니다 (총액 − 필요경비 부담분 − 카드수수료). 이 금액은 원아에게 배분되지 않고 어린이집 부담으로 집계됩니다.</p>
       <p>전액이 필요경비라면 <b>「전액 필요경비」</b> 버튼을 누르면 됩니다.</p>` },

  { g:"지출", q:"금액이 딱 나눠떨어지지 않습니다. (100,000원 ÷ 3명)",
    k:"나눠떨어지지 원 단수 소수점 나머지 1원",
    a:`<p>걱정하지 않으셔도 됩니다. 1인당 <b>33,333원</b>으로 하고 남는 <b>1원</b>을 <b>앞 순번 1명에게 더</b> 붙입니다. (33,334 + 33,333 + 33,333 = 100,000)</p>
       <p>이 방식이라 <b>배분 합계가 필요경비 부담분과 1원도 어긋나지 않습니다.</b> 221목↔421목 대사가 그대로 떨어집니다.</p>
       <p>만약 어긋나면 프로그램이 <b>저장 자체를 막습니다.</b></p>` },

  { g:"지출", q:"참여하는 아이가 행사마다 달라요.",
    k:"건별 매번 다름 현장학습 행사 명단",
    a:`<p><b>기초설정 → 세목</b>에서 그 세목의 <b>「대상 원아 선정」을 '건별 체크'</b>로 바꿔 두세요. 현장학습비·행사비가 여기 해당합니다.</p>
       <p>반대로 차량 이용 원아나 특별활동 과목 참여자처럼 <b>매번 같은 아이들</b>이라면 <b>'고정 명단'</b>으로 두고, 기초설정에서 명단을 만들어 두세요. 지출 등록에서 <b>「명단 불러오기」</b> 한 번이면 됩니다.</p>
       <p>불러온 뒤에도 그 건에서만 빼거나 더할 수 있습니다.</p>` },

  { g:"지출", q:"이미 등록한 지출건을 나중에 고칠 수 있나요?",
    k:"수정 변경 고치기 나중에 정정",
    a:`<p><b>언제든 몇 번이든 고칠 수 있습니다.</b></p>
       <p><b>지출 등록</b> 화면 아래 <b>지출 내역</b>에서 <b>「수정」</b>을 누르면 그 건의 금액·적요·대상 원아가 그대로 올라옵니다. 고쳐서 저장하면 <b>개인별 대장·정산서·보고서가 전부 자동으로 다시 계산</b>됩니다.</p>
       <p>이미 정산서를 뽑은 뒤라도 상관없습니다. 고친 다음 다시 뽑으면 됩니다.</p>
       <p>원아별 현황에서 금액을 누르면 그 지출건으로 바로 이동합니다.</p>` },

  { g:"지출", q:"월 단위 비용(유류비 등)인데 그 달 중간에 퇴소한 아이가 있습니다.",
    k:"유류비 월단위 퇴소 그달 일할 포함",
    a:`<p>프로그램이 <b>자동으로 판정하지 않습니다.</b> 정답이 하나로 정해져 있지 않기 때문입니다.</p>
       <p><b>정산·보고 → 중간퇴소 정산</b>으로 가면, 퇴소일이 속한 달의 지출건을 <b>하나씩 보여주며 포함할지 물어봅니다.</b> 체크하고 사유를 적으면, 그 <b>선택 결과와 사유가 정산서에 근거로 남습니다.</b></p>
       <p>지출 등록 화면에서는 퇴소 후 날짜의 아이가 계속 잠겨 있습니다. 잠금이 풀리는 건 정산 화면뿐입니다.</p>` },

  { g:"지출", q:"수납액보다 더 많이 썼습니다.",
    k:"초과 부족 모자람 마이너스 적자",
    a:`<p>원아별 현황과 검증 화면에 <b>초과 표시</b>가 뜹니다.</p>
       <p>초과분은 <b>어린이집 운영비로 처리</b>하고, 원아별 잔액은 <b>0에서 멈추며 마이너스로 내려가지 않습니다.</b> 보호자에게 더 받아내는 항목이 아니기 때문입니다.</p>` },

  { g:"지출", q:"행사비를 12회 넘게 등록했더니 오류가 납니다.",
    k:"행사비 12회 초과 횟수 제한",
    a:`<p>부모부담행사비(행사비)는 <b>연 12회 이내</b>이고, 운영위원회에서 <b>사전에 결정한 항목만</b> 가능합니다. 검증 화면에서 횟수를 세어 알려 드립니다.</p>
       <p>한 행사에 지출결의서가 여러 건 나갔다면 실제 행사 횟수와 다를 수 있으니, 세목을 나누거나 적요로 구분해 관리하세요.</p>`,
    law:"본문 95p" },

  { g:"지출", q:"차량운행비를 필요경비로 써도 되나요?",
    k:"차량운행비 유류비 인건비 120항 215목",
    a:`<p>먼저 <b>인건비(120항)와 차량비(215목)에서 우선 집행</b>하도록 권고됩니다. 그러고도 부족한 부분을 필요경비로 충당하는 순서입니다.</p>
       <p>프로그램은 이를 <b>안내만 하고 막지는 않습니다.</b> 어린이집 사정에 따라 판단할 몫이기 때문입니다.</p>`,
    law:"본문 95~96p" },

  { g:"수납", q:"졸업앨범은 신청한 아이만 받는데 어떻게 하나요?",
    k:"앨범비 졸업 신청자 액자 선택",
    a:`<p><b>앨범비</b>는 졸업생 중 <b>신청자에 한해</b> 받는 세목입니다. 세목이 따로 있습니다.</p>
       <ol><li><b>수납 입력</b>에서 신청한 아이만 금액을 넣고, 나머지는 0원으로 둡니다.</li>
       <li>앨범 대금을 지출할 때는 <b>신청자만 대상 원아로 체크</b>합니다. 매년 같은 명단이 아니므로,
         <b>고정 명단</b>을 그 해 신청자로 새로 만들어 두면 편합니다.</li></ol>`,
    law:"전라남도 공고 제2026-208호 — 앨범비 연 70,000원" },

  { g:"수납", q:"수납한도액을 넘었는지 프로그램이 검사해 주나요?",
    k:"한도액 한도 초과 검사 공고 수납주기",
    a:`<p><b>검사하지 않습니다.</b> 일부러 넣지 않았습니다.</p>
       <p>이 프로그램의 목적은 <b>이미 들어온 돈을 제대로 정산하는 것</b>입니다.
         한도액은 시·도 공고에 명확히 나와 있고 실무에서 어기는 일이 드물어, 검사 기능이 오히려 방해가 됩니다.</p>
       <p>다만 <b>기초설정 → 세목</b>에 수납주기와 한도액을 <b>참고로 적어 두었습니다.</b>
         전라남도 2026년 공고 기준이며, 시·도 공고가 바뀌면 그 자리에서 고쳐 쓰시면 됩니다.</p>`,
    law:"전라남도 공고 제2026-208호 (적용기간 2026. 3. 1. ~ 2027. 2. 28.)" },

  { g:"수납", q:"우리 어린이집에 없는 세목이 화면에 있어요.",
    k:"세목 없음 안씀 끄기 급식비 특성화",
    a:`<p><b>기초설정 → 세목</b>에서 그 줄의 <b>「사용」 체크를 끄면</b> 모든 화면에서 사라집니다. 지워지는 것이 아니라 숨겨지는 것이라 나중에 다시 켤 수 있습니다.</p>
       <p>기본으로 들어 있는 세목은 전라남도 2026년 공고의 9개 항목입니다.
         이름이 다르면 그 자리에서 고쳐 쓰시고, 특별활동 과목처럼 더 필요하면 아래에서 추가하세요.</p>` },

  /* ---- 정산·보고 ---- */
  { g:"정산·보고", q:"반기 정산은 언제, 무엇을 해야 하나요?",
    k:"반기 정산 시기 운영위 보고 상반기 하반기",
    a:`<p>상반기는 <b>3~8월</b>, 하반기는 <b>9월~익년 2월</b>입니다.</p>
       <p>반기별로 <b>보호자별 수납액·실 사용금액·남은 금액</b>을 정산해 <b>운영위원회에 보고하거나 보호자에게 알려야</b> 합니다.</p>
       <ul><li>운영위원회에 낼 것 → <b>정산·보고 → 반기·연간 정산보고서</b> (전체 원아 한 장)</li>
       <li>보호자에게 드릴 것 → <b>보호자용 개별 안내문</b> (원아마다 한 장, 「전체 원아 한 장씩」 체크 후 인쇄)</li></ul>`,
    law:"본문 97p" },

  { g:"정산·보고", q:"반기가 끝났는데 돈이 남았습니다. 어떻게 하나요?",
    k:"잔액 남은돈 이월 반환 처리 미집행",
    a:`<p>실무에서 세 가지가 섞여 쓰입니다. 이 프로그램은 <b>이월을 기본</b>으로 봅니다.</p>
       <ol><li><b>이월(기본)</b> — 반기에는 정산·보고까지만 하고 남은 금액은 하반기로 넘깁니다. 하반기 보고서에 「전반기 이월」로 표시됩니다.</li>
       <li><b>반환</b> — 미참여자에게 돌려주는 경우 등. 반환 기록을 만들면 됩니다.</li>
       <li><b>어린이집 흡수</b> — 차액을 어린이집이 지원하는 경우. 어린이집 부담으로 집계됩니다.</li></ol>
       <p>실제 돈이 오가는 반환은 보통 <b>연말·중간퇴소·중간전환</b> 때 합니다.</p>
       <p>중요한 것은 <b>어느 쪽이든 숫자로 남겨 두는 것</b>입니다. 예전 보고서들이 '미집행액 합계' 칸을 비워 둔 채 형식만 남던 문제를 막기 위해, 이 프로그램은 그 칸을 <b>항상 계산해서 채웁니다.</b></p>` },

  { g:"정산·보고", q:"입학준비금은 왜 반환금이 자동으로 안 나오나요?",
    k:"입학준비금 원복 협의 물품 지급 반환",
    a:`<p>일부러 자동계산에서 뺐습니다. 지침이 <b>물품 지급 여부와 상태를 종합 고려해 보호자와 협의</b>하도록 정하고 있기 때문입니다.</p>
       <ul><li><b>입학 전 취소·미이용</b> → 100% 반환</li>
       <li><b>입학 후 취소</b> → 물품을 이미 줬는지, 상태가 어떤지 보고 <b>협의</b></li></ul>
       <p>정산 화면의 입학준비금 줄에서 <b>「물품을 이미 지급함」</b>을 체크하고, <b>협의한 금액을 직접 적어 넣으세요.</b> 그 금액이 정산서에 그대로 찍힙니다.</p>`,
    law:"본문 97p" },

  { g:"정산·보고", q:"현장학습비 남은 돈을 행사비 부족한 데 쓰면 안 되나요?",
    k:"세목 간 상계 전용 돌려쓰기 목적외",
    a:`<p><b>안 됩니다.</b> 예산의 목적 외 사용은 금지되어 있고, 221목↔421목·211목↔411목이 각각 연계되어 있습니다.</p>
       <p>그래서 이 프로그램은 <b>모든 계산을 세목 단위로만</b> 하고, 세목 간 합산이나 상계를 <b>구조적으로 불가능하게</b> 만들어 두었습니다. 잔액도 세목마다 따로 나옵니다.</p>`,
    law:"사회복지법인 및 사회복지시설 재무·회계 규칙 제15조 · 부록 47p" },

  { g:"정산·보고", q:"정산서·보고서를 인쇄하면 어린이집 이름이 안 나옵니다.",
    k:"기관명 어린이집 이름 인쇄 머리글",
    a:`<p><b>기초설정</b> 맨 위 <b>「어린이집 이름」</b> 칸에 한 번만 적으면, 모든 인쇄물 머리글에 자동으로 찍힙니다.</p>
       <p>물품관리시스템과 <b>같은 이름을 공유</b>하므로, 한쪽에서 적으면 다른 쪽에도 반영됩니다.</p>` },

  /* ---- 프로그램·자료 ---- */
  { g:"프로그램·자료", q:"다른 컴퓨터에서 열었더니 입력한 게 하나도 없습니다.",
    k:"다른 컴퓨터 안보임 사라짐 옮기기 이사",
    a:`<div class="warn"><p>입력한 자료는 <b>그 컴퓨터의 그 브라우저 안에만</b> 저장됩니다. 인터넷 서버에 올라가지 않습니다. 아동 이름·계좌번호가 밖으로 나가지 않게 하려고 일부러 그렇게 만들었습니다.</p></div>
       <p>옮기려면 이렇게 하세요.</p>
       <ol><li>원래 컴퓨터에서 화면 맨 위 <b>「JSON 백업」</b>을 눌러 파일을 받습니다.</li>

const MANUAL_MODES = [
  { id:"full",  ic:"📘", tt:"상세 설명서",  ds:"처음 쓰는 분을 위한<br>차근차근 전체 설명" },

  { id:"faq",   ic:"🧭", tt:"상황별 안내",   ds:"“이럴 땐 어떻게?”<br>상황을 찾아 그대로 따라 하기" },
];

function renderManual(root){
  const v = view.manual = Object.assign({ mode: null, q: "" }, view.manual || {});

  if (!v.mode) {
    root.innerHTML = `<h2 class="no-print">사용설명서</h2>
      <p class="hint" style="text-align:center;margin-top:6px">읽고 싶은 설명서를 고르세요. 화면에서 읽거나 인쇄할 수 있습니다.</p>
      <div class="man-cards">
        ${MANUAL_MODES.map(m => `<div class="man-card" data-m="${m.id}">
          <div class="ic">${m.ic}</div><div class="tt">${esc(m.tt)}</div><div class="ds">${m.ds}</div></div>`).join("")}
      </div>`;
    for (const m of MANUAL_MODES) $(`[data-m="${m.id}"]`, root).onclick = () => { v.mode = m.id; render(); };
    return;
  }

  const cur = MANUAL_MODES.find(m => m.id === v.mode);
  root.innerHTML = `
    <div class="row no-print" style="margin-bottom:12px">
      <button class="b" id="mn_back">← 설명서 고르기</button>
      <h2 style="margin:0 8px">${cur.ic} ${esc(cur.tt)}</h2>
      <span class="grow"></span>
      <button class="b" id="mn_print">인쇄</button>
    </div>
    <div id="mn_body" class="man"></div>`;
  $("#mn_back", root).onclick = () => { v.mode = null; render(); };
  $("#mn_print", root).onclick = () => window.print();

  const body = $("#mn_body", root);
  if (v.mode === "full")  body.innerHTML = manualFull();
  if (v.mode === "quick") body.innerHTML = manualQuick();
  if (v.mode === "faq")   manualFaq(body, v);
}

function manualFaq(body, v){
  body.innerHTML = `
    <h1>상황별 안내 — “이럴 땐 어떻게?”</h1>
    <div class="intro">실무에서 자주 부딪히는 상황을 모았습니다.
      아래 칸에 <b>겪고 있는 상황의 단어</b>를 넣어 보세요. (예: 퇴소, 위탁, 나눠떨어, 카드, 백업)</div>
    <div class="faq-search no-print">
      <input id="fq" placeholder="상황 검색 — 예: 중간에 그만뒀어요 / 카드 수수료 / 반이 바뀜"
        value="${esc(v.q)}" style="width:100%;padding:9px 12px;font-size:14px">
    </div>
    <div id="fqlist"></div>`;

  const listHost = $("#fqlist", body);
  const input = $("#fq", body);

  function draw(){
    const q = v.q.trim().toLowerCase();
    const hits = FAQ.filter(f => !q ||
      (f.q + " " + f.k + " " + f.g + " " + f.a).toLowerCase().includes(q));
    listHost.innerHTML = "";

    if (!hits.length) {
      listHost.innerHTML = `<div class="empty">찾는 상황이 없습니다. 다른 단어로 찾아보시거나, 전체 목록을 보려면 검색어를 지우세요.</div>`;
      return;
    }
    if (q) listHost.appendChild(el(`<p class="hint no-print">${hits.length}건을 찾았습니다.</p>`));

    const groups = [];
    for (const f of hits) {
      let g = groups.find(x => x.name === f.g);
      if (!g) groups.push(g = { name: f.g, list: [] });
      g.list.push(f);
    }
    for (const g of groups) {
      const box = el(`<div class="faq-g"><div class="gt">${esc(g.name)}</div></div>`);
      for (const f of g.list) {
        box.appendChild(el(`<details class="faq" ${q ? "open" : ""}>
          <summary>${esc(f.q)}</summary>
          <div class="ans">${f.a}${f.law ? `<div class="law">근거 — ${esc(f.law)}</div>` : ""}</div>
        </details>`));
      }
      listHost.appendChild(box);
    }
  }
  input.oninput = e => { v.q = e.target.value; draw(); };
  draw();
}

  <h3>③ 배분 미리보기</h3>
  <p>체크하는 즉시 <b>대상 몇 명, 1인당 얼마</b>인지 나옵니다.</p>
  <blockquote>100,000원을 3명에게 나누면 1인당 33,333원이고 남는 1원은 <b>앞 순번 1명에게 더</b> 붙습니다.
    그래서 <b>배분 합계가 필요경비 부담분과 1원도 어긋나지 않습니다.</b>
    어긋나거나 대상이 없으면 <b>저장 버튼 자체가 잠깁니다.</b></blockquote>
  <h3>④ 나중에 고치기</h3>
  <p>아래 <b>지출 내역</b>에서 <b>「수정」</b>을 누르면 그 건이 그대로 올라옵니다.
    <b>몇 번이든, 정산서를 뽑은 뒤라도</b> 고칠 수 있고, 고치면 대장·정산서·보고서가 전부 다시 계산됩니다.</p>
  <p><b>「명단」</b> 버튼을 누르면 그 건의 참여원아 명단이 나옵니다. <b>인쇄해서 지출결의서에 첨부</b>하면 배분 근거가 됩니다.</p>

  <h2>7. 원아별 현황 — 이 아이는 얼마가 남았나</h2>
  <p>아이를 고르면 <b>세목별로 수납·사용·반환·남은 금액</b>이 나옵니다.</p>
  <p>아래 <b>사용 건별 내역</b>에서 <b>금액을 누르면 그 지출결의서 건으로 바로 이동</b>합니다. 이것이 역추적입니다.</p>
  <blockquote>세목 간 상계는 하지 않습니다. 현장학습비가 남았다고 행사비 부족분에 쓸 수 없습니다.
    (재무회계규칙 제15조 — 예산의 목적 외 사용 금지)</blockquote>

  <h2>8. 정산·보고 — 서류 뽑기</h2>
  <h3>① 중간퇴소·중간전환 정산</h3>
  <ol>
    <li>기초설정에서 <b>퇴소일</b>을 먼저 적습니다.</li>
    <li>아이와 사유를 고릅니다. (중간퇴소 / 중간전환)</li>
    <li><b>그달 지출건 문답</b> — 퇴소한 달의 지출을 하나씩 보여주며 포함할지 묻습니다.
      프로그램이 마음대로 판정하지 않습니다. 체크와 사유가 정산서에 근거로 남습니다.</li>
    <li>세목별로 <b>수납 − 사용 = 반환금</b>이 나옵니다.</li>
    <li><b>입학준비금</b>은 자동계산에서 빠집니다. 「물품을 이미 지급함」을 체크하고 <b>협의한 금액을 직접</b> 적으세요.</li>
    <li><b>「반환금 확정」</b> → 반환 기록 생성. <b>「인쇄」</b> → 정산서.</li>
  </ol>
  <div class="warn"><p><b>위탁 원아는 정반대입니다.</b> 남은 돈을 보호자에게 반환하지 않고
    <b>보육교사 인건비·운영비로 충당</b>합니다. 이용을 중단한 경우에도 같습니다. 프로그램이 자동으로 안내합니다.</p></div>

  <h3>② 반기·연간 정산보고서 (운영위원회 보고용)</h3>
  <p>전체 원아를 한 장에 담은 표입니다. <b>보호자별 수납액·실 사용금액·남은 금액</b>이 나오고,
    맨 아래 <b>미집행액 합계</b>까지 계산됩니다.</p>
  <p>하반기를 고르면 <b>「전반기 이월」 열이 자동으로 생깁니다.</b>
    3월에 1년치를 한꺼번에 받았더라도 하반기 보고서가 제대로 읽힙니다.</p>

  <h3>③ 보호자용 개별 안내문</h3>
  <p>아이 한 명 것만 한 장으로 뽑습니다. <b>「전체 원아 한 장씩」</b>을 체크하고 인쇄하면
    아이마다 페이지가 나뉘어 한 번에 출력됩니다.</p>

  <h2>9. 대장 — 기존 양식 그대로</h2>
  <p><b>개인별 원아 수입대장</b>과 <b>지출대장</b>을 세목별로 뽑습니다.
    가로줄이 원아, 세로줄이 3월부터 익년 2월까지 12개월입니다.</p>
  <p>이 표는 <b>지출 등록에서 배분된 결과가 자동으로 채워진 것</b>입니다. 따로 옮겨 적을 필요가 없습니다.</p>

  <h2>10. 검증 — 뽑기 전에 한 번 보기</h2>
  <p>서류를 내기 전에 <b>검증</b> 탭을 한 번 눌러 보세요. 대사 숫자와 어린이집 부담이 나오고,
    걸리는 것이 있으면 목록으로 알려 줍니다.</p>
  <table>
    <thead><tr><th>등급</th><th>뜻</th></tr></thead>
    <tbody>
      <tr><td><b>오류</b></td><td>반드시 고쳐야 합니다. 「이동」을 눌러 그 자리로 갑니다.</td></tr>
      <tr><td><b>주의</b></td><td>확인이 필요합니다. 사정에 따라 정상일 수도 있습니다.</td></tr>
      <tr><td><b>기록</b></td><td>정산 화면에서 사유를 달아 결정한 내용입니다. 근거로 남깁니다.</td></tr>
    </tbody>
  </table>
  <blockquote>위탁 원아가 있으면 <b>221목 수납 합계와 421목 지출 합계가 다른 것이 정상</b>입니다.
    전입금으로 충당한 부분이 있기 때문입니다.</blockquote>

  <h2>11. 자주 겪는 상황</h2>
  <p>구체적인 상황별 대처는 <b>사용설명서 → 🧭 상황별 안내</b>에서 검색해 보세요.
    중간입소·중간퇴소·위탁 전환·카드수수료·나눠떨어지지 않는 금액 등 ${FAQ.length}가지 상황을 정리해 두었습니다.</p>

  <p class="law" style="margin-top:30px">근거 — 「2026년도 보육사업안내」 본문·부록,
    「2025년 어린이집 재무회계 매뉴얼」, 「사회복지법인 및 사회복지시설 재무·회계 규칙」,
    「영유아보육법」 제38조 및 같은 법 시행규칙 제35조의9.</p>`;
}

function openModal(title, bodyNode, onOk, extraButtons){
  const mask = el(`<div class="mask"><div class="modal">
    <header><h1>${esc(title)}</h1></header>
    <div class="body"></div>
    <div class="foot"></div>
  </div></div>`);
  $(".body", mask).appendChild(bodyNode);

  const foot = $(".foot", mask);
  for (const b of (extraButtons || [])) {
    const btn = el(`<button class="b no-print">${esc(b.label)}</button>`);
    btn.onclick = b.fn;
    foot.appendChild(btn);
  }
  const close = el(`<button class="b">${onOk ? "취소" : "닫기"}</button>`);
  close.onclick = () => mask.remove();
  foot.appendChild(close);

  if (onOk) {
    const ok = el(`<button class="b pri">저장</button>`);
    ok.onclick = () => { if (onOk() !== false) mask.remove(); };
    foot.appendChild(ok);
  }
  mask.onclick = e => { if (e.target === mask) mask.remove(); };
  document.addEventListener("keydown", function esckey(e){
    if (e.key === "Escape") { mask.remove(); document.removeEventListener("keydown", esckey); }
  });
  $("#modalHost").appendChild(mask);
}

/** 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM을 붙인 CSV */
function downloadCSV(filename, rows){
  const body = rows.map(r => r.map(cell => {
    const s = String(cell ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
  downloadBlob(filename, "﻿" + body, "text/csv;charset=utf-8");
}
function downloadBlob(filename, text, mime){
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function initHeader(){
  const sel = $("#fyPick");
  const base = defaultFiscalYear();
  const years = new Set([S.fiscalYear]);
  for (let y = base - 3; y <= base + 2; y++) years.add(y);
  sel.innerHTML = Array.from(years).sort((a, b) => a - b)
    .map(y => `<option value="${y}" ${y === S.fiscalYear ? "selected" : ""}>${y}년도</option>`).join("");
  sel.onchange = e => { S.fiscalYear = parseInt(e.target.value, 10); save(); render(); };

  $("#btnExport").onclick = () => {
    downloadBlob(`필요경비정산_백업_${S.fiscalYear}년도_${todayISO()}.json`,
      JSON.stringify(S, null, 2), "application/json");
  };
  $("#btnImport").onclick = () => $("#fileImport").click();
  $("#fileImport").onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.children)) throw new Error("형식이 맞지 않습니다");
        if (!confirm("복원하면 지금 저장된 내용이 모두 덮어써집니다. 계속할까요?")) return;
        S = Object.assign(defaultStore(), data);
        save(); initHeader(); render();
        alert("복원했습니다.");
      } catch (err) {
        alert("복원 실패 — " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  $("#btnReset").onclick = () => {
    if (!confirm("모든 데이터를 지웁니다. 먼저 JSON 백업을 받아 두었나요?")) return;
    if (!confirm("정말 초기화할까요? 되돌릴 수 없습니다.")) return;
    S = defaultStore(); save(); initHeader(); render();
  };
}

/** 금액 입력칸을 입력하는 동안 세 자리마다 콤마로 끊어 보여준다 */
document.addEventListener("input", e => {
  if (!e.target.classList || !e.target.classList.contains("money")) return;
  const v = num(e.target.value);
  const pos = e.target.selectionStart;
  const before = e.target.value.length;
  e.target.value = v === 0 && e.target.value.trim() === "" ? "" : won(v);
  const after = e.target.value.length;
  const p = Math.max(0, pos + (after - before));
  try { e.target.setSelectionRange(p, p); } catch (_) {}
});
