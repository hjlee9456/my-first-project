}

/* ==========================================================================
   8. 원아 선택기
   ========================================================================== */

/**
 * 반별로 묶인 체크박스 그리드.
 * date를 주면 그날 재원기간 밖 원아는 선택할 수 없게 잠근다.
 */
function buildPicker(host, opts){
  const selected = opts.selected;
  const date = opts.date || null;
  const unlock = opts.unlock || new Set();   // 정산 화면에서 사유를 달아 포함시킨 원아
  const onChange = opts.onChange || (() => {});

  host.innerHTML = `
    <div class="row no-print" style="margin-bottom:6px">
      <button class="b" data-a="all">전체 선택</button>
      <button class="b" data-a="none">전체 해제</button>
      <span class="grow"></span>
      <span class="hint" data-r="count"></span>
    </div>
    <div class="picker" data-r="body"></div>`;

  const bodyEl = $('[data-r="body"]', host);
  const countEl = $('[data-r="count"]', host);

  function selectable(c){ return !date || isEnrolled(c, date) || unlock.has(c.id); }

  function refresh(){
    const n = sortedChildren().filter(c => selected.has(c.id)).length;
    countEl.textContent = "선택 " + n + "명";
    onChange();
  }

  function draw(){
    bodyEl.innerHTML = "";
    const groups = S.classes.map(cl => ({ cl, list: [] }));
    const noClass = { cl: null, list: [] };
    for (const c of sortedChildren()) {
      const cls = date ? classAt(c, date) : currentClass(c);
      const g = cls ? groups.find(x => x.cl.id === cls.id) : null;
      (g || noClass).list.push(c);
    }
    const all = groups.concat(noClass.list.length ? [noClass] : []);
    if (!all.some(g => g.list.length)) { bodyEl.innerHTML = `<div class="empty">원아가 없습니다.</div>`; return; }

    for (const g of all) {
      if (!g.list.length) continue;
      const box = el(`<div class="pk-class">
        <div class="pk-head">
          <span>${g.cl ? esc(g.cl.name) : "반 미지정"}</span>
          <button class="b" style="padding:2px 8px;font-size:11px" data-a="g-all">이 반 전체</button>
          <button class="b" style="padding:2px 8px;font-size:11px" data-a="g-none">해제</button>
        </div>
        <div class="pk-list"></div></div>`);
      const listEl = $(".pk-list", box);
      for (const c of g.list) {
        const ok = selectable(c);
        const forced = date && unlock.has(c.id) && !isEnrolled(c, date);
        const reason = !ok ? (date < (c.admitDate || "") ? "입소 전" : "퇴소 후") : "";
        const item = el(`<label class="pk-item ${ok ? "" : "dis"}" title="${esc(reason)}">
          <input type="checkbox" ${selected.has(c.id) ? "checked" : ""} ${ok ? "" : "disabled"}>
          <span>${esc(c.name)}</span>
          ${date && isConsign(c, date) ? '<span class="tag consign">위탁</span>' : ""}
          ${forced ? '<span class="tag ev">정산 포함</span>' : ""}
          ${ok ? "" : `<span class="tag">${esc(reason)}</span>`}
        </label>`);
        $("input", item).onchange = e => {
          if (e.target.checked) selected.add(c.id); else selected.delete(c.id);
          refresh();
        };
        listEl.appendChild(item);
      }
      $('[data-a="g-all"]',  box).onclick = () => { g.list.filter(selectable).forEach(c => selected.add(c.id)); draw(); refresh(); };
      $('[data-a="g-none"]', box).onclick = () => { g.list.forEach(c => selected.delete(c.id)); draw(); refresh(); };
      bodyEl.appendChild(box);
    }
  }

  $('[data-a="all"]',  host).onclick = () => { S.children.filter(selectable).forEach(c => selected.add(c.id)); draw(); refresh(); };
  $('[data-a="none"]', host).onclick = () => { selected.clear(); draw(); refresh(); };

  draw(); refresh();
  return { redraw: () => { draw(); refresh(); } };
}

/* ==========================================================================
   9. 수납 입력 — 수납결의서 1건 단위
   ========================================================================== */

/**
 * 수납 입력 — 수입결의서 1장을 그대로 옮겨 적는다.
 *
 * 실제 수입결의서는 한 장에 여러 세목이 섞여 있다. 관·항·목은 「수익자부담수입 /
 * 기타필요경비 / 기타필요경비」로 하나이고, 입학준비금·현장학습비·행사비는
 * 적요에 나란히 적힌다. 그래서 화면도 세목 칸을 여럿 둔다.
 *
 * 저장할 때는 세목마다 결의서 하나로 나눠 담되, 수납일·결의서 번호·적요를
 * 같이 준다. 정산과 대장은 세목별로만 뜻이 있으므로(세목 간 상계 금지) 나눠
 * 담는 편이 맞고, 화면과 목록에서는 같은 번호로 묶여 한 장처럼 보인다.
 */
function renderReceipt(root){
  const items = enabledItems();
  if (!items.length) { root.innerHTML = `<div class="empty">사용 중인 세목이 없습니다. 기초설정에서 세목을 켜 주세요.</div>`; return; }
  if (!S.children.length) { root.innerHTML = `<div class="empty">원아가 없습니다. 기초설정에서 원아를 등록하세요.</div>`; return; }

  /* 고칠 때는 같은 날·같은 번호의 결의서를 통째로 불러온다 (한 장이었으므로) */
  const editing = view.receiptEditId ? S.vouchers.find(x => x.id === view.receiptEditId) : null;
  const group = editing ? voucherGroup(editing) : [];

  const blockOf = v => ({
    itemId: v.itemId, perAmount: v.perAmount || 0, cardFee: v.cardFee || 0,
    lines: v.lines.map(l => Object.assign({}, l)),
    targets: new Set(v.lines.map(l => l.childId)),
  });
  const emptyBlock = () => ({ itemId: items[0].id, perAmount: 0, cardFee: 0, lines: [], targets: new Set() });

  const f = view.receiptForm = editing
    ? { date: editing.date, voucherNo: editing.voucherNo, summary: editing.summary,
        editIds: group.map(v => v.id), blocks: group.map(blockOf) }
    : Object.assign({ date: todayISO(), voucherNo: "", summary: "", editIds: [], blocks: [emptyBlock()] },
                    view.receiptForm && view.receiptForm.keep ? view.receiptForm : {});
  delete f.keep;
  if (!Array.isArray(f.blocks) || !f.blocks.length) f.blocks = [emptyBlock()];
  f.blocks.forEach(bk => {
    if (!(bk.targets instanceof Set)) bk.targets = new Set(bk.targets || []);
    if (!Array.isArray(bk.lines)) bk.lines = [];
    if (!items.some(i => i.id === bk.itemId)) bk.itemId = items[0].id;
  });

  root.innerHTML = `
    <h2>수납 입력 ${editing ? '<span class="tag ev">수정 중</span>' : ""}</h2>
    <div class="hint">수입결의서 <b>1장</b>을 그대로 옮겨 적습니다.
      한 장에 <b>여러 세목</b>이 섞여 있으면 「세목 칸 추가」로 늘리세요.
      저장하면 세목마다 나뉘어 담기되 <b>같은 결의서 번호</b>로 묶입니다.</div>

    <h3>1. 결의서 입력</h3>
    <div class="row" style="margin:12px 0">
      <label class="f">수납일<input type="date" id="rc_date" value="${esc(f.date)}"></label>
      <label class="f">수입결의서 번호<input id="rc_no" value="${esc(f.voucherNo)}" placeholder="예: 6" style="width:130px"></label>
      <label class="f grow">적요<input id="rc_summary" value="${esc(f.summary)}" placeholder="예: 기타필요경비 아이행복카드 결제분"></label>
    </div>

    <div id="rc_blocks"></div>

    <div class="row" style="margin-top:10px">
      <button class="b" id="rc_addBlock">+ 세목 칸 추가</button>
      <span class="hint" style="margin-bottom:6px">한 결의서에 여러 세목이 섞여 있을 때 누르세요.</span>
    </div>

    <div id="rc_grand" style="margin-top:12px"></div>

    <div class="row" style="margin-top:12px">
      <button class="b pri" id="rc_save">${editing ? "수정 저장" : "수입결의서 등록"}</button>
      ${editing ? '<button class="b" id="rc_cancel">수정 취소</button>' : ""}
      <span class="grow"></span>
      <span class="hint" id="rc_guard"></span>
    </div>

    <h3>수납결의서 내역</h3>
    <div id="rc_list"></div>`;

  $("#rc_date", root).onchange   = e => { f.date = e.target.value; f.keep = true; render(); };
  $("#rc_no", root).oninput      = e => { f.voucherNo = e.target.value; };
  $("#rc_summary", root).oninput = e => { f.summary = e.target.value; };
  $("#rc_addBlock", root).onclick = () => { f.blocks.push(emptyBlock()); f.keep = true; render(); };

  const blocksHost = $("#rc_blocks", root);
  const pickers = [];
  f.blocks.forEach((bk, bi) => blocksHost.appendChild(receiptBlock(bk, bi)));
  drawGrand();

  /** 세목 칸 하나 — 세목·대상 원아·금액을 한 덩어리로 묶는다 */
  function receiptBlock(bk, bi){
    const it = itemById(bk.itemId);
    const box = el(`<div class="blk" style="margin-top:14px">
      <div class="row" style="margin-bottom:8px">
        <label class="f">세목<select data-r="item" style="width:200px">
          ${items.map(i => `<option value="${i.id}" ${i.id === bk.itemId ? "selected" : ""}>${esc(i.name)}</option>`).join("")}
        </select></label>
        <span class="hint" style="margin-bottom:6px">${it ? esc(cycleLabel(it)) : ""}${
          it && it.stdAmount ? " · 1인당 " + won(it.stdAmount) + "원" : ""}</span>
        <span class="grow"></span>
        ${f.blocks.length > 1 ? `<button class="b danger" data-r="drop">이 세목 칸 빼기</button>` : ""}
      </div>
      ${it && it.note ? `<div class="note">${esc(it.name)} — ${esc(it.note)}</div>` : ""}
      <div class="row" style="margin-bottom:6px">
        <select data-r="roster" style="width:250px"></select>
        <button class="b" data-r="loadRoster">명단 불러오기</button>
        <span class="grow"></span>
        <button class="b" data-r="saveRoster">선택 원아를 명단으로 저장</button>
      </div>
      <div data-r="pick"></div>
      <div class="row" style="margin-top:10px">
        <label class="f">1인당 수납액<input class="money" data-r="per" value="${won(bk.perAmount)}" style="width:130px"></label>
        <button class="b" data-r="apply" style="margin-bottom:1px">선택한 원아에게 일괄 적용</button>
        ${it && it.stdAmount ? `<button class="b" data-r="std" style="margin-bottom:1px">기초설정 금액 ${won(it.stdAmount)}원 쓰기</button>` : ""}
        <label class="f">카드수수료<input class="money" data-r="fee" value="${won(bk.cardFee)}" style="width:120px"></label>
      </div>
      <div data-r="feeNote"></div>
      <div data-r="lines" style="margin-top:10px"></div>
    </div>`);

    $('[data-r="item"]', box).onchange = e => { bk.itemId = e.target.value; f.keep = true; render(); };
    const dropBtn = $('[data-r="drop"]', box);
    if (dropBtn) dropBtn.onclick = () => { f.blocks.splice(bi, 1); f.keep = true; render(); };

    const rosterSel = $('[data-r="roster"]', box);
    rosterSel.innerHTML = S.rosters.length
      ? S.rosters.map(r => `<option value="${r.id}">${esc(r.name)} (${won(r.childIds.length)}명${r.itemId ? " · " + esc(itemName(r.itemId)) : ""})</option>`).join("")
      : `<option value="">— 저장된 명단 없음 —</option>`;

    function lineOf(childId){
      let l = bk.lines.find(x => x.childId === childId);
      if (!l) { l = { childId, amount: bk.perAmount, memo: "" }; bk.lines.push(l); }
      return l;
    }
    function syncLines(){
      bk.lines = bk.lines.filter(l => bk.targets.has(l.childId));
      for (const id of bk.targets) lineOf(id);
    }

    const picker = buildPicker($('[data-r="pick"]', box), {
      selected: bk.targets, date: f.date,
      onChange: () => { syncLines(); drawLines(); },
    });
    pickers[bi] = picker;

    $('[data-r="loadRoster"]', box).onclick = () => {
      const r = S.rosters.find(x => x.id === rosterSel.value);
      if (!r) { alert("불러올 명단이 없습니다. 기초설정에서 고정 명단을 먼저 만드세요."); return; }
      bk.targets.clear();
      r.childIds.forEach(id => { const c = childById(id); if (c && isEnrolled(c, f.date)) bk.targets.add(id); });
      syncLines(); picker.redraw(); drawLines();
    };
    $('[data-r="saveRoster"]', box).onclick = () => {
      if (!bk.targets.size) { alert("선택된 원아가 없습니다."); return; }
      askText("고정 명단으로 저장", "명단 이름", itemName(bk.itemId) + " 수납 대상", name => {
        S.rosters.push({ id: uid("rs"), name, itemId: bk.itemId,
                         childIds: sortedChildren().filter(c => bk.targets.has(c.id)).map(c => c.id) });
        f.keep = true; save(); render();
      });
    };

    /* 1인당 수납액을 고른 원아에게 채운다.
       순액 방식이면 카드수수료를 원아 수로 나눠(나머지는 앞에서부터 1원) 빼 준다. */
    function applyPer(per){
      bk.perAmount = per;
      $('[data-r="per"]', box).value = won(per);
      syncLines();
      const ids = sortedChildren().filter(c => bk.targets.has(c.id)).map(c => c.id);
      if (!isGross() && bk.cardFee > 0 && ids.length) {
        const share = new Map(allocate(bk.cardFee, ids).map(a => [a.childId, a.amount]));
        bk.lines.forEach(l => l.amount = per - (share.get(l.childId) || 0));
      } else {
        bk.lines.forEach(l => l.amount = per);
      }
      drawLines();
    }
    $('[data-r="per"]', box).onchange = e => { bk.perAmount = num(e.target.value); e.target.value = won(bk.perAmount); };
    $('[data-r="fee"]', box).onchange = e => { bk.cardFee = num(e.target.value); e.target.value = won(bk.cardFee); drawLines(); };
    $('[data-r="apply"]', box).onclick = () => applyPer(num($('[data-r="per"]', box).value));
    const stdBtn = $('[data-r="std"]', box);
    if (stdBtn) stdBtn.onclick = () => applyPer(it.stdAmount);

    function drawLines(){
      syncLines();
      const host = $('[data-r="lines"]', box);
      const ordered = sortedChildren().filter(c => bk.targets.has(c.id));
      if (!ordered.length) {
        host.innerHTML = `<div class="note warn">수납 대상 원아를 선택하세요.</div>`;
        drawFeeNote(); drawGrand(); return;
      }
      const t = el(`<table><thead><tr>
        <th class="c" style="width:50px">순번</th><th style="width:120px">성명</th><th style="width:100px">반</th>
        <th class="n" style="width:140px">수납액</th><th>비고</th>
        <th class="c" style="width:60px"></th></tr></thead><tbody></tbody></table>`);
      const tb = $("tbody", t);
      let sum = 0;
      ordered.forEach((c, i) => {
        const l = lineOf(c.id);
        sum += l.amount;
        const cls = classAt(c, f.date) || currentClass(c);
        const tr = el(`<tr>
          <td class="c">${i + 1}</td><td class="ui-center"><b>${esc(c.name)}</b></td><td class="ui-center">${cls ? esc(cls.name) : "-"}</td>
          <td class="n"><input class="money" value="${won(l.amount)}" style="width:120px"></td>
          <td class="ui-prose"><input value="${esc(l.memo || "")}" style="width:100%" placeholder="—"></td>
          <td class="c"><button class="b danger" title="이 결의서에서 빼기">×</button></td></tr>`);
        $("input.money", tr).onchange = e => { l.amount = num(e.target.value); e.target.value = won(l.amount); drawLines(); };
        $$("input", tr)[1].onchange = e => { l.memo = e.target.value; };
        $("button", tr).onclick = () => { bk.targets.delete(c.id); syncLines(); picker.redraw(); drawLines(); };
        tb.appendChild(tr);
      });
      tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c">${esc(itemName(bk.itemId))} 소계</td>
        <td class="n">${won(sum)}</td><td colspan="2">${won(ordered.length)}명</td></tr>`));
      host.innerHTML = "";
      host.appendChild(t);
      drawFeeNote(); drawGrand();
    }

    /** 카드 승인액 · 수수료 · 통장 입금액이 어떻게 맞물리는지 적어 준다 */
    function drawFeeNote(){
      const host = $('[data-r="feeNote"]', box);
      const sum = bk.lines.filter(l => bk.targets.has(l.childId)).reduce((s2, l) => s2 + l.amount, 0);
      const fee = bk.cardFee || 0;
      const m = CARD_FEE_MODES[cardFeeMode()];
      if (!fee) {
        host.innerHTML = `<div class="hint" style="margin-top:6px">카드로 받은 건이면 <b>카드수수료</b>를 적어 두세요.
          지금은 <b>${esc(m.label)}</b>(${esc(m.short)})으로 맞춰져 있습니다 — 기초설정에서 바꿉니다.</div>`;
        return;
      }
      const gross = isGross() ? sum : sum + fee;
      const bank  = isGross() ? sum - fee : sum;
      host.innerHTML = `<div class="note" style="margin-top:8px">
        <b>${esc(m.label)}</b> — 카드 승인액 <b>${won(gross)}원</b> − 수수료 <b>${won(fee)}원</b>
        = 통장 입금 <b>${won(bank)}원</b> · 정산에 잡히는 <b>수납액은 ${won(sum)}원</b>입니다.
        ${isGross() ? `수수료는 <b>운영비에서 따로 지출결의</b>로 빼세요.`
                    : `「일괄 적용」을 누르면 1인당 수납액에서 수수료 몫을 빼서 채웁니다.`}</div>`;
    }

    drawLines();
    return box;
  }

  /** 결의서 한 장의 총액 — 사진 속 수입결의서의 「금 ○○원정」 자리 */
  function drawGrand(){
    const host = $("#rc_grand", root);
    const guard = $("#rc_guard", root), btn = $("#rc_save", root);
    if (!host) return;
    const rows = f.blocks.map(bk => ({
      name: itemName(bk.itemId),
      n: bk.lines.filter(l => bk.targets.has(l.childId) && l.amount).length,
      sum: bk.lines.filter(l => bk.targets.has(l.childId)).reduce((s2, l) => s2 + l.amount, 0),
      fee: bk.cardFee || 0,
    })).filter(r => r.n || r.sum);
    const total = rows.reduce((s2, r) => s2 + r.sum, 0);
    const feeAll = rows.reduce((s2, r) => s2 + r.fee, 0);

    if (!rows.length) {
      host.innerHTML = `<div class="note warn">수납 대상 원아를 선택해야 등록할 수 있습니다.</div>`;
      if (guard) guard.textContent = "대상 원아를 선택해야 등록할 수 있습니다.";
      if (btn) btn.disabled = true;
      return;
    }
    const dup = f.blocks.map(b2 => b2.itemId).filter((v2, i, arr) => arr.indexOf(v2) !== i);
    host.innerHTML = `
      <table style="max-width:620px"><thead><tr>
        <th>세목</th><th class="c" style="width:70px">인원</th><th class="n" style="width:140px">수납액</th>
      </tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(r.name)}</td><td class="c">${won(r.n)}명</td>
          <td class="n">${won(r.sum)}</td></tr>`).join("")}
        <tr class="sum"><td class="c">이 결의서 합계</td><td class="c">${won(rows.length)}개 세목</td>
          <td class="n"><b>${won(total)}원</b></td></tr>
      </tbody></table>
      ${feeAll ? `<div class="hint" style="margin-top:4px">카드수수료 합계 ${won(feeAll)}원</div>` : ""}
      ${dup.length ? `<div class="note warn">같은 세목 칸이 두 번 있습니다 — <b>${esc(itemName(dup[0]))}</b>.
        한 세목은 한 칸에 모아 적으세요.</div>` : ""}`;
    const zero = f.blocks.reduce((s2, bk) =>
      s2 + bk.lines.filter(l => bk.targets.has(l.childId) && l.amount === 0).length, 0);
    if (guard) guard.textContent = dup.length ? "같은 세목 칸이 겹칩니다"
      : zero ? `${won(zero)}명의 수납액이 0원입니다 — 그대로 저장하면 그 원아는 기록되지 않습니다` : "";
    if (btn) btn.disabled = dup.length > 0;
  }

  $("#rc_save", root).onclick = () => {
    if (!f.date) { alert("수납일을 입력하세요."); return; }
    const recs = [];
    for (const bk of f.blocks) {
      const ordered = sortedChildren().filter(c => bk.targets.has(c.id));
      const lines = ordered.map(c => {
        const l = bk.lines.find(x => x.childId === c.id) || { amount: 0, memo: "" };
        return { childId: c.id, amount: l.amount, memo: l.memo || "" };
      }).filter(l => l.amount !== 0);
      if (!lines.length) continue;
      recs.push({ id: uid("vc"), date: f.date, voucherNo: (f.voucherNo || "").trim(),
                  itemId: bk.itemId, summary: (f.summary || "").trim(),
                  perAmount: bk.perAmount, cardFee: bk.cardFee || 0, lines,
                  total: lines.reduce((s2, l) => s2 + l.amount, 0) });
    }
    if (!recs.length) { alert("수납액이 0원이 아닌 원아가 하나도 없습니다."); return; }

    /* 고치던 중이면 그 묶음을 통째로 갈아 끼운다 */
    const drop = new Set(f.editIds || []);
    S.vouchers = S.vouchers.filter(v => !drop.has(v.id)).concat(recs);
    rebuildReceipts();

    view.receiptEditId = null;
    view.receiptForm = null;
    highlightVoucherId = recs[0].id;
    save(); render();
  };
  if (editing) $("#rc_cancel", root).onclick = () => { view.receiptEditId = null; view.receiptForm = null; render(); };

  renderVoucherList($("#rc_list", root));
}

/**
 * 한 장이었던 결의서를 되찾는다 — 같은 날·같은 번호면 한 장에 적혀 있던 것이다.
 * 번호를 비워 둔 것은 묶을 근거가 없으므로 그 건만 본다.
 */
function voucherGroup(v){
  if (!v) return [];
  const no = (v.voucherNo || "").trim();
  if (!no) return [v];
  const order = new Map(S.items.map((it, i) => [it.id, i]));
  return S.vouchers
    .filter(x => x.date === v.date && (x.voucherNo || "").trim() === no)
    .sort((a, b) => (order.has(a.itemId) ? order.get(a.itemId) : 999)
                  - (order.has(b.itemId) ? order.get(b.itemId) : 999));
}

/** 수납결의서에서 원아별 수납 기록을 다시 만든다. receipts는 결의서에서 파생된 값이다. */
function rebuildReceipts(){
  S.receipts = [];
  for (const v of S.vouchers) {
    /* 결의서 전체 카드수수료를 원아별로 나눠 둔다. 보호자에게 보내는 서류는
       통장에 들어온 금액이 아니라 「보호자가 실제로 결제한 금액」을 적어야 하는데,
       그 금액이 곧 수납액 + 그 원아 몫의 수수료다. */
    const fee = v.cardFee || 0;
    const share = fee
      ? new Map(allocate(fee, v.lines.map(l => l.childId)).map(a => [a.childId, a.amount]))
      : null;
    for (const l of v.lines) {
      if (!l.amount) continue;
      S.receipts.push({ id: v.id + "_" + l.childId, voucherId: v.id, voucherNo: v.voucherNo,
                        childId: l.childId, itemId: v.itemId, date: v.date,
                        amount: l.amount, fee: share ? (share.get(l.childId) || 0) : 0,
                        memo: l.memo || "" });
    }
  }
}

/**
 * 보호자가 실제로 결제한 금액과 그중 카드수수료.
 *
 * 순액 방식에서는 수납액이 「통장에 들어온 돈」이라 보호자가 카드로 긁은 금액보다
 * 수수료만큼 적다. 보호자에게 보내는 서류에 통장 금액을 적으면
 * 「나는 37,000원을 냈는데 왜 36,997원이라고 적혀 있나」가 된다.
 * 그래서 보호자용 서류에서는 결제액(= 수납액 + 수수료)을 적고 수수료를 따로 보여 준다.
 *
 * 총액 방식에서는 수납액 자체가 이미 결제액이므로 수수료 칸이 0이 된다.
 */
function parentCharge(childId, itemId, from, to){
  let paid = 0, fee = 0;
  for (const r of S.receipts) {
    if (r.childId !== childId || (itemId && r.itemId !== itemId)) continue;
    if (!inRange(r.date, from, to)) continue;
    paid += r.amount;
    if (!isGross()) fee += r.fee || 0;
  }
  return { paid, fee, charged: paid + fee };
}

/**
 * 기록을 세목별로 묶고, 묶음 안에서는 최근 것부터 놓는다.
 * 세목 순서는 기초설정에 적어 둔 차례를 그대로 따른다.
 */
function groupByItem(list){
  const order = new Map(S.items.map((it, i) => [it.id, i]));
  return list.slice().sort((a, b) =>
    (order.has(a.itemId) ? order.get(a.itemId) : 999) - (order.has(b.itemId) ? order.get(b.itemId) : 999)
    || b.date.localeCompare(a.date)
    || (b.voucherNo || "").localeCompare(a.voucherNo || ""));
}

function renderVoucherList(host){
  const fy = S.fiscalYear, from = fyStart(fy), to = fyEnd(fy);
  const v = view.receiptFilter = Object.assign({ itemId: "" }, view.receiptFilter || {});
  /* 세목별로 묶고, 그 안에서 최근 것부터 */
  const rows = groupByItem(
    S.vouchers.filter(x => inRange(x.date, from, to) && (!v.itemId || x.itemId === v.itemId)));

  host.innerHTML = `<div class="row no-print" style="margin-bottom:8px">
      <label class="f">세목으로 걸러 보기<select id="rcf_item" style="width:220px">
        <option value="">전체</option>
        ${S.items.map(i => `<option value="${i.id}" ${i.id === v.itemId ? "selected" : ""}>${esc(i.name)}</option>`).join("")}
      </select></label>
      <span class="grow"></span>
      <button class="b" id="rcf_csv">CSV 저장</button>
    </div>
    <div id="rcf_body"></div>`;
  $("#rcf_item", host).onchange = e => { v.itemId = e.target.value; render(); };

  const body = $("#rcf_body", host);
  if (!rows.length) { body.innerHTML = `<div class="empty">이 회계연도의 수납결의서가 없습니다.</div>`; return; }

  const t = el(`<table><thead><tr>
    <th class="c" style="width:100px">수납일</th><th class="c" style="width:70px">번호</th>
    <th>적요 · 대상 원아</th>
    <th class="n" style="width:120px">수입금액</th><th class="c" style="width:60px">인원</th>
    <th class="c" style="width:120px"></th></tr></thead><tbody></tbody></table>`);
  const tb = $("tbody", t);
  const csv = [["수납일", "결의서번호", "세목", "적요", "대상 원아", "수입금액", "인원"]];
  let total = 0, headItem = null, groupSum = 0, groupN = 0;
  const closeGroup = () => {
    if (!headItem) return;
    tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c">${esc(itemName(headItem))} 소계 (${won(groupN)}건)</td>
      <td class="n">${won(groupSum)}</td><td colspan="2"></td></tr>`));
    csv.push([itemName(headItem) + " 소계", "", "", "", "", groupSum, groupN]);
    groupSum = 0; groupN = 0;
  };

  for (const x of rows) {
    if (x.itemId !== headItem) { closeGroup(); headItem = x.itemId;
      tb.appendChild(el(`<tr class="sum"><td colspan="6"><b>${esc(itemName(x.itemId))}</b>
        <span class="tag">${esc((GROUPS[(itemById(x.itemId) || {}).group] || {}).income || "")}</span></td></tr>`)); }
    total += x.total; groupSum += x.total; groupN++;
    const mates = voucherGroup(x).filter(y => y.id !== x.id);
    const names = x.lines.map(l => childName(l.childId)).join(", ");
    const tr = el(`<tr class="${x.id === highlightVoucherId ? "hl" : ""}">
      <td class="ui-center c">${esc(x.date)}</td><td class="ui-center c">${esc(x.voucherNo || "-")}</td>
      <td class="ui-prose">${esc(x.summary || "-")}${x.cardFee
        ? ` <span class="tag">카드수수료 ${won(x.cardFee)}</span>` : ""}${mates.length
        ? ` <span class="tag ev">같은 결의서 ${won(mates.length + 1)}개 세목</span>` : ""}<div class="hint">${esc(names)}</div></td>
      <td class="n">${won(x.total)}</td><td class="c">${won(x.lines.length)}명</td>
      <td class="c">
        <button class="b" data-a="edit">수정</button>
        <button class="b danger" data-a="del">삭제</button>
      </td></tr>`);
    $('[data-a="edit"]', tr).onclick = () => { view.receiptEditId = x.id; view.receiptForm = null; render(); window.scrollTo(0, 0); };
    $('[data-a="del"]', tr).onclick = () => {
      const mates2 = voucherGroup(x).filter(y => y.id !== x.id);
      const msg = `${x.date} ${itemName(x.itemId)} 수납결의서${x.voucherNo ? " " + x.voucherNo + "번" : ""}을 삭제할까요?`
        + (mates2.length ? `\n\n같은 결의서(${x.voucherNo}번)에 다른 세목 ${mates2.length}개가 더 있습니다.\n`
            + `지금 고른 ${itemName(x.itemId)}만 지워지고 나머지는 남습니다.\n`
            + `— ${mates2.map(y => itemName(y.itemId)).join(", ")}` : "");
      if (!confirm(msg)) return;
      S.vouchers = S.vouchers.filter(y => y.id !== x.id);
      rebuildReceipts(); save(); render();
    };
    tb.appendChild(tr);
    csv.push([x.date, x.voucherNo, itemName(x.itemId), x.summary, names, x.total, x.lines.length]);
  }
  closeGroup();
  tb.appendChild(el(`<tr class="sum"><td colspan="3" class="c"><b>회계연도 수납 합계</b></td>
    <td class="n"><b>${won(total)}</b></td><td colspan="2"></td></tr>`));
  body.appendChild(t);
  csv.push(["합계", "", "", "", "", total, ""]);
  $("#rcf_csv", host).onclick = () => downloadCSV(`수납결의서내역_${fy}.csv`, csv);
  highlightVoucherId = null;
}
